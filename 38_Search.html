<script>

const Search = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    elements:new Map(),

    keyword:new Map(),

    history:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    element

){

    state.elements.set(

        name,

        element

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.elements.get(

        name

    );

}

/*=========================================================
KEYWORD
=========================================================*/

function keyword(

    name,

    value

){

    if(arguments.length===1){

        return state.keyword.get(

            name

        ) || "";

    }

    state.keyword.set(

        name,

        value

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    keyword(

        name,

        ""

    );

    const input=

        get(name);

    if(input){

        input.value="";

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    state,

    register,

    get,

    keyword,

    clear

};

})();

<script>

const SearchRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const input =

        document.createElement(

            "input"

        );

    input.type =

        "search";

    input.id =

        config.id ||

        config.name;

    input.name =

        config.name;

    input.placeholder =

        config.placeholder ||

        "Search...";

    input.className =

        config.className ||

        "rpn-search";

    input.autocomplete =

        "off";

    if(

        config.container

    ){

        document

        .getElementById(

            config.container

        )

        .appendChild(

            input

        );

    }

    Search.register(

        config.name,

        input

    );

    return input;

}

/*=========================================================
VALUE
=========================================================*/

function value(

    name,

    value

){

    const input =

        Search.get(name);

    if(

        !input

    ){

        return null;

    }

    if(arguments.length===1){

        return input.value;

    }

    input.value = value;

}

/*=========================================================
FOCUS
=========================================================*/

function focus(name){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.focus();

    }

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const input =

        Search.get(name);

    if(

        input &&

        input.parentNode

    ){

        input.parentNode.removeChild(

            input

        );

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    value,

    focus,

    remove

};

})();

<script>

const SearchEngine = (()=>{

"use strict";

/*=========================================================
SEARCH
=========================================================*/

function search(

    name,

    data,

    keyword

){

    keyword = String(

        keyword || ""

    )

    .toLowerCase()

    .trim();

    Search.keyword(

        name,

        keyword

    );

    if(

        keyword===""

    ){

        return data;

    }

    return data.filter(function(row){

        return Object

        .values(row)

        .join(" ")

        .toLowerCase()

        .includes(keyword);

    });

}

/*=========================================================
MATCH
=========================================================*/

function match(

    text,

    keyword

){

    return String(

        text || ""

    )

    .toLowerCase()

    .includes(

        String(

            keyword || ""

        )

        .toLowerCase()

    );

}

/*=========================================================
COUNT
=========================================================*/

function count(

    data,

    keyword

){

    return search(

        "_",

        data,

        keyword

    ).length;

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    Search.clear(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    search,

    match,

    count,

    reset

};

})();

<script>

const SearchHistory = (()=>{

"use strict";

const MAX_HISTORY = 10;

/*=========================================================
ADD
=========================================================*/

function add(

    name,

    keyword

){

    keyword =

        String(

            keyword || ""

        )

        .trim();

    if(

        keyword===""

    ){

        return;

    }

    let history =

        Search.state.history.get(

            name

        ) || [];

    history = history.filter(

        item=>item!==keyword

    );

    history.unshift(

        keyword

    );

    if(

        history.length>

        MAX_HISTORY

    ){

        history.length =

            MAX_HISTORY;

    }

    Search.state.history.set(

        name,

        history

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return Search.state.history.get(

        name

    ) || [];

}

/*=========================================================
LAST
=========================================================*/

function last(name){

    const history =

        get(name);

    return history.length

        ? history[0]

        : "";

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    Search.state.history.delete(

        name

    );

}

/*=========================================================
CLEAR ALL
=========================================================*/

function clearAll(){

    Search.state.history.clear();

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    add,

    get,

    last,

    clear,

    clearAll

};

})();

<script>

const SearchEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    name,

    event,

    callback

){

    const input =

        Search.get(name);

    if(

        !input ||

        typeof callback !==

        "function"

    ){

        return;

    }

    input.addEventListener(

        event,

        callback

    );

    listeners.set(

        name + ":" + event,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    name,

    event

){

    const input =

        Search.get(name);

    const key =

        name + ":" + event;

    const callback =

        listeners.get(key);

    if(

        input &&

        callback

    ){

        input.removeEventListener(

            event,

            callback

        );

    }

    listeners.delete(

        key

    );

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    name,

    event

){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.dispatchEvent(

            new Event(

                event

            )

        );

    }

}

/*=========================================================
ENABLE
=========================================================*/

function enable(name){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.disabled = false;

    }

}

/*=========================================================
DISABLE
=========================================================*/

function disable(name){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.disabled = true;

    }

}

/*=========================================================
FOCUS
=========================================================*/

function focus(name){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.focus();

    }

}

/*=========================================================
BLUR
=========================================================*/

function blur(name){

    const input =

        Search.get(name);

    if(

        input

    ){

        input.blur();

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    enable,

    disable,

    focus,

    blur

};

})();

<script>

const SearchApi = (()=>{

"use strict";

/*=========================================================
SEARCH
=========================================================*/

async function search(

    endpoint,

    keyword,

    parameter

){

    const payload =

        Object.assign(

            {},

            parameter || {},

            {

                keyword : keyword

            }

        );

    const result =

        await API.post(

            endpoint,

            payload

        );

    return result.data || [];

}

/*=========================================================
SUGGESTION
=========================================================*/

async function suggestion(

    endpoint,

    keyword

){

    const data =

        await search(

            endpoint,

            keyword

        );

    return data.slice(

        0,

        10

    );

}

/*=========================================================
COUNT
=========================================================*/

async function count(

    endpoint,

    keyword

){

    const data =

        await search(

            endpoint,

            keyword

        );

    return data.length;

}

/*=========================================================
EXISTS
=========================================================*/

async function exists(

    endpoint,

    keyword

){

    return (

        await count(

            endpoint,

            keyword

        )

    ) > 0;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    search,

    suggestion,

    count,

    exists

};

})();

<script>

const SearchTheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-search-default",

    light     : "rpn-search-light",

    dark      : "rpn-search-dark",

    corporate : "rpn-search-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(theme){

    if(

        themes[theme]

    ){

        current = theme;

        applyAll();

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY
=========================================================*/

function apply(name){

    const input =

        Search.get(name);

    if(

        !input

    ){

        return;

    }

    Object.values(themes)

    .forEach(function(css){

        input.classList.remove(css);

    });

    input.classList.add(

        themes[current]

    );

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    Search.state.elements

    .forEach(function(

        input,

        name

    ){

        apply(name);

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    css

){

    themes[name] = css;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    get,

    apply,

    applyAll,

    register

};

})();
