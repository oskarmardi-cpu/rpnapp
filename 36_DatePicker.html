<script>

const DatePicker = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    elements:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    element

){

    state.elements.set(

        name,

        element

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.elements.get(

        name

    );

}

/*=========================================================
VALUE
=========================================================*/

function value(

    name,

    value

){

    const input=get(name);

    if(!input){

        return null;

    }

    if(arguments.length===1){

        return input.value;

    }

    input.value=value;

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    const input=get(name);

    if(input){

        input.value="";

    }

}

/*=========================================================
TODAY
=========================================================*/

function today(name){

    const input=get(name);

    if(input){

        input.value=

        new Date()

        .toISOString()

        .split("T")[0];

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    state,

    register,

    get,

    value,

    clear,

    today

};

})();

<script>

const DatePickerRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const input =

        document.createElement(

            "input"

        );

    input.type = "date";

    input.id =

        config.id ||

        config.name;

    input.name =

        config.name;

    input.className =

        config.className ||

        "rpn-datepicker";

    input.value =

        config.value || "";

    if(

        config.min

    ){

        input.min =

            config.min;

    }

    if(

        config.max

    ){

        input.max =

            config.max;

    }

    if(

        config.required

    ){

        input.required = true;

    }

    if(

        config.disabled

    ){

        input.disabled = true;

    }

    if(

        config.readonly

    ){

        input.readOnly = true;

    }

    if(

        config.container

    ){

        document

        .getElementById(

            config.container

        )

        .appendChild(

            input

        );

    }

    DatePicker.register(

        config.name,

        input

    );

    return input;

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const input =

        DatePicker.get(name);

    if(

        input &&

        input.parentNode

    ){

        input.parentNode.removeChild(

            input

        );

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    remove

};

})();

<script>

const DatePickerCalendar = (()=>{

"use strict";

/*=========================================================
OPEN
=========================================================*/

function open(name){

    const input =

        DatePicker.get(name);

    if(!input){

        return;

    }

    input.focus();

    input.showPicker?.();

}

/*=========================================================
CLOSE
=========================================================*/

function close(name){

    const input =

        DatePicker.get(name);

    if(input){

        input.blur();

    }

}

/*=========================================================
TODAY
=========================================================*/

function today(name){

    DatePicker.today(name);

}

/*=========================================================
NEXT DAY
=========================================================*/

function nextDay(name){

    move(name,1);

}

/*=========================================================
PREVIOUS DAY
=========================================================*/

function previousDay(name){

    move(name,-1);

}

/*=========================================================
MOVE
=========================================================*/

function move(

    name,

    days

){

    const input =

        DatePicker.get(name);

    if(

        !input ||

        !input.value

    ){

        return;

    }

    const date =

        new Date(input.value);

    date.setDate(

        date.getDate()+days

    );

    input.value =

        date

        .toISOString()

        .split("T")[0];

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    open,

    close,

    today,

    nextDay,

    previousDay

};

})();

<script>

const DatePickerRange = (()=>{

"use strict";

/*=========================================================
SET MIN
=========================================================*/

function setMin(

    name,

    date

){

    const input =

        DatePicker.get(name);

    if(input){

        input.min = date;

    }

}

/*=========================================================
SET MAX
=========================================================*/

function setMax(

    name,

    date

){

    const input =

        DatePicker.get(name);

    if(input){

        input.max = date;

    }

}

/*=========================================================
SET RANGE
=========================================================*/

function setRange(

    name,

    min,

    max

){

    setMin(

        name,

        min

    );

    setMax(

        name,

        max

    );

}

/*=========================================================
LINK
=========================================================*/

function link(

    startName,

    endName

){

    const start =

        DatePicker.get(

            startName

        );

    const end =

        DatePicker.get(

            endName

        );

    if(

        !start ||

        !end

    ){

        return;

    }

    start.addEventListener(

        "change",

        function(){

            end.min =

                start.value;

        }

    );

    end.addEventListener(

        "change",

        function(){

            start.max =

                end.value;

        }

    );

}

/*=========================================================
CHECK
=========================================================*/

function valid(

    startName,

    endName

){

    const start =

        DatePicker.value(

            startName

        );

    const end =

        DatePicker.value(

            endName

        );

    if(

        !start ||

        !end

    ){

        return true;

    }

    return start <= end;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    setMin,

    setMax,

    setRange,

    link,

    valid

};

})();

<script>

const DatePickerValidation = (()=>{

"use strict";

const errors = new Map();

/*=========================================================
VALIDATE
=========================================================*/

function validate(

    name,

    rules

){

    clear(name);

    const input =

        DatePicker.get(name);

    if(!input){

        return false;

    }

    const value =

        input.value;

    if(

        rules.required &&

        value===""

    ){

        return error(

            name,

            "Date is required."

        );

    }

    if(

        rules.min &&

        value < rules.min

    ){

        return error(

            name,

            "Minimum date : " +

            rules.min

        );

    }

    if(

        rules.max &&

        value > rules.max

    ){

        return error(

            name,

            "Maximum date : " +

            rules.max

        );

    }

    return true;

}

/*=========================================================
ERROR
=========================================================*/

function error(

    name,

    message

){

    const input =

        DatePicker.get(name);

    if(input){

        input.classList.add(

            "is-invalid"

        );

    }

    errors.set(

        name,

        message

    );

    return false;

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    const input =

        DatePicker.get(name);

    if(input){

        input.classList.remove(

            "is-invalid"

        );

    }

    errors.delete(name);

}

/*=========================================================
CLEAR ALL
=========================================================*/

function clearAll(){

    errors.forEach(function(v,k){

        clear(k);

    });

}

/*=========================================================
HAS ERROR
=========================================================*/

function hasError(name){

    return errors.has(name);

}

/*=========================================================
GET ERROR
=========================================================*/

function getError(name){

    return errors.get(name);

}

/*=========================================================
GET ERRORS
=========================================================*/

function getErrors(){

    return Object.fromEntries(

        errors

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    validate,

    clear,

    clearAll,

    hasError,

    getError,

    getErrors

};

})();

<script>

const DatePickerEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    name,

    event,

    callback

){

    const input =

        DatePicker.get(name);

    if(

        !input ||

        typeof callback !==

        "function"

    ){

        return;

    }

    input.addEventListener(

        event,

        callback

    );

    listeners.set(

        name + ":" + event,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    name,

    event

){

    const input =

        DatePicker.get(name);

    const key =

        name + ":" + event;

    const callback =

        listeners.get(key);

    if(

        input &&

        callback

    ){

        input.removeEventListener(

            event,

            callback

        );

    }

    listeners.delete(

        key

    );

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    name,

    event

){

    const input =

        DatePicker.get(name);

    if(

        input

    ){

        input.dispatchEvent(

            new Event(

                event

            )

        );

    }

}

/*=========================================================
ENABLE
=========================================================*/

function enable(name){

    const input =

        DatePicker.get(name);

    if(

        input

    ){

        input.disabled = false;

    }

}

/*=========================================================
DISABLE
=========================================================*/

function disable(name){

    const input =

        DatePicker.get(name);

    if(

        input

    ){

        input.disabled = true;

    }

}

/*=========================================================
FOCUS
=========================================================*/

function focus(name){

    const input =

        DatePicker.get(name);

    if(

        input

    ){

        input.focus();

    }

}

/*=========================================================
BLUR
=========================================================*/

function blur(name){

    const input =

        DatePicker.get(name);

    if(

        input

    ){

        input.blur();

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    enable,

    disable,

    focus,

    blur

};

})();

<script>

const DatePickerTheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-datepicker-default",

    light     : "rpn-datepicker-light",

    dark      : "rpn-datepicker-dark",

    corporate : "rpn-datepicker-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(theme){

    if(

        themes[theme]

    ){

        current = theme;

        applyAll();

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY
=========================================================*/

function apply(name){

    const input =

        DatePicker.get(name);

    if(

        !input

    ){

        return;

    }

    Object.values(themes)

    .forEach(function(css){

        input.classList.remove(css);

    });

    input.classList.add(

        themes[current]

    );

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    DatePicker.state.elements

    .forEach(function(

        input,

        name

    ){

        apply(name);

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    css

){

    themes[name] = css;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    get,

    apply,

    applyAll,

    register

};

})();
