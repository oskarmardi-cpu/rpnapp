<!-- =====================================================
     RPN SYSTEM
     FORM PAGE
====================================================== -->

<div id="view-form" class="page" style="display:none;">

    <!-- HEADER -->

    <header class="page-header">

        <div>

            <h2>

                Input Transaction

            </h2>

            <p>

                Refurbished Product National System

            </p>

        </div>

        <div>

            <button
                id="btnBackDashboard"
                class="btn-icon">

                <i class="fa-solid fa-arrow-left"></i>

            </button>

        </div>

    </header>



    <!-- FORM MENU -->

    <section class="form-menu">

        <button
            id="tabPerbaikan"
            class="tab-button active">

            <i class="fa-solid fa-screwdriver-wrench"></i>

            <span>Perbaikan</span>

        </button>

        <button
            id="tabPenarikan"
            class="tab-button">

            <i class="fa-solid fa-truck-arrow-right"></i>

            <span>Penarikan</span>

        </button>

        <button
            id="tabPengiriman"
            class="tab-button">

            <i class="fa-solid fa-truck-fast"></i>

            <span>Pengiriman</span>

        </button>

        <button
            id="tabLoanPart"
            class="tab-button">

            <i class="fa-solid fa-box-open"></i>

            <span>Loan Part</span>

        </button>

    </section>



    <!-- =====================================================
         FORM CONTAINER
    ====================================================== -->

    <section
        id="transactionFormContainer"
        class="form-container">

        <!--
            Seluruh form akan di-render di sini.

            Perbaikan

            Penarikan

            Pengiriman

            Loan Part
        -->

    </section>



    <!-- =====================================================
         ACTION BUTTON
    ====================================================== -->

    <section class="form-action">

        <button
            id="btnSaveTransaction"
            class="btn-primary">

            <i class="fa-solid fa-floppy-disk"></i>

            <span>

                Simpan

            </span>

        </button>



        <button
            id="btnResetTransaction"
            class="btn-secondary">

            <i class="fa-solid fa-rotate-left"></i>

            <span>

                Reset

            </span>

        </button>

    </section>

</div>
