<style>

.sidebar{background:linear-gradient(180deg,#07152f 0%,#092b67 100%)!important;box-shadow:8px 0 28px rgba(7,21,47,.18)}.sidebar-topbar{height:70px!important;border-bottom:1px solid rgba(255,255,255,.09)!important}.sidebar-brand-mark{background:linear-gradient(135deg,#2563eb,#4f46e5)!important}.menu-item>a,.menu-title{border-radius:12px!important;transition:.2s!important}.menu-item>a:hover,.menu-title:hover{background:rgba(59,130,246,.14)!important;transform:translateX(2px)}.menu-item.active>a{background:linear-gradient(90deg,#2563eb,#1d4ed8)!important;box-shadow:0 8px 20px rgba(37,99,235,.24)!important}.nav-section-label{color:#7895c7!important;letter-spacing:1.4px}.sidebar-user{margin:12px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:16px!important;background:rgba(255,255,255,.055)!important}.sidebar-footer{border-top:1px solid rgba(255,255,255,.08)!important}

<script>
const Sidebar=(()=>{"use strict";function load(){const u=Auth.getUser();if(!u)return;const n=document.getElementById("sidebarUserName"),r=document.getElementById("sidebarUserRole"),p=document.getElementById("sidebarUserPhoto");if(n)n.textContent=u.FULLNAME||"Administrator";if(r)r.textContent=u.ROLE||"";if(p){p.src=u.PHOTO||"";p.onerror=()=>{p.removeAttribute("src");p.classList.add("avatar-fallback");};}permission();}function permission(){const u=Auth.getUser(),a=document.getElementById("menuAdmin");if(u&&a)a.style.display=u.ROLE==="ADMIN"?"":"none";}function badge(id,value){const e=document.getElementById(id);if(!e)return;e.textContent=value??"";e.style.display=Number(value)>0?"inline-flex":"none";}function toggle(force){const b=document.body,m=window.matchMedia("(max-width:767px)").matches;if(m)b.classList.toggle("sidebar-mobile-open",force===undefined?undefined:!!force);else b.classList.toggle("sidebar-collapse",force===undefined?undefined:!!force);}function closeMobile(){document.body.classList.remove("sidebar-mobile-open");}document.addEventListener("click",e=>{if(window.innerWidth>767)return;const s=document.getElementById("app-sidebar"),t=document.getElementById("sidebarToggle");if(document.body.classList.contains("sidebar-mobile-open")&&s&&!s.contains(e.target)&&t&&!t.contains(e.target))closeMobile();});window.addEventListener("resize",()=>{if(window.innerWidth>767)closeMobile();});return{load,permission,badge,toggle,closeMobile};})();
</script>
