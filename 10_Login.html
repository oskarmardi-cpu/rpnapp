<div id="view-login" class="login-wrapper rpn-login">

    <div class="login-background" aria-hidden="true">
        <div class="login-orb login-orb-one"></div>
        <div class="login-orb login-orb-two"></div>
        <div class="login-grid"></div>
    </div>

    <main class="login-card" aria-label="RPN Management System Login">

        <div class="login-brand">
            <div class="login-logo-mark">
                <span>RPN</span>
            </div>

            <div class="login-brand-copy">
                <div class="login-brand-title">RPN</div>
                <div class="login-brand-subtitle">Management System</div>
            </div>
        </div>

        <div class="login-heading">
            <div class="login-eyebrow">SECURE ACCESS</div>
            <h1>Welcome back</h1>
            <p>Sign in untuk melanjutkan ke RPN Management System.</p>
        </div>

        <form id="loginForm" class="login-form" autocomplete="off">

            <div class="login-field form-group">
                <label for="loginUsername">Username</label>
                <div class="login-input-wrap">
                    <i class="fa-solid fa-user login-input-icon" aria-hidden="true"></i>
                    <input
                        id="loginUsername"
                        type="text"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required>
                </div>
            </div>

            <div class="login-field form-group">
                <label for="loginPassword">Password</label>
                <div class="login-input-wrap">
                    <i class="fa-solid fa-lock login-input-icon" aria-hidden="true"></i>
                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="btnTogglePassword"
                        class="password-toggle"
                        title="Tampilkan password"
                        aria-label="Tampilkan password">
                        <i id="passwordEye" class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button
                id="btnLogin"
                type="submit"
                class="btn-primary login-submit">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                <span>Login</span>
            </button>

        </form>

        <div class="login-security">
            <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
            <span>Authorized users only</span>
        </div>

        <footer class="login-footer">
            <strong>RPN Management System</strong>
            <span>•</span>
            <span>Version 3.1.0</span>
        </footer>

    </main>

</div>
