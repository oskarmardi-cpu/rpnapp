<script>

const KPI = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    kpis:new Map(),

    values:new Map(),

    targets:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    element

){

    state.kpis.set(

        name,

        element

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.kpis.get(

        name

    );

}

/*=========================================================
VALUE
=========================================================*/

function value(

    name,

    value

){

    if(arguments.length===1){

        return state.values.get(

            name

        ) || 0;

    }

    state.values.set(

        name,

        value

    );

}

/*=========================================================
TARGET
=========================================================*/

function target(

    name,

    value

){

    if(arguments.length===1){

        return state.targets.get(

            name

        ) || 0;

    }

    state.targets.set(

        name,

        value

    );

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    state.kpis.delete(

        name

    );

    state.values.delete(

        name

    );

    state.targets.delete(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    state,

    register,

    get,

    value,

    target,

    remove

};

})();

</script><!--=========================================================

<script>

const KPIRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const card =

        document.createElement(

            "div"

        );

    card.id =

        config.id ||

        config.name;

    card.className =

        config.className ||

        "rpn-kpi";

    card.innerHTML = `

<div class="kpi-header">

<div class="kpi-title"></div>

<div class="kpi-icon"></div>

</div>

<div class="kpi-body">

<div class="kpi-value"></div>

<div class="kpi-target"></div>

</div>

<div class="kpi-footer">

<div class="kpi-progress"></div>

</div>

`;

    if(

        config.container

    ){

        document

        .getElementById(

            config.container

        )

        .appendChild(

            card

        );

    }

    KPI.register(

        config.name,

        card

    );

    return card;

}

/*=========================================================
TITLE
=========================================================*/

function title(

    name,

    value

){

    const card =

        KPI.get(name);

    if(card){

        card.querySelector(

            ".kpi-title"

        ).textContent =

            value;

    }

}

/*=========================================================
ICON
=========================================================*/

function icon(

    name,

    css

){

    const card =

        KPI.get(name);

    if(card){

        card.querySelector(

            ".kpi-icon"

        ).innerHTML =

        `<i class="${css}"></i>`;

    }

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const card =

        KPI.get(name);

    if(

        card &&

        card.parentNode

    ){

        card.parentNode.removeChild(

            card

        );

    }

    KPI.remove(name);

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    title,

    icon,

    remove

};

})();

<script>

const KPIValue = (()=>{

"use strict";

/*=========================================================
VALUE
=========================================================*/

function set(

    name,

    value

){

    KPI.value(

        name,

        value

    );

    const card =

        KPI.get(name);

    if(

        !card

    ){

        return;

    }

    card.querySelector(

        ".kpi-value"

    ).textContent =

        format(value);

}

/*=========================================================
TARGET
=========================================================*/

function target(

    name,

    value

){

    KPI.target(

        name,

        value

    );

    const card =

        KPI.get(name);

    if(

        !card

    ){

        return;

    }

    card.querySelector(

        ".kpi-target"

    ).textContent =

        "Target : " +

        format(value);

}

/*=========================================================
INCREMENT
=========================================================*/

function increment(

    name,

    step

){

    step =

        step || 1;

    set(

        name,

        KPI.value(name)

        + step

    );

}

/*=========================================================
DECREMENT
=========================================================*/

function decrement(

    name,

    step

){

    step =

        step || 1;

    set(

        name,

        KPI.value(name)

        - step

    );

}

/*=========================================================
FORMAT
=========================================================*/

function format(value){

    if(

        typeof value ===

        "number"

    ){

        return value

        .toLocaleString(

            "id-ID"

        );

    }

    return value;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    target,

    increment,

    decrement,

    format

};

})();

<script>

const KPIProgress = (()=>{

"use strict";

/*=========================================================
UPDATE
=========================================================*/

function update(name){

    const value =

        KPI.value(name);

    const target =

        KPI.target(name);

    const card =

        KPI.get(name);

    if(

        !card ||

        target <= 0

    ){

        return;

    }

    const percent =

        Math.min(

            100,

            Math.max(

                0,

                (value / target) * 100

            )

        );

    render(

        card,

        percent

    );

}

/*=========================================================
RENDER
=========================================================*/

function render(

    card,

    percent

){

    const progress =

        card.querySelector(

            ".kpi-progress"

        );

    progress.innerHTML = `

<div class="progress">

<div class="progress-bar"

style="width:${percent}%">

${percent.toFixed(1)}%

</div>

</div>

`;

}

/*=========================================================
PERCENT
=========================================================*/

function percent(name){

    const target =

        KPI.target(name);

    if(

        target <= 0

    ){

        return 0;

    }

    return (

        KPI.value(name)

        / target

    ) * 100;

}

/*=========================================================
COMPLETE
=========================================================*/

function complete(name){

    return percent(name)

        >= 100;

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    KPI.value(

        name,

        0

    );

    update(name);

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    update,

    percent,

    complete,

    reset

};

})();

<script>

const KPITrend = (()=>{

"use strict";

const history = new Map();

/*=========================================================
UPDATE
=========================================================*/

function update(

    name,

    value

){

    let list =

        history.get(name)

        || [];

    list.push({

        value,

        date:new Date()

    });

    if(

        list.length>30

    ){

        list.shift();

    }

    history.set(

        name,

        list

    );

}

/*=========================================================
DIRECTION
=========================================================*/

function direction(name){

    const list =

        history.get(name)

        || [];

    if(

        list.length<2

    ){

        return "stable";

    }

    const current =

        list[list.length-1]

        .value;

    const previous =

        list[list.length-2]

        .value;

    if(

        current>previous

    ){

        return "up";

    }

    if(

        current<previous

    ){

        return "down";

    }

    return "stable";

}

/*=========================================================
ICON
=========================================================*/

function icon(name){

    switch(

        direction(name)

    ){

        case "up":

            return

            "▲";

        case "down":

            return

            "▼";

        default:

            return

            "■";

    }

}

/*=========================================================
PERCENT
=========================================================*/

function percent(name){

    const list =

        history.get(name)

        || [];

    if(

        list.length<2

    ){

        return 0;

    }

    const current =

        list[list.length-1]

        .value;

    const previous =

        list[list.length-2]

        .value;

    if(

        previous===0

    ){

        return 0;

    }

    return (

        (

            current-

            previous

        )

        /previous

    )*100;

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    history.delete(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    update,

    direction,

    icon,

    percent,

    reset

};

})();

<script>

const KPIEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    name,

    event,

    callback

){

    const kpi =

        KPI.get(name);

    if(

        !kpi ||

        typeof callback !==

        "function"

    ){

        return;

    }

    kpi.addEventListener(

        event,

        callback

    );

    listeners.set(

        name + ":" + event,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    name,

    event

){

    const kpi =

        KPI.get(name);

    const key =

        name + ":" + event;

    const callback =

        listeners.get(key);

    if(

        kpi &&

        callback

    ){

        kpi.removeEventListener(

            event,

            callback

        );

    }

    listeners.delete(

        key

    );

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    name,

    event,

    detail

){

    const kpi =

        KPI.get(name);

    if(

        !kpi

    ){

        return;

    }

    kpi.dispatchEvent(

        new CustomEvent(

            event,

            {

                detail

            }

        )

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    Array.from(

        listeners.keys()

    )

    .forEach(function(key){

        if(

            key.startsWith(

                name + ":"

            )

        ){

            const event =

                key.split(":")[1];

            off(

                name,

                event

            );

        }

    });

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    clear

};

})();

<script>

const KPITheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-kpi-default",

    primary   : "rpn-kpi-primary",

    success   : "rpn-kpi-success",

    warning   : "rpn-kpi-warning",

    danger    : "rpn-kpi-danger",

    info      : "rpn-kpi-info",

    dark      : "rpn-kpi-dark",

    corporate : "rpn-kpi-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(

    name,

    theme

){

    if(

        !themes[theme]

    ){

        return;

    }

    const card =

        KPI.get(name);

    if(

        !card

    ){

        return;

    }

    Object.values(themes)

    .forEach(function(css){

        card.classList.remove(css);

    });

    card.classList.add(

        themes[theme]

    );

}

/*=========================================================
SET DEFAULT
=========================================================*/

function setDefault(theme){

    if(

        themes[theme]

    ){

        current = theme;

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    KPI.state.kpis

    .forEach(function(

        card,

        name

    ){

        set(

            name,

            current

        );

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    css

){

    themes[name] = css;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    setDefault,

    get,

    applyAll,

    register

};

})();

<script>

const KPIProduction = (()=>{

"use strict";

const VERSION = "1.0.0";

/*=========================================================
BOOT
=========================================================*/

function boot(config){

    const kpi =

        KPIRender.render(

            config

        );

    KPITheme.set(

        config.name,

        config.theme ||

        "default"

    );

    KPIRender.title(

        config.name,

        config.title ||

        ""

    );

    if(config.icon){

        KPIRender.icon(

            config.name,

            config.icon

        );

    }

    KPIValue.set(

        config.name,

        config.value || 0

    );

    KPIValue.target(

        config.name,

        config.target || 0

    );

    KPIProgress.update(

        config.name

    );

    KPITrend.update(

        config.name,

        config.value || 0

    );

    return kpi;

}

/*=========================================================
UPDATE
=========================================================*/

function update(

    name,

    value

){

    KPIValue.set(

        name,

        value

    );

    KPITrend.update(

        name,

        value

    );

    KPIProgress.update(

        name

    );

    KPIEvent.trigger(

        name,

        "update",

        {

            value,

            trend :

            KPITrend.direction(

                name

            )

        }

    );

}

/*=========================================================
REFRESH
=========================================================*/

function refresh(name){

    KPIProgress.update(

        name

    );

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    KPIValue.set(

        name,

        0

    );

    KPITrend.reset(

        name

    );

    KPIProgress.reset(

        name

    );

}

/*=========================================================
DESTROY
=========================================================*/

function destroy(name){

    KPIEvent.clear(

        name

    );

    KPI.remove(

        name

    );

}

/*=========================================================
INFO
=========================================================*/

function info(){

    return{

        component :

        "KPI",

        version :

        VERSION,

        edition :

        "Enterprise",

        status :

        "Production"

    };

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    boot,

    update,

    refresh,

    reset,

    destroy,

    info

};

})();

</script>
