<script>

const Toolbar = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    toolbars:new Map(),

    items:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    toolbar

){

    state.toolbars.set(

        name,

        toolbar

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.toolbars.get(

        name

    );

}

/*=========================================================
ITEMS
=========================================================*/

function items(

    name,

    list

){

    if(arguments.length===1){

        return state.items.get(

            name

        ) || [];

    }

    state.items.set(

        name,

        list || []

    );

}

/*=========================================================
ADD
=========================================================*/

function add(

    name,

    item

){

    const list =

        items(name);

    list.push(item);

    items(

        name,

        list

    );

}

/*=========================================================
REMOVE
=========================================================*/

function remove(

    name,

    id

){

    const list =

        items(name)

        .filter(function(item){

            return item.id!==id;

        });

    items(

        name,

        list

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    state.items.delete(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    state,

    register,

    get,

    items,

    add,

    remove,

    clear

};

})();

</script><!--=========================================================

<script>

const ToolbarRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const toolbar =

        document.createElement(

            "div"

        );

    toolbar.className =

        "rpn-toolbar";

    toolbar.id =

        config.id ||

        config.name;

    if(

        config.container

    ){

        document

        .getElementById(

            config.container

        )

        .appendChild(

            toolbar

        );

    }

    Toolbar.register(

        config.name,

        toolbar

    );

    Toolbar.items(

        config.name,

        config.items || []

    );

    refresh(

        config.name

    );

    return toolbar;

}

/*=========================================================
REFRESH
=========================================================*/

function refresh(name){

    const toolbar =

        Toolbar.get(name);

    if(

        !toolbar

    ){

        return;

    }

    let html = "";

    Toolbar.items(name)

    .forEach(function(item){

        html += button(item);

    });

    toolbar.innerHTML =

        html;

}

/*=========================================================
BUTTON
=========================================================*/

function button(item){

    return `

<button

type="button"

class="toolbar-button ${item.className || ""}"

data-id="${item.id}">

${item.icon || ""}

<span>

${item.text || ""}

</span>

</button>

`;

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const toolbar =

        Toolbar.get(name);

    if(

        toolbar &&

        toolbar.parentNode

    ){

        toolbar.parentNode.removeChild(

            toolbar

        );

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    refresh,

    remove

};

})();

<script>

const ToolbarButton = (()=>{

"use strict";

/*=========================================================
ENABLE
=========================================================*/

function enable(

    toolbar,

    id

){

    const button =

        find(

            toolbar,

            id

        );

    if(button){

        button.disabled = false;

    }

}

/*=========================================================
DISABLE
=========================================================*/

function disable(

    toolbar,

    id

){

    const button =

        find(

            toolbar,

            id

        );

    if(button){

        button.disabled = true;

    }

}

/*=========================================================
SHOW
=========================================================*/

function show(

    toolbar,

    id

){

    const button =

        find(

            toolbar,

            id

        );

    if(button){

        button.style.display = "";

    }

}

/*=========================================================
HIDE
=========================================================*/

function hide(

    toolbar,

    id

){

    const button =

        find(

            toolbar,

            id

        );

    if(button){

        button.style.display = "none";

    }

}

/*=========================================================
TEXT
=========================================================*/

function text(

    toolbar,

    id,

    value

){

    const button =

        find(

            toolbar,

            id

        );

    if(

        !button

    ){

        return;

    }

    const span =

        button.querySelector(

            "span"

        );

    if(span){

        span.textContent =

            value;

    }

}

/*=========================================================
ICON
=========================================================*/

function icon(

    toolbar,

    id,

    value

){

    const button =

        find(

            toolbar,

            id

        );

    if(

        !button

    ){

        return;

    }

    button.firstChild.textContent =

        value;

}

/*=========================================================
FIND
=========================================================*/

function find(

    toolbar,

    id

){

    const element =

        Toolbar.get(

            toolbar

        );

    if(

        !element

    ){

        return null;

    }

    return element.querySelector(

        '[data-id="'+id+'"]'

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    enable,

    disable,

    show,

    hide,

    text,

    icon,

    find

};

})();

<script>

const ToolbarGroup = (()=>{

"use strict";

/*=========================================================
CREATE
=========================================================*/

function create(

    toolbar,

    groups

){

    const element =

        Toolbar.get(

            toolbar

        );

    if(

        !element

    ){

        return;

    }

    let html = "";

    groups.forEach(function(group){

        html += render(group);

    });

    element.innerHTML = html;

}

/*=========================================================
RENDER
=========================================================*/

function render(group){

    let html =

    '<div class="toolbar-group">';

    group.items.forEach(function(item){

        html += `

<button

type="button"

class="toolbar-button ${item.className||""}"

data-id="${item.id}">

${item.icon||""}

<span>

${item.text||""}

</span>

</button>

`;

    });

    html += "</div>";

    return html;

}

/*=========================================================
SHOW
=========================================================*/

function show(

    toolbar,

    index

){

    const group =

        get(toolbar,index);

    if(group){

        group.style.display="";

    }

}

/*=========================================================
HIDE
=========================================================*/

function hide(

    toolbar,

    index

){

    const group =

        get(toolbar,index);

    if(group){

        group.style.display="none";

    }

}

/*=========================================================
GET
=========================================================*/

function get(

    toolbar,

    index

){

    const element=

        Toolbar.get(toolbar);

    if(!element){

        return null;

    }

    return element

    .querySelectorAll(

        ".toolbar-group"

    )[index];

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    create,

    show,

    hide,

    get

};

})();

<script>

const ToolbarEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    toolbar,

    buttonId,

    callback

){

    const button =

        ToolbarButton.find(

            toolbar,

            buttonId

        );

    if(

        !button ||

        typeof callback !==

        "function"

    ){

        return;

    }

    button.addEventListener(

        "click",

        callback

    );

    listeners.set(

        toolbar +

        ":" +

        buttonId,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    toolbar,

    buttonId

){

    const button =

        ToolbarButton.find(

            toolbar,

            buttonId

        );

    const key =

        toolbar +

        ":" +

        buttonId;

    const callback =

        listeners.get(key);

    if(

        button &&

        callback

    ){

        button.removeEventListener(

            "click",

            callback

        );

    }

    listeners.delete(

        key

    );

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    toolbar,

    buttonId

){

    const button =

        ToolbarButton.find(

            toolbar,

            buttonId

        );

    if(

        button

    ){

        button.click();

    }

}

/*=========================================================
CLEAR
=========================================================*/

function clear(toolbar){

    Array.from(

        listeners.keys()

    )

    .forEach(function(key){

        if(

            key.startsWith(

                toolbar + ":"

            )

        ){

            const id =

                key.split(":")[1];

            off(

                toolbar,

                id

            );

        }

    });

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    clear

};

})();

<script>

const ToolbarShortcut = (()=>{

"use strict";

const shortcuts = new Map();

/*=========================================================
REGISTER
=========================================================*/

function register(

    toolbar,

    key,

    buttonId

){

    shortcuts.set(

        key.toUpperCase(),

        {

            toolbar,

            buttonId

        }

    );

}

/*=========================================================
UNREGISTER
=========================================================*/

function unregister(key){

    shortcuts.delete(

        key.toUpperCase()

    );

}

/*=========================================================
INIT
=========================================================*/

function init(){

    document.addEventListener(

        "keydown",

        handler

    );

}

/*=========================================================
HANDLER
=========================================================*/

function handler(event){

    let key = "";

    if(event.ctrlKey){

        key += "CTRL+";

    }

    if(event.shiftKey){

        key += "SHIFT+";

    }

    if(event.altKey){

        key += "ALT+";

    }

    key +=

        event.key.toUpperCase();

    const shortcut =

        shortcuts.get(key);

    if(

        !shortcut

    ){

        return;

    }

    event.preventDefault();

    ToolbarEvent.trigger(

        shortcut.toolbar,

        shortcut.buttonId

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(){

    shortcuts.clear();

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    register,

    unregister,

    init,

    clear

};

})();

<script>

const ToolbarTheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-toolbar-default",

    light     : "rpn-toolbar-light",

    dark      : "rpn-toolbar-dark",

    corporate : "rpn-toolbar-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(theme){

    if(

        themes[theme]

    ){

        current = theme;

        applyAll();

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY
=========================================================*/

function apply(name){

    const toolbar =

        Toolbar.get(name);

    if(

        !toolbar

    ){

        return;

    }

    Object.values(themes)

    .forEach(function(css){

        toolbar.classList.remove(css);

    });

    toolbar.classList.add(

        themes[current]

    );

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    Toolbar.state.toolbars

    .forEach(function(

        toolbar,

        name

    ){

        apply(name);

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    cssClass

){

    themes[name] = cssClass;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    get,

    apply,

    applyAll,

    register

};

})();

<script>

const ToolbarProduction = (()=>{

"use strict";

const VERSION = "1.0.0";

/*=========================================================
BOOT
=========================================================*/

function boot(config){

    const toolbar =

        ToolbarRender.render(

            config

        );

    ToolbarTheme.apply(

        config.name

    );

    ToolbarShortcut.init();

    return toolbar;

}

/*=========================================================
ADD
=========================================================*/

function add(

    name,

    item

){

    Toolbar.add(

        name,

        item

    );

    ToolbarRender.refresh(

        name

    );

}

/*=========================================================
REMOVE
=========================================================*/

function remove(

    name,

    id

){

    Toolbar.remove(

        name,

        id

    );

    ToolbarRender.refresh(

        name

    );

}

/*=========================================================
REFRESH
=========================================================*/

function refresh(name){

    ToolbarRender.refresh(

        name

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    Toolbar.clear(

        name

    );

    ToolbarRender.refresh(

        name

    );

}

/*=========================================================
DESTROY
=========================================================*/

function destroy(name){

    ToolbarEvent.clear(

        name

    );

    ToolbarShortcut.clear();

    Toolbar.clear(

        name

    );

    ToolbarRender.remove(

        name

    );

}

/*=========================================================
INFO
=========================================================*/

function info(){

    return{

        component :

        "Toolbar",

        version :

        VERSION,

        edition :

        "Enterprise",

        status :

        "Production"

    };

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    boot,

    add,

    remove,

    refresh,

    clear,

    destroy,

    info

};

})();

</script>
