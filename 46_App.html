<script>

const App = (() => {

    "use strict";

    let initialized = false;

    function el(id){ return document.getElementById(id); }

    function login(){
        const loginView = el("login-container");
        const application = el("application-container");
        const dashboard = el("view-dashboard");
        if(loginView) loginView.style.display = "block";
        if(application) application.style.display = "none";
        if(dashboard) dashboard.style.display = "none";
        document.body.classList.remove("rpn-authenticated");
    }

    function app(){
        const loginView = el("login-container");
        const application = el("application-container");
        const header = el("app-header");
        const sidebar = el("app-sidebar");
        const footer = el("app-footer");
        if(loginView) loginView.style.display = "none";
        if(application) application.style.display = "block";
        if(header) header.style.display = "block";
        if(sidebar) sidebar.style.display = "block";
        if(footer) footer.style.display = "block";
        document.body.classList.add("rpn-authenticated");
        showDashboard();
    }

    function showDashboard(){
        const dashboard = el("view-dashboard");
        if(!dashboard){
            console.error("APP: view-dashboard tidak ditemukan.");
            return;
        }
        dashboard.style.display = "block";
        try{
            if(typeof Sidebar !== "undefined" && typeof Sidebar.load === "function") Sidebar.load();
            if(typeof Dashboard !== "undefined" && typeof Dashboard.loadDashboard === "function") Dashboard.loadDashboard();
        }catch(error){
            console.error("APP DASHBOARD ERROR:", error);
            if(typeof showModal === "function") showModal("Dashboard", error.message || String(error));
        }
    }

    function init(){
        if(initialized) return;
        initialized = true;
        login();
        console.log("RPN APP INITIALIZED");
    }

    return { init, login, app, showDashboard };

})();

document.addEventListener("DOMContentLoaded", function(){ App.init(); });

</script>
