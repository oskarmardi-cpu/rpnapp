<!--=========================================================
 SHELL STATE CONTROLLER
==========================================================-->

<script>

(function(){

    "use strict";


    /*=======================================================
      SHOW LOGIN
    =======================================================*/

    window.showLoginShell = function(){

        const login =
            document.getElementById(
                "login-container"
            );


        const application =
            document.getElementById(
                "application-container"
            );


        if(login){

            login.style.display =
                "block";

        }


        if(application){

            application.style.display =
                "none";

        }

    };


    /*=======================================================
      SHOW APPLICATION
    =======================================================*/

    window.showApplicationShell = function(){

        const login =
            document.getElementById(
                "login-container"
            );


        const application =
            document.getElementById(
                "application-container"
            );


        if(login){

            login.style.display =
                "none";

        }


        if(application){

            application.style.display =
                "block";

        }

    };


    /*=======================================================
      INITIAL STATE
      SECURITY FIRST:
      LOGIN ONLY
    =======================================================*/

    showLoginShell();


})();

</script>
