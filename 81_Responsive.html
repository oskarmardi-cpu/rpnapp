<style>
/* =========================================================
   RPN MANAGEMENT SYSTEM — ENTERPRISE UI v6.0
   Responsive Desktop / Tablet / Mobile
========================================================= */
:root{--rpn-sidebar:260px;--rpn-sidebar-mini:78px;--rpn-header:72px;--rpn-bg:#f4f7fb;--rpn-primary:#2563eb;--rpn-primary-2:#4f46e5;}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;padding:0;overflow-x:hidden;background:var(--rpn-bg);}
#rpn-app{width:100%;min-height:100vh;background:linear-gradient(135deg,#f7f9fc,#eef3fb);}
#rpn-app #application-container{min-height:100vh;}
#rpn-app #app-sidebar{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:var(--rpn-sidebar)!important;height:100vh!important;z-index:1200!important;margin:0!important;padding:0!important;display:block!important;overflow:visible!important;transition:width .28s cubic-bezier(.4,0,.2,1),transform .28s ease!important;}
#rpn-app #app-sidebar #sidebar{position:relative!important;width:100%!important;height:100vh!important;min-height:100vh!important;margin:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;background:linear-gradient(180deg,#0d1b3d,#122a5c 58%,#173b79)!important;color:#fff!important;border-right:1px solid rgba(255,255,255,.08)!important;box-shadow:10px 0 30px rgba(15,23,42,.12)!important;}
#rpn-app #sidebar .sidebar-toggle{position:absolute;right:-15px;top:78px;width:30px;height:30px;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--rpn-primary);border:1px solid #dbe4f0;box-shadow:0 6px 18px rgba(15,23,42,.16);cursor:pointer;transition:.25s ease;}
#rpn-app #sidebar .sidebar-toggle:hover{transform:scale(1.08);box-shadow:0 9px 22px rgba(37,99,235,.24);}
#rpn-app #sidebar .sidebar-user{margin:18px 14px 12px!important;padding:14px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:16px!important;background:rgba(255,255,255,.07)!important;backdrop-filter:blur(12px);display:flex!important;align-items:center!important;gap:11px!important;}
#rpn-app #sidebar .sidebar-avatar{width:42px!important;height:42px!important;min-width:42px!important;border-radius:13px!important;object-fit:cover!important;background:#fff!important;}
#rpn-app #sidebar .sidebar-user-name{color:#fff!important;font-weight:800!important;font-size:13px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
#rpn-app #sidebar .sidebar-user-role{color:#a9bee8!important;font-size:10px!important;margin-top:2px!important;text-transform:uppercase;letter-spacing:.6px;}
#rpn-app #sidebar nav{flex:1!important;overflow-y:auto!important;overflow-x:hidden!important;padding:8px 10px 18px!important;scrollbar-width:thin;}
#rpn-app #sidebar nav ul{margin:0!important;padding:0!important;list-style:none!important;}
#rpn-app #sidebar .menu-item,#rpn-app #sidebar .menu-group{margin:3px 0!important;list-style:none!important;}
#rpn-app #sidebar .menu-item>a,#rpn-app #sidebar .menu-group>.menu-title{min-height:44px!important;padding:0 13px!important;border-radius:12px!important;display:flex!important;align-items:center!important;gap:12px!important;color:#c9d7f1!important;cursor:pointer!important;transition:.2s ease!important;font-size:12px!important;font-weight:600!important;white-space:nowrap!important;}
#rpn-app #sidebar .menu-item>a i,#rpn-app #sidebar .menu-title>i:first-child{width:20px!important;text-align:center!important;font-size:18px!important;color:#91a9d1!important;transition:.2s ease!important;}
#rpn-app #sidebar .menu-item>a:hover,#rpn-app #sidebar .menu-group>.menu-title:hover{background:rgba(255,255,255,.09)!important;color:#fff!important;transform:translateX(3px)!important;}
#rpn-app #sidebar .menu-item>a:hover i,#rpn-app #sidebar .menu-title:hover>i:first-child{color:#fff!important;transform:scale(1.08)!important;}
#rpn-app #sidebar .menu-item.active>a{background:linear-gradient(90deg,rgba(59,130,246,.28),rgba(79,70,229,.16))!important;color:#fff!important;box-shadow:inset 3px 0 0 #60a5fa,0 7px 20px rgba(0,0,0,.08)!important;}
#rpn-app #sidebar .menu-group>ul{padding:3px 0 5px 43px!important;display:block;}
#rpn-app #sidebar .menu-group>ul li{padding:8px 12px!important;border-radius:9px!important;color:#aebfdd!important;font-size:11px!important;cursor:pointer!important;transition:.18s ease!important;}
#rpn-app #sidebar .menu-group>ul li:hover{background:rgba(255,255,255,.08)!important;color:#fff!important;transform:translateX(2px)!important;}
#rpn-app #sidebar .menu-chevron{margin-left:auto!important;font-size:15px!important;color:#8fa7cc!important;}
#rpn-app #sidebar .sidebar-footer{padding:12px 16px 16px!important;color:#7f99c2!important;font-size:9px!important;border-top:1px solid rgba(255,255,255,.07)!important;display:flex!important;justify-content:space-between!important;}
#rpn-app #sidebar .badge{margin-left:auto!important;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:9px;align-items:center;justify-content:center;}
body.sidebar-collapse #rpn-app #app-sidebar{width:var(--rpn-sidebar-mini)!important;}body.sidebar-collapse #rpn-app #app-main{width:calc(100% - var(--rpn-sidebar-mini))!important;margin-left:var(--rpn-sidebar-mini)!important;}body.sidebar-collapse #rpn-app #app-header,body.sidebar-collapse #rpn-app #app-footer{width:calc(100% - var(--rpn-sidebar-mini))!important;margin-left:var(--rpn-sidebar-mini)!important;}body.sidebar-collapse #rpn-app #sidebar .sidebar-user{justify-content:center;padding:10px!important;}body.sidebar-collapse #rpn-app #sidebar .sidebar-user-info,body.sidebar-collapse #rpn-app #sidebar .menu-item>a span,body.sidebar-collapse #rpn-app #sidebar .menu-group>.menu-title span,body.sidebar-collapse #rpn-app #sidebar .menu-group>.menu-title .menu-chevron,body.sidebar-collapse #rpn-app #sidebar .menu-group>ul,body.sidebar-collapse #rpn-app #sidebar .sidebar-footer{display:none!important;}body.sidebar-collapse #rpn-app #sidebar .menu-item>a,body.sidebar-collapse #rpn-app #sidebar .menu-group>.menu-title{justify-content:center;padding:0!important;}body.sidebar-collapse #rpn-app #sidebar .sidebar-toggle i{transform:rotate(180deg);}
#rpn-app #app-main{position:relative!important;display:block!important;width:calc(100% - var(--rpn-sidebar))!important;max-width:none!important;min-width:0!important;margin-left:var(--rpn-sidebar)!important;padding:0!important;min-height:calc(100vh - var(--rpn-header))!important;background:transparent!important;transition:.28s cubic-bezier(.4,0,.2,1)!important;}
#rpn-app #page-container{width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;padding:0!important;}
#rpn-app #page-container .page,#rpn-app #page-container .rpn-dashboard,#rpn-app #page-container .dashboard,#rpn-app #page-container .dashboard-page{width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;}
#rpn-app #app-header{position:sticky!important;top:0!important;z-index:1100!important;width:calc(100% - var(--rpn-sidebar))!important;margin-left:var(--rpn-sidebar)!important;backdrop-filter:blur(16px)!important;background:rgba(255,255,255,.82)!important;border-bottom:1px solid rgba(226,232,240,.85)!important;transition:.28s ease!important;}
#rpn-app #app-footer{width:calc(100% - var(--rpn-sidebar))!important;margin-left:var(--rpn-sidebar)!important;transition:.28s ease!important;}
/* dashboard visual system */
#rpn-app .rpn-dashboard{padding:26px 28px 42px!important;min-height:calc(100vh - var(--rpn-header))!important;background:radial-gradient(circle at 95% 0%,rgba(37,99,235,.09),transparent 28%),radial-gradient(circle at 0% 45%,rgba(79,70,229,.06),transparent 25%),#f5f8fc!important;}
#rpn-app .dashboard-title h1{font-size:30px!important;letter-spacing:-1px!important;color:#13213a!important;}#rpn-app .dashboard-title p{font-size:12px!important;color:#8794a8!important;}#rpn-app #welcomeName{font-size:13px!important;color:#334155!important;}
#rpn-app .dashboard-refresh{height:42px!important;padding:0 17px!important;border-radius:12px!important;background:linear-gradient(135deg,#2563eb,#4f46e5)!important;box-shadow:0 8px 20px rgba(37,99,235,.22)!important;transition:.2s ease!important;}#rpn-app .dashboard-refresh:hover{transform:translateY(-2px)!important;box-shadow:0 12px 26px rgba(37,99,235,.3)!important;}
#rpn-app .dashboard-kpis{gap:16px!important;}#rpn-app .dashboard-card{border:1px solid rgba(226,232,240,.9)!important;border-radius:18px!important;background:rgba(255,255,255,.94)!important;box-shadow:0 10px 28px rgba(15,23,42,.055)!important;transition:.25s ease!important;}#rpn-app .dashboard-card:hover{transform:translateY(-5px)!important;box-shadow:0 18px 38px rgba(15,23,42,.1)!important;border-color:rgba(37,99,235,.18)!important;}
#rpn-app .dashboard-kpi{min-height:126px!important;padding:18px!important;position:relative!important;overflow:hidden!important;}#rpn-app .dashboard-kpi:after{content:"";position:absolute;right:-25px;top:-30px;width:95px;height:95px;border-radius:50%;background:linear-gradient(135deg,rgba(37,99,235,.07),rgba(79,70,229,.02));pointer-events:none;}#rpn-app .dashboard-kpi-icon{width:50px!important;height:50px!important;min-width:50px!important;border-radius:14px!important;font-size:20px!important;transition:.25s ease!important;}#rpn-app .dashboard-kpi:hover .dashboard-kpi-icon{transform:rotate(-5deg) scale(1.06)!important;}#rpn-app .dashboard-kpi-value{font-size:29px!important;color:#14213d!important;}
#rpn-app .dashboard-charts{gap:16px!important;margin-top:16px!important;}#rpn-app .dashboard-chart-card{min-height:315px!important;padding:20px!important;}#rpn-app .dashboard-card-header h3{font-size:14px!important;color:#17233b!important;}#rpn-app .dashboard-card-header span{font-size:10px!important;color:#8a96a8!important;}#rpn-app .dashboard-chart-wrap{height:220px!important;margin-top:14px!important;}
#rpn-app .dashboard-national,#rpn-app .dashboard-stock,#rpn-app .dashboard-activity,#rpn-app .dashboard-report{padding:20px!important;}#rpn-app .dashboard-stock-item{border-radius:13px!important;transition:.2s ease!important;}#rpn-app .dashboard-stock-item:hover{transform:translateY(-3px)!important;box-shadow:0 10px 24px rgba(15,23,42,.08)!important;}#rpn-app .dashboard-stock-bar i{animation:rpnBarIn .9s ease both;transform-origin:left center;}@keyframes rpnBarIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}#rpn-app .dashboard-activity-item{transition:.2s ease!important;border-radius:10px!important;}#rpn-app .dashboard-activity-item:hover{background:#f7faff!important;padding-left:10px!important;}
#rpn-app .dashboard-card{animation:rpnCardIn .42s ease both;}@keyframes rpnCardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* login */
#rpn-app:has(#login-container:not([style*="display: none"])) #app-sidebar,#rpn-app:has(#login-container:not([style*="display: none"])) #app-header,#rpn-app:has(#login-container:not([style*="display: none"])) #app-footer{display:none!important;}#rpn-app:has(#login-container:not([style*="display: none"])) #app-main{width:100%!important;margin-left:0!important;}
/* tablet */
@media (min-width:768px) and (max-width:1199px){:root{--rpn-sidebar:230px;--rpn-sidebar-mini:72px;}#rpn-app .rpn-dashboard{padding:22px!important;}#rpn-app .dashboard-kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important;}#rpn-app .dashboard-charts{grid-template-columns:repeat(2,minmax(0,1fr))!important;}#rpn-app .dashboard-lower{grid-template-columns:1fr!important;}}
/* mobile */
@media (max-width:767px){:root{--rpn-sidebar:0px;}#rpn-app #app-sidebar{width:280px!important;transform:translateX(-102%)!important;transition:transform .28s cubic-bezier(.4,0,.2,1)!important;}body.sidebar-mobile-open #rpn-app #app-sidebar{transform:translateX(0)!important;}#rpn-app #app-sidebar #sidebar{box-shadow:12px 0 35px rgba(15,23,42,.25)!important;}#rpn-app #sidebar .sidebar-toggle{right:-44px;top:16px;width:36px;height:36px;}#rpn-app #app-main,#rpn-app #app-header,#rpn-app #app-footer{width:100%!important;margin-left:0!important;}#rpn-app .rpn-dashboard{padding:16px 14px 30px!important;}#rpn-app .dashboard-header{flex-direction:column!important;align-items:stretch!important;gap:12px!important;}#rpn-app .dashboard-title h1{font-size:24px!important;}#rpn-app .dashboard-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;}#rpn-app .dashboard-kpi{min-height:108px!important;padding:13px!important;gap:9px!important;}#rpn-app .dashboard-kpi-icon{width:40px!important;height:40px!important;min-width:40px!important;font-size:16px!important;}#rpn-app .dashboard-kpi-value{font-size:23px!important;}#rpn-app .dashboard-charts{grid-template-columns:1fr!important;gap:12px!important;}#rpn-app .dashboard-chart-card{min-height:285px!important;}#rpn-app .dashboard-lower{grid-template-columns:1fr!important;}}
@media(max-width:480px){#rpn-app .dashboard-kpis{grid-template-columns:1fr!important;}#rpn-app .dashboard-chart-card{padding:15px!important;}}
@media(prefers-reduced-motion:reduce){#rpn-app *,#rpn-app *:before,#rpn-app *:after{animation:none!important;transition:none!important;}}
</style>
