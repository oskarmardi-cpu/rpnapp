<style>

/* =========================================================
   RPN MANAGEMENT SYSTEM
   81_Responsive.html
   FINAL LAYOUT CONTROL
========================================================= */

:root {
    --sidebar-fixed-width: 240px;
}

html,
body {
    width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

#rpn-app {
    width: 100%;
    min-height: 100vh;
}

/* =========================================================
   APPLICATION SIDEBAR
========================================================= */

#rpn-app #app-sidebar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    bottom: 0 !important;
    width: var(--sidebar-fixed-width) !important;
    min-width: var(--sidebar-fixed-width) !important;
    max-width: var(--sidebar-fixed-width) !important;
    height: 100vh !important;
    z-index: 1000 !important;
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
}

#rpn-app #app-sidebar #sidebar {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    transform: none !important;
    box-sizing: border-box !important;
}

/* =========================================================
   APPLICATION MAIN
========================================================= */

#rpn-app #app-main {
    display: block !important;
    width: calc(100% - var(--sidebar-fixed-width)) !important;
    max-width: calc(100% - var(--sidebar-fixed-width)) !important;
    min-width: 0 !important;
    margin-left: var(--sidebar-fixed-width) !important;
    margin-right: 0 !important;
    padding: 0 !important;
    position: relative !important;
    box-sizing: border-box !important;
}

#rpn-app #page-container {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    box-sizing: border-box !important;
}

#rpn-app #page-container .page {
    width: 100% !important;
    max-width: none !important;
    min-width: 0 !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    box-sizing: border-box !important;
}

#rpn-app #page-container .rpn-dashboard,
#rpn-app #page-container .dashboard,
#rpn-app #page-container .dashboard-page {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    box-sizing: border-box !important;
}

#rpn-app .dashboard-kpis,
#rpn-app .dashboard-kpi,
#rpn-app .dashboard-charts,
#rpn-app .dashboard-chart {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
}

#rpn-app .dashboard-table-wrap,
#rpn-app .table-dashboard {
    max-width: 100% !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    -webkit-overflow-scrolling: touch;
}

/* =========================================================
   LOGIN STATE
   LOGIN VIEW IS INSIDE THE APPLICATION LAYOUT.
   Therefore CSS MUST override the fixed desktop shell.
========================================================= */

#rpn-app #login-view-container:not([style*="display: none"])
~ * {
    box-sizing: border-box;
}

#rpn-app:has(#login-view-container:not([style*="display: none"])) #app-sidebar {
    display: none !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

#rpn-app:has(#login-view-container:not([style*="display: none"])) #app-header,
#rpn-app:has(#login-view-container:not([style*="display: none"])) #app-footer {
    display: none !important;
}

#rpn-app:has(#login-view-container:not([style*="display: none"])) #app-main {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
    padding: 0 !important;
    position: relative !important;
}

#rpn-app:has(#login-view-container:not([style*="display: none"])) #page-container {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
}

#rpn-app:has(#login-view-container:not([style*="display: none"])) #login-view-container {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 1200px) {
    #rpn-app #app-main {
        overflow-x: hidden !important;
    }
}

/* =========================================================
   ZOOM / NARROW DESKTOP
========================================================= */

@media (min-width: 769px) and (max-width: 1199px) {
    #rpn-app #app-main {
        overflow-x: auto !important;
    }

    #rpn-app #page-container {
        min-width: 1100px !important;
    }

    #rpn-app:has(#login-view-container:not([style*="display: none"])) #page-container {
        min-width: 0 !important;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 768px) {
    #rpn-app #app-sidebar {
        display: none !important;
    }

    #rpn-app #app-main {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        overflow-x: auto !important;
    }

    #rpn-app #page-container {
        min-width: 0 !important;
    }
}

/* =========================================================
   BOTTOM NAV
========================================================= */

@media (min-width: 1200px) {
    #rpn-app .bottom-navbar {
        display: none !important;
    }
}

</style>
