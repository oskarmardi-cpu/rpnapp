<!-- =====================================================
     RPN SYSTEM
     PROFILE PAGE
====================================================== -->

<div id="view-profile" class="page" style="display:none;">

    <!-- HEADER -->

    <header class="page-header">

        <div>

            <h2>

                My Profile

            </h2>

            <p>

                Informasi akun pengguna

            </p>

        </div>

    </header>

    <!-- ==========================================
         PROFILE CARD
    =========================================== -->

    <section class="profile-card">

        <div class="profile-avatar">

            <i class="fa-solid fa-user"></i>

        </div>

        <h3 id="profileName">

            -

        </h3>

        <p id="profileRole">

            -

        </p>

    </section>

    <!-- ==========================================
         ACCOUNT INFORMATION
    =========================================== -->

    <section class="profile-section">

        <div class="profile-item">

            <label>Username</label>

            <span id="profileUsername">

                -

            </span>

        </div>

        <div class="profile-item">

            <label>Cabang</label>

            <span id="profileBranch">

                -

            </span>

        </div>

        <div class="profile-item">

            <label>Email</label>

            <span id="profileEmail">

                -

            </span>

        </div>

        <div class="profile-item">

            <label>Nomor HP</label>

            <span id="profilePhone">

                -

            </span>

        </div>

    </section>

    <!-- ==========================================
         ACCOUNT MENU
    =========================================== -->

    <section class="profile-menu">

        <button
            id="btnEditProfile"
            class="menu-button">

            <i class="fa-solid fa-user-pen"></i>

            <span>

                Edit Profile

            </span>

        </button>

        <button
            id="btnChangePassword"
            class="menu-button">

            <i class="fa-solid fa-key"></i>

            <span>

                Ganti Password

            </span>

        </button>

        <button
            id="btnSetting"
            class="menu-button">

            <i class="fa-solid fa-gear"></i>

            <span>

                Pengaturan

            </span>

        </button>

        <button
            id="btnAbout"
            class="menu-button">

            <i class="fa-solid fa-circle-info"></i>

            <span>

                Tentang Aplikasi

            </span>

        </button>

    </section>

    <!-- ==========================================
         SYSTEM INFORMATION
    =========================================== -->

    <section class="profile-system">

        <div class="system-item">

            <label>Versi</label>

            <span id="systemVersion">

                1.0.0

            </span>

        </div>

        <div class="system-item">

            <label>Database</label>

            <span>

                Google Spreadsheet

            </span>

        </div>

        <div class="system-item">

            <label>Backend</label>

            <span>

                Google Apps Script

            </span>

        </div>

    </section>

    <!-- ==========================================
         LOGOUT
    =========================================== -->

    <section class="profile-action">

        <button
            id="btnLogout"
            class="btn-danger">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>

                Logout

            </span>

        </button>

    </section>

</div>
