<script>

const Grid = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    id:null,

    container:null,

    columns:[],

    data:[],

    filteredData:[],

    selected:new Set(),

    sort:[],

    filter:{},

    search:"",

    page:1,

    pageSize:25,

    totalRow:0,

    loading:false,

    option:{}

};

/*=========================================================
INITIALIZE
=========================================================*/

function create(config){

    state.id=config.id;

    state.container=

        document.getElementById(

            config.id

        );

    state.columns=

        config.columns||[];

    state.option=

        config;

    state.pageSize=

        config.pageSize||25;

    state.data=[];

    state.filteredData=[];

    state.selected.clear();

    renderSkeleton();

}

/*=========================================================
LOAD
=========================================================*/

async function load(parameter){

    state.loading=true;

    renderLoading();

    const result=

    await API.post(

        state.option.api,

        parameter||{}

    );

    state.data=result.data||[];

    state.filteredData=[

        ...state.data

    ];

    state.totalRow=

        result.total||

        state.data.length;

    state.loading=false;

    refresh();

}

/*=========================================================
SET DATA
=========================================================*/

function setData(data){

    state.data=data;

    state.filteredData=[

        ...data

    ];

    state.totalRow=data.length;

    refresh();

}

/*=========================================================
GET DATA
=========================================================*/

function getData(){

    return state.filteredData;

}

/*=========================================================
GET SELECTED
=========================================================*/

function getSelected(){

    return [...state.selected];

}

/*=========================================================
SELECT
=========================================================*/

function select(id){

    state.selected.add(id);

}

/*=========================================================
UNSELECT
=========================================================*/

function unselect(id){

    state.selected.delete(id);

}

/*=========================================================
CLEAR SELECT
=========================================================*/

function clearSelection(){

    state.selected.clear();

}

/*=========================================================
REFRESH
=========================================================*/

function refresh(){

    renderHeader();

    renderBody();

    renderFooter();

}

/*=========================================================
RENDER SKELETON
=========================================================*/

function renderSkeleton(){

    state.container.innerHTML=`

<div class="grid-wrapper">

<div class="grid-toolbar"></div>

<div class="grid-header"></div>

<div class="grid-body"></div>

<div class="grid-footer"></div>

</div>

`;

}

/*=========================================================
RENDER LOADING
=========================================================*/

function renderLoading(){

    state.container

    .querySelector(

        ".grid-body"

    ).innerHTML=

    `

<div class="grid-loading">

Loading...

</div>

`;

}

/*=========================================================
HEADER
=========================================================*/

function renderHeader(){

    GridColumn.render();

}

/*=========================================================
BODY
=========================================================*/

function renderBody(){

    GridRender.render();

}

/*=========================================================
FOOTER
=========================================================*/

function renderFooter(){

    GridPagination.render();

}

/*=========================================================
DESTROY
=========================================================*/

function destroy(){

    state.container.innerHTML="";

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    create,

    destroy,

    load,

    refresh,

    setData,

    getData,

    getSelected,

    select,

    unselect,

    clearSelection,

    state

};

})();

<script>

const GridRender = (()=>{

"use strict";

/*=======================================================
RENDER
=======================================================*/

function render(){

    const state = Grid.state;

    const body =

        state.container.querySelector(

            ".grid-body"

        );

    if(

        state.filteredData.length===0

    ){

        body.innerHTML = empty();

        return;

    }

    let html="";

    html+='<table class="rpn-grid">';

    html+=header();

    html+=bodyRender();

    html+='</table>';

    body.innerHTML=html;

}

/*=======================================================
HEADER
=======================================================*/

function header(){

    const state = Grid.state;

    let html="";

    html+='<thead>';

    html+='<tr>';

    html+='<th class="grid-checkbox">';

    html+='<input type="checkbox"';

    html+=' onclick="GridSelection.selectAll(this)">';

    html+='</th>';

    html+='<th class="grid-no">No</th>';

    state.columns.forEach(function(col){

        html+=`

<th

style="width:${col.width||150}px"

class="grid-column">

${col.title}

</th>

`;

    });

    html+='<th class="grid-action">Action</th>';

    html+='</tr>';

    html+='</thead>';

    return html;

}

/*=======================================================
BODY
=======================================================*/

function bodyRender(){

    const state = Grid.state;

    let html="";

    html+='<tbody>';

    state.filteredData.forEach(

        function(row,index){

        html+=rowRender(

            row,

            index

        );

    });

    html+='</tbody>';

    return html;

}

/*=======================================================
ROW
=======================================================*/

function rowRender(

    row,

    index

){

    const state = Grid.state;

    let html="";

    html+='<tr';

    html+=' data-id="'+row.ID+'"';

    html+=' ondblclick="GridEvent.doubleClick(\''

    +row.ID+

    '\')"';

    html+='>';

    html+='<td>';

    html+=`

<input

type="checkbox"

onclick="GridSelection.toggle('${row.ID}')">

`;

    html+='</td>';

    html+='<td>';

    html+=index+1;

    html+='</td>';

    state.columns.forEach(

        function(col){

            html+=cell(

                row,

                col

            );

        }

    );

    html+='<td>';

    html+=GridAction.render(

        row

    );

    html+='</td>';

    html+='</tr>';

    return html;

}

/*=======================================================
CELL
=======================================================*/

function cell(

    row,

    column

){

    const value=

    Formatter.format(

        row[column.field],

        column.type

    );

    return `

<td>

${value}

</td>

`;

}

/*=======================================================
EMPTY
=======================================================*/

function empty(){

return`

<div class="grid-empty">

<i class="ri-inbox-line"></i>

<h3>

No Data Found

</h3>

<p>

There is no data to display.

</p>

</div>

`;

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    render

};

})();

<script>

const GridColumn = (()=>{

"use strict";

/*=======================================================
NORMALIZE
=======================================================*/

function normalize(columns){

    return columns.map(function(col){

        return Object.assign({

            title      : "",

            field      : "",

            width      : 150,

            minWidth   : 80,

            maxWidth   : 600,

            align      : "left",

            type       : "text",

            sortable   : true,

            filterable : true,

            resizable  : true,

            visible    : true,

            frozen     : false,

            editable   : false,

            renderer   : null,

            formatter  : null,

            className  : ""

        },col);

    });

}

/*=======================================================
VISIBLE
=======================================================*/

function visible(){

    return Grid.state.columns.filter(

        c=>c.visible

    );

}

/*=======================================================
GET
=======================================================*/

function get(field){

    return Grid.state.columns.find(

        c=>c.field===field

    );

}

/*=======================================================
SHOW
=======================================================*/

function show(field){

    const col=get(field);

    if(col){

        col.visible=true;

        Grid.refresh();

    }

}

/*=======================================================
HIDE
=======================================================*/

function hide(field){

    const col=get(field);

    if(col){

        col.visible=false;

        Grid.refresh();

    }

}

/*=======================================================
TOGGLE
=======================================================*/

function toggle(field){

    const col=get(field);

    if(col){

        col.visible=!col.visible;

        Grid.refresh();

    }

}

/*=======================================================
RESIZE
=======================================================*/

function resize(

    field,

    width

){

    const col=get(field);

    if(!col){

        return;

    }

    width=Math.max(

        col.minWidth,

        width

    );

    width=Math.min(

        col.maxWidth,

        width

    );

    col.width=width;

}

/*=======================================================
MOVE
=======================================================*/

function move(

    from,

    to

){

    const list=

        Grid.state.columns;

    const item=

        list.splice(

            from,

            1

        )[0];

    list.splice(

        to,

        0,

        item

    );

    Grid.refresh();

}

/*=======================================================
HEADER HTML
=======================================================*/

function headerHtml(){

    let html="";

    visible().forEach(function(col){

        html+=`

<th

class="grid-column ${col.className}"

style="

width:${col.width}px;

text-align:${col.align};

">

<div class="grid-header-title">

<span>

${col.title}

</span>

${sortIcon(col)}

</div>

</th>

`;

    });

    return html;

}

/*=======================================================
SORT ICON
=======================================================*/

function sortIcon(col){

    if(!col.sortable){

        return "";

    }

    return `

<i

class="ri-expand-up-down-line

grid-sort"

onclick="GridSort.toggle(

'${col.field}'

)">

</i>

`;

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    normalize,

    visible,

    get,

    show,

    hide,

    toggle,

    resize,

    move,

    headerHtml

};

})();

<script>

const Formatter = (()=>{

"use strict";

/*=======================================================
FORMAT
=======================================================*/

function format(

    value,

    type,

    column,

    row

){

    if(

        column &&

        typeof column.renderer==="function"

    ){

        return column.renderer(

            value,

            row,

            column

        );

    }

    switch(type){

        case "currency":

            return currency(value);

        case "number":

            return number(value);

        case "date":

            return date(value);

        case "datetime":

            return datetime(value);

        case "badge":

            return badge(value);

        case "boolean":

            return boolean(value);

        case "progress":

            return progress(value);

        case "image":

            return image(value);

        case "link":

            return link(value);

        case "email":

            return email(value);

        case "phone":

            return phone(value);

        default:

            return text(value);

    }

}

/*=======================================================
TEXT
=======================================================*/

function text(value){

    if(

        value===null ||

        value===undefined

    ){

        return "";

    }

    return escape(value);

}

/*=======================================================
NUMBER
=======================================================*/

function number(value){

    return Number(

        value||0

    ).toLocaleString();

}

/*=======================================================
CURRENCY
=======================================================*/

function currency(value){

    return "Rp " +

    Number(

        value||0

    ).toLocaleString(

        "id-ID"

    );

}

/*=======================================================
DATE
=======================================================*/

function date(value){

    if(!value){

        return "";

    }

    return new Date(value)

    .toLocaleDateString(

        "id-ID"

    );

}

/*=======================================================
DATETIME
=======================================================*/

function datetime(value){

    if(!value){

        return "";

    }

    return new Date(value)

    .toLocaleString(

        "id-ID"

    );

}

/*=======================================================
BOOLEAN
=======================================================*/

function boolean(value){

    return value

        ? '<span class="yes">✔</span>'

        : '<span class="no">✖</span>';

}

/*=======================================================
BADGE
=======================================================*/

function badge(value){

    const css=

    String(value)

    .toLowerCase()

    .replace(/\s+/g,"-");

    return `

<span class="badge ${css}">

${value}

</span>

`;

}

/*=======================================================
PROGRESS
=======================================================*/

function progress(value){

    value=Number(value||0);

    return `

<div class="progress">

<div

class="progress-bar"

style="width:${value}%">

</div>

<span>

${value}%

</span>

</div>

`;

}

/*=======================================================
IMAGE
=======================================================*/

function image(url){

    if(!url){

        return "";

    }

    return `

<img

src="${url}"

class="grid-image">

`;

}

/*=======================================================
LINK
=======================================================*/

function link(value){

    return `

<a

href="${value}"

target="_blank">

${value}

</a>

`;

}

/*=======================================================
EMAIL
=======================================================*/

function email(value){

    return `

<a

href="mailto:${value}">

${value}

</a>

`;

}

/*=======================================================
PHONE
=======================================================*/

function phone(value){

    return `

<a

href="tel:${value}">

${value}

</a>

`;

}

/*=======================================================
ESCAPE HTML
=======================================================*/

function escape(text){

    return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#39;");

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    format,

    text,

    number,

    currency,

    date,

    datetime,

    boolean,

    badge,

    progress,

    image,

    link,

    email,

    phone

};

})();

<script>

const GridSelection = (()=>{

"use strict";

/*=======================================================
SELECT
=======================================================*/

function select(id){

    Grid.state.selected.add(id);

    refreshToolbar();

}

/*=======================================================
UNSELECT
=======================================================*/

function unselect(id){

    Grid.state.selected.delete(id);

    refreshToolbar();

}

/*=======================================================
TOGGLE
=======================================================*/

function toggle(id){

    if(

        Grid.state.selected.has(id)

    ){

        unselect(id);

    }else{

        select(id);

    }

}

/*=======================================================
SELECT ALL
=======================================================*/

function selectAll(

    checkbox

){

    Grid.clearSelection();

    if(

        checkbox.checked

    ){

        Grid

        .getData()

        .forEach(function(row){

            Grid.select(

                row.ID

            );

        });

    }

    updateCheckbox();

    refreshToolbar();

}

/*=======================================================
CLEAR
=======================================================*/

function clear(){

    Grid.clearSelection();

    updateCheckbox();

    refreshToolbar();

}

/*=======================================================
COUNT
=======================================================*/

function count(){

    return Grid

    .getSelected()

    .length;

}

/*=======================================================
IS SELECTED
=======================================================*/

function isSelected(id){

    return Grid

    .state

    .selected

    .has(id);

}

/*=======================================================
GET ROW
=======================================================*/

function getRows(){

    const ids=

    Grid.getSelected();

    return Grid

    .getData()

    .filter(

        row=>

        ids.includes(

            row.ID

        )

    );

}

/*=======================================================
UPDATE CHECKBOX
=======================================================*/

function updateCheckbox(){

    document

    .querySelectorAll(

        ".grid-checkbox-row"

    )

    .forEach(function(box){

        const id=

        box.dataset.id;

        box.checked=

        isSelected(id);

    });

}

/*=======================================================
TOOLBAR
=======================================================*/

function refreshToolbar(){

    if(

        typeof GridToolbar

        !=="undefined"

    ){

        GridToolbar

        .refresh(

            count()

        );

    }

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    select,

    unselect,

    toggle,

    selectAll,

    clear,

    count,

    isSelected,

    getRows

};

})();

<script>

const GridSearch = (()=>{

"use strict";

/*=======================================================
SEARCH
=======================================================*/

function search(keyword){

    const state = Grid.state;

    state.search =

        String(keyword || "")

        .toLowerCase()

        .trim();

    apply();

}

/*=======================================================
CLEAR
=======================================================*/

function clear(){

    Grid.state.search = "";

    apply();

}

/*=======================================================
APPLY
=======================================================*/

function apply(){

    const state = Grid.state;

    if(

        !state.search

    ){

        state.filteredData=[

            ...state.data

        ];

    }

    else{

        state.filteredData=

        state.data.filter(

            function(row){

                return match(row);

            }

        );

    }

    Grid.refresh();

}

/*=======================================================
MATCH
=======================================================*/

function match(row){

    const keyword=

        Grid.state.search;

    const columns=

        GridColumn.visible();

    for(

        let i=0;

        i<columns.length;

        i++

    ){

        const field=

            columns[i].field;

        const value=

            row[field];

        if(

            value===null ||

            value===undefined

        ){

            continue;

        }

        if(

            String(value)

            .toLowerCase()

            .includes(keyword)

        ){

            return true;

        }

    }

    return false;

}

/*=======================================================
SERVER SIDE
=======================================================*/

async function server(keyword){

    Grid.state.search=keyword;

    await Grid.load({

        keyword:keyword,

        page:1

    });

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    search,

    clear,

    apply,

    server

};

})();

<script>

const GridFilter = (()=>{

"use strict";

/*=======================================================
SET FILTER
=======================================================*/

function set(

    field,

    value

){

    Grid.state.filter[field]=value;

    apply();

}

/*=======================================================
REMOVE FILTER
=======================================================*/

function remove(field){

    delete Grid.state.filter[field];

    apply();

}

/*=======================================================
CLEAR
=======================================================*/

function clear(){

    Grid.state.filter={};

    apply();

}

/*=======================================================
APPLY
=======================================================*/

function apply(){

    const state = Grid.state;

    const filter = state.filter;

    state.filteredData =

    state.data.filter(function(row){

        return match(

            row,

            filter

        );

    });

    if(

        state.search

    ){

        GridSearch.apply();

        return;

    }

    Grid.refresh();

}

/*=======================================================
MATCH
=======================================================*/

function match(

    row,

    filter

){

    for(

        const field

        in

        filter

    ){

        const value=

            filter[field];

        if(

            value===null ||

            value===""

        ){

            continue;

        }

        if(

            Array.isArray(value)

        ){

            if(

                !value.includes(

                    row[field]

                )

            ){

                return false;

            }

            continue;

        }

        if(

            String(

                row[field]

            )!==

            String(value)

        ){

            return false;

        }

    }

    return true;

}

/*=======================================================
CUSTOM
=======================================================*/

function custom(

    callback

){

    Grid.state.filteredData=

    Grid.state.data.filter(

        callback

    );

    Grid.refresh();

}

/*=======================================================
SERVER
=======================================================*/

async function server(){

    await Grid.load({

        filter:

        Grid.state.filter,

        page:1

    });

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    set,

    remove,

    clear,

    apply,

    custom,

    server

};

})();

<script>

const GridSort = (()=>{

"use strict";

/*=======================================================
TOGGLE SORT
=======================================================*/

function toggle(field){

    const state = Grid.state;

    const index = state.sort.findIndex(

        s => s.field===field

    );

    if(index===-1){

        state.sort.push({

            field:field,

            order:"ASC"

        });

    }

    else if(

        state.sort[index].order==="ASC"

    ){

        state.sort[index].order="DESC";

    }

    else{

        state.sort.splice(

            index,

            1

        );

    }

    apply();

}

/*=======================================================
SET SORT
=======================================================*/

function set(

    field,

    order

){

    Grid.state.sort=[{

        field:field,

        order:order

    }];

    apply();

}

/*=======================================================
CLEAR
=======================================================*/

function clear(){

    Grid.state.sort=[];

    apply();

}

/*=======================================================
APPLY
=======================================================*/

function apply(){

    const state = Grid.state;

    if(

        state.sort.length===0

    ){

        Grid.refresh();

        return;

    }

    state.filteredData.sort(compare);

    Grid.refresh();

}

/*=======================================================
COMPARE
=======================================================*/

function compare(a,b){

    const sort=

        Grid.state.sort;

    for(

        let i=0;

        i<sort.length;

        i++

    ){

        const s=sort[i];

        const av=a[s.field];

        const bv=b[s.field];

        if(av>bv){

            return

            s.order==="ASC"

            ?1

            :-1;

        }

        if(av<bv){

            return

            s.order==="ASC"

            ?-1

            :1;

        }

    }

    return 0;

}

/*=======================================================
SERVER
=======================================================*/

async function server(){

    await Grid.load({

        sort:

        Grid.state.sort,

        page:

        Grid.state.page

    });

}

/*=======================================================
ICON
=======================================================*/

function icon(field){

    const s=

    Grid.state.sort.find(

        x=>x.field===field

    );

    if(!s){

        return

        "ri-expand-up-down-line";

    }

    return s.order==="ASC"

    ?"ri-sort-asc"

    :"ri-sort-desc";

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    toggle,

    set,

    clear,

    apply,

    server,

    icon

};

})();

<script>

const GridPagination = (()=>{

"use strict";

/*=======================================================
GET PAGE
=======================================================*/

function page(){

    return Grid.state.page;

}

/*=======================================================
PAGE SIZE
=======================================================*/

function pageSize(){

    return Grid.state.pageSize;

}

/*=======================================================
TOTAL ROW
=======================================================*/

function totalRow(){

    return Grid.state.totalRow;

}

/*=======================================================
TOTAL PAGE
=======================================================*/

function totalPage(){

    return Math.max(

        1,

        Math.ceil(

            totalRow() /

            pageSize()

        )

    );

}

/*=======================================================
NEXT
=======================================================*/

function next(){

    if(

        page()<totalPage()

    ){

        Grid.state.page++;

        refresh();

    }

}

/*=======================================================
PREVIOUS
=======================================================*/

function previous(){

    if(

        page()>1

    ){

        Grid.state.page--;

        refresh();

    }

}

/*=======================================================
FIRST
=======================================================*/

function first(){

    Grid.state.page=1;

    refresh();

}

/*=======================================================
LAST
=======================================================*/

function last(){

    Grid.state.page=

        totalPage();

    refresh();

}

/*=======================================================
GO TO
=======================================================*/

function go(number){

    if(

        number<1 ||

        number>totalPage()

    ){

        return;

    }

    Grid.state.page=

        number;

    refresh();

}

/*=======================================================
SET PAGE SIZE
=======================================================*/

function setPageSize(size){

    Grid.state.pageSize=

<script>

const GridVirtual = (()=>{

"use strict";

const DEFAULT_ROW_HEIGHT = 40;

let rowHeight = DEFAULT_ROW_HEIGHT;

let startIndex = 0;

let endIndex = 0;

/*=======================================================
INIT
=======================================================*/

function init(){

    const body = getBody();

    if(!body){

        return;

    }

    body.addEventListener(

        "scroll",

        onScroll

    );

/*=======================================================
SCROLL
=======================================================*/

function onScroll(){

    calculate();

    GridRender.render();

}

/*=======================================================
CALCULATE
=======================================================*/

function calculate(){

    const body = getBody();

    if(!body){

        return;

    }

    const scrollTop = body.scrollTop;

    const height = body.clientHeight;

    const total = GridPagination.rows();

    startIndex = Math.floor(

        scrollTop / rowHeight

    );

    endIndex =

        startIndex +

        Math.ceil(

            height / rowHeight

        ) + 5;

    if(endIndex > total.length){

        endIndex = total.length;

    }

}

/*=======================================================
VISIBLE ROWS
=======================================================*/

function rows(){

    const pageRows =

        GridPagination.rows();

    return pageRows.slice(

        startIndex,

        endIndex

    );

}

/*=======================================================
TOP SPACE
=======================================================*/

function topPadding(){

    return startIndex * rowHeight;

}

/*=======================================================
BOTTOM SPACE
=======================================================*/

function bottomPadding(){

    const total =

        GridPagination.rows().length;

    return Math.max(

        0,

        (total-endIndex)

        * rowHeight

    );

}

/*=======================================================
ROW HEIGHT
=======================================================*/

function setRowHeight(value){

    rowHeight = value;

}

/*=======================================================
BODY
=======================================================*/

function getBody(){

    return Grid

        .state

        .container

        .querySelector(

            ".grid-body"

        );

}

/*=======================================================
RESET
=======================================================*/

function reset(){

    startIndex = 0;

    endIndex = 0;

}

/*=======================================================
PUBLIC
=======================================================*/

return{

    init,

    reset,

    rows,

    calculate,

    topPadding,

    bottomPadding,

    setRowHeight

};

})();

<script>

const GridHook = (()=>{

"use strict";

const hooks = {};

/*=========================================================
REGISTER
=========================================================*/

function add(

    name,

    callback

){

    if(

        !hooks[name]

    ){

        hooks[name]=[];

    }

    hooks[name].push(

        callback

    );

}

/*=========================================================
EXECUTE
=========================================================*/

function run(

    name,

    payload

){

    if(

        !hooks[name]

    ){

        return payload;

    }

    let result = payload;

    hooks[name].forEach(function(fn){

        const value = fn(result);

        if(

            value !== undefined

        ){

            result = value;

        }

    });

    return result;

}

/*=========================================================
REMOVE
=========================================================*/

function remove(

    name,

    callback

){

    if(

        !hooks[name]

    ){

        return;

    }

    hooks[name] =

        hooks[name].filter(

            fn => fn !== callback

        );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(){

    Object.keys(hooks)

    .forEach(function(key){

        delete hooks[key];

    });

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    add,

    run,

    remove,

    clear

};

})();

    );

        );

}

REQUIRED
=========================================================*/

function required(

    obj,

    key,

    index

){

    if(

        obj[key]===undefined ||

        obj[key]===null ||

        obj[key]===""

    ){

        let msg =

        "Required property : "

        + key;

        if(

            index!==undefined

        ){

            msg +=

            " (column "

            + index +

            ")";

        }

        throw new Error(msg);

    }

}

PUBLIC

<script>

const GridLogger = (()=>{

"use strict";

let enabled = true;

const logs = [];

const MAX_LOG = 1000;

/*=========================================================
ENABLE
=========================================================*/

function enable(){

    enabled = true;

}

/*=========================================================
DISABLE
=========================================================*/

function disable(){

    enabled = false;

}

/*=========================================================
WRITE
=========================================================*/

function write(

    level,

    action,

    message,

    data

){

    if(

        !enabled

    ){

        return;

    }

    const log = {

        time : new Date(),

        level : level,

        action : action,

        message : message,

        data : data || null

    };

    logs.push(log);

    if(

        logs.length > MAX_LOG

    ){

        logs.shift();

    }

    switch(level){

        case "INFO":

            console.info(log);

            break;

        case "WARN":

            console.warn(log);

            break;

        case "ERROR":

            console.error(log);

            break;

        default:

            console.log(log);

    }

}

/*=========================================================
SHORTCUT
=========================================================*/

function info(

    action,

    message,

    data

){

    write(

        "INFO",

        action,

        message,

        data

    );

}

function warn(

    action,

    message,

    data

){

    write(

        "WARN",

        action,

        message,

        data

    );

}

function error(

    action,

    message,

    data

){

    write(

        "ERROR",

        action,

        message,

        data

    );

}

/*=========================================================
GET
=========================================================*/

function get(){

    return [...logs];

}

/*=========================================================
CLEAR
=========================================================*/

function clear(){

    logs.length = 0;

}

/*=========================================================
EXPORT
=========================================================*/

function exportJson(){

    return JSON.stringify(

        logs,

        null,

        2

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    enable,

    disable,

    write,

    info,

    warn,

    error,

    get,

    clear,

    exportJson

};

})();

){
