<script>

const Input = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    elements:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    element

){

    state.elements.set(

        name,

        element

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.elements.get(

        name

    );

}

/*=========================================================
VALUE
=========================================================*/

function value(

    name,

    value

){

    const el=get(name);

    if(!el){

        return null;

    }

    if(arguments.length===1){

        return el.value;

    }

    el.value=value;

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    const el=get(name);

    if(el){

        el.value="";

    }

}

/*=========================================================
CLEAR
=========================================================*/

function clear(){

    state.elements.forEach(function(el){

        el.value="";

    });

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    register,

    get,

    value,

    reset,

    clear,

    state

};

})();

<script>

const InputRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const input = document.createElement(

        "input"

    );

    input.type =

        config.type || "text";

    input.name =

        config.name || "";

    input.id =

        config.id ||

        config.name;

    input.value =

        config.value || "";

    input.placeholder =

        config.placeholder || "";

    input.className =

        config.className ||

        "rpn-input";

    input.autocomplete =

        "off";

    if(config.readonly){

        input.readOnly = true;

    }

    if(config.disabled){

        input.disabled = true;

    }

    if(config.required){

        input.required = true;

    }

    if(config.maxLength){

        input.maxLength =

            config.maxLength;

    }

    if(config.minLength){

        input.minLength =

            config.minLength;

    }

    if(config.container){

        document

        .getElementById(

            config.container

        )

        .appendChild(input);

    }

    Input.register(

        config.name,

        input

    );

    return input;

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const input =

        Input.get(name);

    if(

        input &&

        input.parentNode

    ){

        input.parentNode.removeChild(

            input

        );

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    remove

};

})();

<script>

const InputValidation = (()=>{

"use strict";

const errors = new Map();

/*=========================================================
VALIDATE
=========================================================*/

function validate(name,rules){

    clear(name);

    const input = Input.get(name);

    if(!input){

        return false;

    }

    const value = input.value;

    if(

        rules.required &&

        value.trim()===""

    ){

        return error(

            name,

            "Required"

        );

    }

    if(

        rules.email &&

        value

    ){

        const regex =

        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if(

            !regex.test(value)

        ){

            return error(

                name,

                "Invalid Email"

            );

        }

    }

    if(

        rules.number &&

        value

    ){

        if(

            isNaN(value)

        ){

            return error(

                name,

                "Must be Number"

            );

        }

    }

    if(

        rules.minLength &&

        value.length<rules.minLength

    ){

        return error(

            name,

            "Minimum "+

            rules.minLength+

            " characters"

        );

    }

    if(

        rules.maxLength &&

        value.length>rules.maxLength

    ){

        return error(

            name,

            "Maximum "+

            rules.maxLength+

            " characters"

        );

    }

    return true;

}

/*=========================================================
ERROR
=========================================================*/

function error(

    name,

    message

){

    const input=

        Input.get(name);

    input.classList.add(

        "is-invalid"

    );

    errors.set(

        name,

        message

    );

    return false;

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    const input=

        Input.get(name);

    if(input){

        input.classList.remove(

            "is-invalid"

        );

    }

    errors.delete(name);

}

/*=========================================================
CLEAR ALL
=========================================================*/

function clearAll(){

    errors.forEach(function(v,k){

        clear(k);

    });

}

/*=========================================================
HAS ERROR
=========================================================*/

function hasError(name){

    return errors.has(name);

}

/*=========================================================
GET ERROR
=========================================================*/

function getError(name){

    return errors.get(name);

}

/*=========================================================
GET ALL
=========================================================*/

function getErrors(){

    return Object.fromEntries(

        errors

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    validate,

    clear,

    clearAll,

    hasError,

    getError,

    getErrors

};

})();

<script>

const InputMask = (()=>{

"use strict";

/*=========================================================
APPLY
=========================================================*/

function apply(

    name,

    type

){

    const input =

        Input.get(name);

    if(!input){

        return;

    }

    input.addEventListener(

        "input",

        function(){

            format(

                input,

                type

            );

        }

    );

}

/*=========================================================
FORMAT
=========================================================*/

function format(

    input,

    type

){

    switch(type){

        case "number":

            input.value =

                number(

                    input.value

                );

            break;

        case "currency":

            input.value =

                currency(

                    input.value

                );

            break;

        case "phone":

            input.value =

                phone(

                    input.value

                );

            break;

        case "uppercase":

            input.value =

                input.value

                .toUpperCase();

            break;

        case "lowercase":

            input.value =

                input.value

                .toLowerCase();

            break;

    }

}

/*=========================================================
NUMBER
=========================================================*/

function number(value){

    return value.replace(

        /[^0-9]/g,

        ""

    );

}

/*=========================================================
CURRENCY
=========================================================*/

function currency(value){

    value = number(value);

    if(!value){

        return "";

    }

    return Number(value)

    .toLocaleString(

        "id-ID"

    );

}

/*=========================================================
PHONE
=========================================================*/

function phone(value){

    return value.replace(

        /[^0-9+]/g,

        ""

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    apply,

    format

};

})();

<script>

const InputFormatter = (()=>{

"use strict";

/*=========================================================
FORMAT
=========================================================*/

function format(

    name,

    type

){

    const input =

        Input.get(name);

    if(!input){

        return;

    }

    input.value =

        convert(

            input.value,

            type

        );

}

/*=========================================================
CONVERT
=========================================================*/

function convert(

    value,

    type

){

    switch(type){

        case "trim":

            return trim(value);

        case "uppercase":

            return uppercase(value);

        case "lowercase":

            return lowercase(value);

        case "title":

            return title(value);

        case "currency":

            return currency(value);

        case "number":

            return number(value);

        default:

            return value;

    }

}

/*=========================================================
TRIM
=========================================================*/

function trim(value){

    return String(

        value || ""

    ).trim();

}

/*=========================================================
UPPERCASE
=========================================================*/

function uppercase(value){

    return String(

        value || ""

    ).toUpperCase();

}

/*=========================================================
LOWERCASE
=========================================================*/

function lowercase(value){

    return String(

        value || ""

    ).toLowerCase();

}

/*=========================================================
TITLE CASE
=========================================================*/

function title(value){

    return String(

        value || ""

    )

    .toLowerCase()

    .replace(

        /\b\w/g,

        function(char){

            return char.toUpperCase();

        }

    );

}

/*=========================================================
NUMBER
=========================================================*/

function number(value){

    return String(

        value || ""

    ).replace(

        /[^0-9]/g,

        ""

    );

}

/*=========================================================
CURRENCY
=========================================================*/

function currency(value){

    value = number(value);

    if(!value){

        return "";

    }

    return Number(value)

    .toLocaleString(

        "id-ID"

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    format,

    convert

};

})();

<script>

const InputEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    name,

    event,

    callback

){

    const input =

        Input.get(name);

    if(

        !input ||

        typeof callback !==

        "function"

    ){

        return;

    }

    input.addEventListener(

        event,

        callback

    );

    const key =

        name + ":" + event;

    listeners.set(

        key,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    name,

    event

){

    const input =

        Input.get(name);

    const key =

        name + ":" + event;

    const callback =

        listeners.get(key);

    if(

        input &&

        callback

    ){

        input.removeEventListener(

            event,

            callback

        );

    }

    listeners.delete(key);

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    name,

    event

){

    const input =

        Input.get(name);

    if(

        input

    ){

        input.dispatchEvent(

            new Event(

                event

            )

        );

    }

}

/*=========================================================
FOCUS
=========================================================*/

function focus(name){

    const input =

        Input.get(name);

    if(

        input

    ){

        input.focus();

    }

}

/*=========================================================
BLUR
=========================================================*/

function blur(name){

    const input =

        Input.get(name);

    if(

        input

    ){

        input.blur();

    }

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    focus,

    blur

};

})();

<script>

const InputTheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-input-default",

    light     : "rpn-input-light",

    dark      : "rpn-input-dark",

    corporate : "rpn-input-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(theme){

    if(

        themes[theme]

    ){

        current = theme;

        applyAll();

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY
=========================================================*/

function apply(name){

    const input =

        Input.get(name);

    if(

        !input

    ){

        return;

    }

    Object.values(themes)

    .forEach(function(css){

        input.classList.remove(css);

    });

    input.classList.add(

        themes[current]

    );

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    Input.state.elements

    .forEach(function(

        input,

        name

    ){

        apply(name);

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    css

){

    themes[name]=css;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    get,

    apply,

    applyAll,

    register

};

})();

<script>

const InputProduction = (()=>{

"use strict";

const VERSION = "1.0.0";

/*=========================================================
BOOT
=========================================================*/

function boot(config){

    const input =

        InputRender.render(config);

    InputTheme.apply(

        config.name

    );

    if(config.mask){

        InputMask.apply(

            config.name,

            config.mask

        );

    }

    return input;

}

/*=========================================================
VALUE
=========================================================*/

function value(

    name,

    value

){

    return Input.value(

        name,

        value

    );

}

/*=========================================================
VALIDATE
=========================================================*/

function validate(

    name,

    rules

){

    return InputValidation.validate(

        name,

        rules

    );

}

/*=========================================================
FORMAT
=========================================================*/

function format(

    name,

    type

){

    InputFormatter.format(

        name,

        type

    );

}

/*=========================================================
RESET
=========================================================*/

function reset(name){

    Input.reset(name);

}

/*=========================================================
CLEAR
=========================================================*/

function clear(){

    Input.clear();

}

/*=========================================================
DESTROY
=========================================================*/

function destroy(name){

    InputRender.remove(name);

}

/*=========================================================
INFO
=========================================================*/

function info(){

        "Input",

        version :

        VERSION,

        edition :

        "Enterprise",

        status :

        "Production"

    };

}

PUBLIC
=========================================================*/

    boot,

    value,

    clear,

    destroy,

    info

};
