<style>
/*==========================================================
 RPN SYSTEM
 Main Style
 Version : 1.0.0
 Part 1 / 2
==========================================================*/

/*==========================================================
CSS VARIABLE
==========================================================*/

:root{

--primary:#1F3A8A;
--primary-dark:#172554;
--primary-light:#3B82F6;

--secondary:#2563EB;

--success:#16A34A;
--warning:#F59E0B;
--danger:#DC2626;
--info:#0EA5E9;

--white:#FFFFFF;

--gray-50:#F9FAFB;
--gray-100:#F3F4F6;
--gray-200:#E5E7EB;
--gray-300:#D1D5DB;
--gray-400:#9CA3AF;
--gray-500:#6B7280;
--gray-600:#4B5563;
--gray-700:#374151;
--gray-800:#1F2937;
--gray-900:#111827;

--background:#F5F7FB;

--shadow-xs:0 1px 2px rgba(0,0,0,.05);
--shadow-sm:0 2px 8px rgba(0,0,0,.08);
--shadow-md:0 5px 15px rgba(0,0,0,.12);
--shadow-lg:0 10px 30px rgba(0,0,0,.15);

--radius-xs:4px;
--radius-sm:8px;
--radius-md:12px;
--radius-lg:16px;
--radius-xl:24px;

--transition:.25s ease;

--navbar-height:70px;
--sidebar-width:270px;

}

/*==========================================================
RESET
==========================================================*/

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Inter',sans-serif;

background:var(--background);

color:var(--gray-800);

font-size:14px;

line-height:1.5;

overflow-x:hidden;

min-height:100vh;

}

img{
display:block;
max-width:100%;
}

button{
font-family:inherit;
cursor:pointer;
border:none;
background:none;
outline:none;
}

input,
select,
textarea{
font-family:inherit;
outline:none;
}

table{
border-collapse:collapse;
width:100%;
}

a{
text-decoration:none;
color:inherit;
}

ul{
list-style:none;
}

/*==========================================================
SCROLLBAR
==========================================================*/

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-track{
background:#ececec;
}

::-webkit-scrollbar-thumb{
background:var(--gray-400);
border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
background:var(--primary);
}

/*==========================================================
PAGE
==========================================================*/

.page{

padding:24px;

padding-bottom:100px;

display:block;

}

.page-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

gap:20px;

}

.page-header h2{

font-size:28px;

font-weight:700;

color:var(--gray-900);

}

.page-header p{

margin-top:5px;

color:var(--gray-500);

}

/*==========================================================
BUTTON
==========================================================*/

.btn-primary{

background:var(--primary);

color:white;

padding:12px 24px;

border-radius:10px;

display:inline-flex;

align-items:center;

gap:10px;

font-weight:600;

transition:var(--transition);

}

.btn-primary:hover{

background:var(--primary-dark);

}

.btn-secondary{

background:white;

border:1px solid var(--gray-300);

padding:12px 24px;

border-radius:10px;

display:inline-flex;

align-items:center;

gap:10px;

transition:var(--transition);

}

.btn-secondary:hover{

background:var(--gray-100);

}

.btn-danger{

background:var(--danger);

color:white;

padding:12px 24px;

border-radius:10px;

display:inline-flex;

align-items:center;

gap:10px;

transition:var(--transition);

}

.btn-danger:hover{

opacity:.92;

}

.btn-icon{

width:42px;

height:42px;

border-radius:50%;

background:white;

box-shadow:var(--shadow-xs);

display:flex;

justify-content:center;

align-items:center;

transition:var(--transition);

}

.btn-icon:hover{

background:var(--primary);

color:white;

}

/*==========================================================
FORM
==========================================================*/

.form-group{

margin-bottom:18px;

}

.form-group label{

display:block;

font-weight:600;

margin-bottom:8px;

}

.form-group input,
.form-group select,
.form-group textarea{

width:100%;

padding:12px 14px;

border:1px solid var(--gray-300);

border-radius:10px;

background:white;

transition:var(--transition);

}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(37,99,235,.15);

}

/*==========================================================
LOGIN
==========================================================*/

.login-wrapper{

display:flex;

justify-content:center;

align-items:center;

width:100%;

height:100vh;

background:linear-gradient(135deg,#1F3A8A,#2563EB);

padding:20px;

}

.login-card{

width:420px;

max-width:100%;

background:white;

border-radius:20px;

padding:40px;

box-shadow:var(--shadow-lg);

}

.login-logo{

text-align:center;

margin-bottom:35px;

}

.logo-box{

width:90px;

height:90px;

margin:auto;

background:var(--primary);

color:white;

border-radius:24px;

display:flex;

justify-content:center;

align-items:center;

font-size:36px;

margin-bottom:18px;

}

.login-logo h1{

font-size:34px;

font-weight:800;

}

.login-logo p{

margin-top:10px;

color:var(--gray-500);

}

.login-footer{

margin-top:35px;

text-align:center;

color:var(--gray-500);

font-size:13px;

}

/*==========================================================
CARD
==========================================================*/

.card{

background:white;

border-radius:16px;

padding:20px;

box-shadow:var(--shadow-sm);

}

.card-title{

font-size:18px;

font-weight:700;

margin-bottom:20px;

}

/*==========================================================
WELCOME CARD
==========================================================*/

.welcome-card{

background:linear-gradient(135deg,#2563EB,#1F3A8A);

padding:30px;

border-radius:18px;

color:white;

margin-bottom:25px;

box-shadow:var(--shadow-md);

}

.welcome-card h3{

font-size:28px;

margin-bottom:10px;

font-weight:700;

}

.welcome-card p{

opacity:.9;

}

/*==========================================================
KPI
==========================================================*/

.dashboard-kpi{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:25px;

}

.kpi-card{

background:white;

padding:24px;

border-radius:16px;

box-shadow:var(--shadow-sm);

transition:var(--transition);

}

.kpi-card:hover{

transform:translateY(-4px);

}

.kpi-card span{

display:block;

font-size:13px;

color:var(--gray-500);

margin-bottom:10px;

}

.kpi-card h2{

font-size:32px;

font-weight:700;

color:var(--primary);

}

/*==========================================================
CHART
==========================================================*/

.dashboard-chart{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:25px;

}

.dashboard-chart canvas{

width:100%;

height:320px;

}

/*==========================================================
TABLE
==========================================================*/

.table-dashboard,
.table-history{

background:white;

}

.table-dashboard th,
.table-dashboard td,
.table-history th,
.table-history td{

padding:14px;

border-bottom:1px solid var(--gray-200);

text-align:left;

}

.table-dashboard thead,
.table-history thead{

background:var(--gray-100);

font-weight:700;

}

.table-dashboard tbody tr:hover,
.table-history tbody tr:hover{

background:#f9fbff;

}/*==========================================================
HISTORY
==========================================================*/

.history-filter{

display:flex;

gap:15px;

align-items:center;

flex-wrap:wrap;

margin-bottom:20px;

}

.filter-group{

flex:1;

min-width:180px;

}

.history-table{

background:white;

border-radius:16px;

overflow:hidden;

box-shadow:var(--shadow-sm);

}

.history-pagination{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-top:25px;

}

.history-summary{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-top:25px;

}

.summary-card{

background:white;

padding:20px;

border-radius:16px;

text-align:center;

box-shadow:var(--shadow-sm);

}

.summary-card span{

display:block;

color:var(--gray-500);

margin-bottom:10px;

}

.summary-card h3{

font-size:28px;

color:var(--primary);

}

/*==========================================================
PROFILE
==========================================================*/

.profile-card{

background:white;

padding:30px;

border-radius:18px;

box-shadow:var(--shadow-sm);

text-align:center;

margin-bottom:25px;

}

.profile-avatar{

width:120px;

height:120px;

border-radius:50%;

background:var(--primary);

color:white;

display:flex;

justify-content:center;

align-items:center;

font-size:50px;

margin:0 auto 20px;

}

.profile-section,

.profile-system{

background:white;

padding:25px;

border-radius:16px;

box-shadow:var(--shadow-sm);

margin-bottom:20px;

}

.profile-item,

.system-item{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid var(--gray-200);

}

.profile-item:last-child,

.system-item:last-child{

border-bottom:none;

}

.profile-menu{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

margin-bottom:20px;

}

.menu-button{

background:white;

padding:18px;

border-radius:14px;

box-shadow:var(--shadow-sm);

display:flex;

align-items:center;

gap:12px;

transition:var(--transition);

}

.menu-button:hover{

background:var(--primary);

color:white;

}

.profile-action{

margin-top:25px;

}

/*==========================================================
MASTER MENU
==========================================================*/

.menu-grid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

gap:20px;

}

.menu-card{

background:white;

padding:24px;

border-radius:16px;

box-shadow:var(--shadow-sm);

cursor:pointer;

transition:var(--transition);

}

.menu-card:hover{

transform:translateY(-5px);

box-shadow:var(--shadow-md);

}

.menu-icon{

width:60px;

height:60px;

border-radius:14px;

background:rgba(37,99,235,.1);

display:flex;

justify-content:center;

align-items:center;

font-size:26px;

color:var(--primary);

margin-bottom:20px;

}

.menu-title{

font-size:18px;

font-weight:700;

margin-bottom:8px;

}

.menu-desc{

font-size:13px;

color:var(--gray-500);

}

/*==========================================================
FORM
==========================================================*/

.form-menu{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:20px;

}

.tab-button{

padding:12px 20px;

background:white;

border-radius:12px;

box-shadow:var(--shadow-xs);

display:flex;

align-items:center;

gap:10px;

transition:var(--transition);

}

.tab-button.active{

background:var(--primary);

color:white;

}

.form-container{

background:white;

padding:25px;

border-radius:16px;

box-shadow:var(--shadow-sm);

min-height:350px;

}

.form-action{

margin-top:25px;

display:flex;

gap:15px;

justify-content:flex-end;

}

/*==========================================================
SIDEBAR
==========================================================*/

.sidebar{

position:fixed;

left:0;

top:0;

width:var(--sidebar-width);

height:100vh;

background:white;

box-shadow:var(--shadow-md);

display:flex;

flex-direction:column;

z-index:100;

}

.sidebar-header{

padding:30px 25px;

display:flex;

align-items:center;

gap:15px;

border-bottom:1px solid var(--gray-200);

}

.sidebar-logo{

width:55px;

height:55px;

background:var(--primary);

color:white;

border-radius:14px;

display:flex;

justify-content:center;

align-items:center;

font-size:24px;

}

.sidebar-title h2{

font-size:24px;

}

.sidebar-title span{

font-size:12px;

color:var(--gray-500);

}

.sidebar-menu{

padding:20px;

display:flex;

flex-direction:column;

gap:8px;

}

.sidebar-item{

display:flex;

align-items:center;

gap:15px;

padding:14px 16px;

border-radius:12px;

transition:var(--transition);

}

.sidebar-item.active,

.sidebar-item:hover{

background:var(--primary);

color:white;

}

.sidebar-footer{

margin-top:auto;

padding:20px;

border-top:1px solid var(--gray-200);

}

.sidebar-user{

display:flex;

align-items:center;

gap:12px;

margin-bottom:20px;

}

.sidebar-user i{

font-size:32px;

color:var(--primary);

}

.sidebar-logout{

width:100%;

padding:12px;

border-radius:10px;

background:var(--danger);

color:white;

display:flex;

justify-content:center;

gap:10px;

}

/*==========================================================
BOTTOM NAVBAR
==========================================================*/

.bottom-navbar{

position:fixed;

left:0;

right:0;

bottom:0;

height:var(--navbar-height);

background:white;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:0 -3px 12px rgba(0,0,0,.08);

z-index:200;

}

.nav-item{

display:flex;

flex-direction:column;

align-items:center;

gap:5px;

font-size:12px;

color:var(--gray-500);

transition:var(--transition);

}

.nav-item i{

font-size:20px;

}

.nav-item.active,

.nav-item:hover{

color:var(--primary);

}

/*==========================================================
MODAL
==========================================================*/

.modal-overlay{

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

}

.modal-container{

width:420px;

max-width:90%;

background:white;

border-radius:18px;

padding:28px;

box-shadow:var(--shadow-lg);

}

.modal-header{

text-align:center;

margin-bottom:20px;

}

.modal-icon{

font-size:50px;

color:var(--primary);

margin-bottom:12px;

}

.modal-body{

text-align:center;

margin-bottom:25px;

line-height:1.6;

}

.modal-footer{

display:flex;

justify-content:center;

gap:12px;

}

/*==========================================================
LOADER
==========================================================*/

.loader-wrapper,

.loading-overlay{

position:fixed;

inset:0;

background:rgba(255,255,255,.75);

display:flex;

justify-content:center;

align-items:center;

z-index:99999;

backdrop-filter:blur(3px);

}

.loader-box,

.loading-box{

width:320px;

background:white;

padding:30px;

border-radius:18px;

box-shadow:var(--shadow-lg);

text-align:center;

}

.loader-spinner,

.loading-spinner{

font-size:40px;

color:var(--primary);

margin-bottom:20px;

}

.loader-title{

font-size:20px;

font-weight:700;

margin-bottom:10px;

}

.loader-message,

.loading-text{

color:var(--gray-500);

margin-bottom:20px;

}

.loader-progress{

height:10px;

background:var(--gray-200);

border-radius:20px;

overflow:hidden;

}

.loader-progress-bar{

width:0;

height:100%;

background:var(--primary);

transition:width .3s;

}

.loader-percentage{

margin-top:10px;

font-size:13px;

font-weight:600;

}

/*==========================================================
TOAST
==========================================================*/

.toast-notification{

position:fixed;

top:25px;

right:25px;

background:white;

padding:18px 24px;

border-radius:14px;

display:flex;

align-items:center;

gap:14px;

box-shadow:var(--shadow-lg);

z-index:10000;

animation:slideDown .25s ease;

}

.toast-icon{

font-size:24px;

color:var(--success);

}

/*==========================================================
UTILITY
==========================================================*/

.text-center{text-align:center;}
.text-right{text-align:right;}
.text-left{text-align:left;}

.d-none{display:none!important;}
.d-flex{display:flex!important;}
.d-block{display:block!important;}

.mt-10{margin-top:10px;}
.mt-20{margin-top:20px;}
.mt-30{margin-top:30px;}

.mb-10{margin-bottom:10px;}
.mb-20{margin-bottom:20px;}
.mb-30{margin-bottom:30px;}

/*==========================================================
ANIMATION
==========================================================*/

@keyframes slideDown{

from{

opacity:0;

transform:translateY(-15px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}

.fade-in{

animation:fadeIn .3s ease;

}

/*==========================================================
END
==========================================================*/

</style>
