<script>

const Footer = (()=>{

"use strict";

function load(){

    const user = Session.user();

    if(user){

        footerUser.innerHTML =

            user.FULLNAME;

    }

    footerSync.innerHTML =

        new Date()

        .toLocaleString();

}

function database(status){

    dbIndicator.className =

        "status-dot " +

        (status ? "online" : "offline");

}

function server(status){

    serverIndicator.className =

        "status-dot " +

        (status ? "online" : "offline");

}

function api(status){

    apiIndicator.className =

        "status-dot " +

        (status ? "online" : "offline");

}

return{

    load,

    database,

    server,

    api

};

})();
