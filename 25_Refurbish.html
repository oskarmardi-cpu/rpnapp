<section id="pageRefurbish" class="rpn-refurbish"><style>
.rpn-refurbish{padding:24px 30px 42px;background:#f4f8ff;min-height:calc(100vh - 72px);color:#14233e}.rfb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.rfb-head h1{margin:0;font-size:26px}.rfb-head p{margin:5px 0;color:#8190a7;font-size:10px}.rfb-btn,.rfb-add{border:1px solid #dbe5f2;background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;font-size:10px;cursor:pointer}.rfb-btn.primary{background:#2563eb;color:#fff;border:0}.rfb-card{background:#fff;border:1px solid #e1e9f4;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 25px #0f172a0b}.rfb-section{display:flex;align-items:center;gap:9px;margin-bottom:14px}.rfb-section b{width:28px;height:28px;border-radius:9px;background:#eaf1ff;color:#2563eb;display:grid;place-items:center;font-size:10px}.rfb-section h2{margin:0;font-size:13px}.rfb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.rfb-field{display:flex;flex-direction:column;gap:5px}.rfb-field.full{grid-column:1/-1}.rfb-field label{font-size:9px;font-weight:800;color:#596b87}.rfb-field input,.rfb-field select,.rfb-field textarea{width:100%;padding:10px;border:1px solid #dce5f1;border-radius:9px;background:#fbfdff;font-size:10px;box-sizing:border-box}.rfb-field textarea{min-height:80px}.rfb-category{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rfb-cat{padding:14px;text-align:left;border:1px solid #dce5f1;border-radius:12px;background:#fff;cursor:pointer}.rfb-cat.active{border-color:#2563eb;background:#eef5ff}.rfb-cat strong,.rfb-cat span{display:block}.rfb-cat strong{font-size:10px}.rfb-cat span{font-size:8px;color:#8492a7;margin-top:4px}.rfb-pane{display:none}.rfb-pane.active{display:block}.rfb-repeat{padding:12px;border:1px solid #e4eaf3;border-radius:11px;background:#fbfdff;margin-bottom:9px}.rfb-repeat-head{display:flex;justify-content:space-between;margin-bottom:9px;font-size:9px;font-weight:800}.rfb-repeat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.rfb-remove{border:0;background:#fff0f0;color:#ef4444;border-radius:7px;width:28px;height:28px}.rfb-add{color:#2563eb;border-style:dashed;margin-top:4px}.rfb-footer{display:flex;justify-content:flex-end;gap:8px}.rfb-status{display:none;padding:11px;margin-bottom:12px;border-radius:9px;font-size:10px;font-weight:700}.rfb-status.ok,.rfb-status.err{display:block}.rfb-status.ok{background:#eafaf0;color:#15803d}.rfb-status.err{background:#fff0f0;color:#b91c1c}.rfb-radio{display:flex;flex-wrap:wrap;gap:7px}.rfb-radio label{border:1px solid #dce5f1;padding:7px;border-radius:8px;font-size:8px}@media(max-width:1050px){.rfb-grid,.rfb-repeat-grid{grid-template-columns:repeat(2,1fr)}.rfb-category{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.rpn-refurbish{padding:15px}.rfb-head{display:block}.rfb-grid,.rfb-repeat-grid,.rfb-category{grid-template-columns:1fr}.rfb-field.full{grid-column:auto}.rfb-footer{flex-direction:column}.rfb-btn{width:100%}}
</style><div class="rfb-head"><div><h1>Update Job Refurbish</h1><p>Input data operasional RPN Management System</p></div><div><button class="rfb-btn" onclick="Refurbish.reset()">Reset</button> <button class="rfb-btn primary" onclick="Refurbish.save()">Simpan Data</button></div></div><div id="refurbishStatus" class="rfb-status"></div>
<div class="rfb-card"><div class="rfb-section"><b>01</b><h2>KATEGORI</h2></div><div class="rfb-category"><button type="button" class="rfb-cat active" data-cat="PERBAIKAN UNIT" onclick="Refurbish.category(this.dataset.cat)"><strong>PERBAIKAN UNIT</strong><span>Repair / refurbish</span></button><button type="button" class="rfb-cat" data-cat="PENARIKAN UNIT" onclick="Refurbish.category(this.dataset.cat)"><strong>PENARIKAN UNIT</strong><span>Unit withdrawal</span></button><button type="button" class="rfb-cat" data-cat="PENGIRIMAN UNIT" onclick="Refurbish.category(this.dataset.cat)"><strong>PENGIRIMAN UNIT</strong><span>Unit delivery</span></button><button type="button" class="rfb-cat" data-cat="LOAN SPAREPART" onclick="Refurbish.category(this.dataset.cat)"><strong>LOAN SPAREPART</strong><span>Loan & part</span></button></div></div><form id="refurbishForm" onsubmit="event.preventDefault();Refurbish.save()"><div id="paneRepair" class="rfb-pane active"></div><div id="panePull" class="rfb-pane"></div><div id="paneDelivery" class="rfb-pane"></div><div id="paneLoan" class="rfb-pane"></div><div class="rfb-footer"><button type="button" class="rfb-btn" onclick="Refurbish.reset()">Batal</button><button type="button" class="rfb-btn" onclick="Refurbish.sendWhatsApp()">Kirim Laporan WhatsApp</button><button type="submit" class="rfb-btn primary">Simpan & Selesai</button></div></form>
<script>
const Refurbish=(()=>{const $=id=>document.getElementById(id);let cat='PERBAIKAN UNIT';const branches='<option value="">Pilih cabang</option><option>Lemah Abang</option><option>Surabaya</option><option>Medan</option><option>Semarang</option>';const I=(l,id,t='text')=>`<div class="rfb-field"><label>${l}</label><input id="${id}" type="${t}"></div>`;const C=(n,t,b)=>`<div class="rfb-card"><div class="rfb-section"><b>${n}</b><h2>${t}</h2></div>${b}</div>`;function rep(t){let title=t==='rec'?'RECOMMENDATIONS':t==='install'?'INSTALL PART':t==='job'?'TYPE JOB':t==='spec'?'SPESIFIKASI TAMBAHAN':'PART',b='';if(t==='rec')b=I('Part Number','pn')+I('Part Name','pname')+I('Qty','qty','number')+I('Remarks','remarks');if(t==='install')b=I('Part Number','ipn')+I('Part Name','ipname')+I('Qty','iqty','number')+I('No Job','nojob')+I('No PR','nopr')+I('Remarks','iremarks');if(t==='job')b=I('Type Unit','junit')+I('SN Unit','jsn')+I('Year','jyear','number')+I('HM','jhm','number');if(t==='spec')b=I('Battery Dalam unit','battery')+I('Battery Spare 1','battery1')+I('Battery Spare 2','battery2')+I('Charger SN','charger')+I('Trolly','trolly')+'<div class="rfb-field full"><label>Remark</label><textarea id="remark"></textarea></div>';if(t==='part')b=I('Part Name','partname')+I('Part Number','partno')+I('Qty Part','partqty','number')+'<div class="rfb-field full"><label>Kondisi Part</label><div class="rfb-radio"><label>New good</label><label>Good used</label><label>Normal unit</label><label>Permintaan</label></div></div>';return `<div class="rfb-repeat"><div class="rfb-repeat-head"><span>${title}</span><button type="button" class="rfb-remove" onclick="this.closest('.rfb-repeat').remove()">×</button></div><div class="rfb-repeat-grid">${b}</div></div>`}function add(t){const id=t==='rec'?'recRows':t==='install'?'installRows':t==='job'?'jobRows':t==='spec'?'specRows':'partRows';$(id).insertAdjacentHTML('beforeend',rep(t))}function repair(){let b=C('02','CABANG & TANGGAL',`<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">${branches}</select></div>${I('Tanggal (DATE)','date','date')}</div>`);b+=C('03','DETAIL UNIT',`<div class="rfb-grid">${I('Unit Type','unitType')}${I('Serial Number','serial')}${I('Year','year','number')}${I('Hour Meter','hm','number')}</div>`);b+=C('04','JOB DESCRIPTIONS',`<div class="rfb-grid">${I('Job Type','jobType')}${I('Problem Date','problemDate','date')}${I('Status RFU : %','rfu','number')}${I('RFU Date','rfuDate','date')}<div class="rfb-field full"><label>Problem</label><textarea id="problem"></textarea></div><div class="rfb-field full"><label>Action</label><textarea id="action"></textarea></div></div>`);b+=C('05','RECOMMENDATIONS','<div id="recRows"></div><button type="button" class="rfb-add" onclick="Refurbish.add(\'rec\')">+ REKOMENDASI</button>');b+=C('06','INSTALL PART','<div id="installRows"></div><button type="button" class="rfb-add" onclick="Refurbish.add(\'install\')">+ INSTALL PART</button>');$('paneRepair').innerHTML=b;add('rec');add('install')}function movement(p){let b=C('02','CABANG',`<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">${branches}</select></div>${I('Customer','customer')}</div>`);b+=C('03',cat==='PENARIKAN UNIT'?'TYPE JOB (PENARIKAN)':'TYPE JOB (PENGIRIMAN)','<div id="jobRows"></div><button type="button" class="rfb-add" onclick="Refurbish.add(\'job\')">+ TYPE JOB</button>');b+=C('04','SPESIFIKASI TAMBAHAN','<div id="specRows"></div><button type="button" class="rfb-add" onclick="Refurbish.add(\'spec\')">+ SPESIFIKASI TAMBAHAN</button>');$(p).innerHTML=b;add('job');add('spec')}function loan(){let b=C('02','IDENTITAS LOAN',`<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">${branches}</select></div>${I('Nomer Loan','loanNo')}${I('Nomer To/So/Pr','toSoPr')}</div>`);b+=C('03','UNIT YANG DIKANIBAL',`<div class="rfb-grid">${I('Type Unit','cannibalType')}${I('Serial Number','cannibalSN')}</div>`);b+=C('04','UNIT DI INSTAL',`<div class="rfb-grid">${I('Type Unit','installType')}${I('Serial Number','installSN')}</div>`);b+=C('05','PART','<div id="partRows"></div><button type="button" class="rfb-add" onclick="Refurbish.add(\'part\')">+ PART</button>');b+=C('06','PEMINJAM',`<div class="rfb-grid">${I('Customer','customer')}<div class="rfb-field"><label>Divisi Peminjam</label><select id="division"><option>Service</option><option>Rental</option><option>Part</option><option>Inventory</option></select></div>${I('Pic Peminjam','pic')}${I('Pengambil Part','collector')}</div>`);$('paneLoan').innerHTML=b;add('part')}function category(c){cat=c;document.querySelectorAll('.rfb-cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===c));document.querySelectorAll('.rfb-pane').forEach(x=>x.classList.remove('active'));if(c==='PERBAIKAN UNIT'){$('paneRepair').classList.add('active');repair()}else if(c==='PENARIKAN UNIT'){$('panePull').classList.add('active');movement('panePull')}else if(c==='PENGIRIMAN UNIT'){$('paneDelivery').classList.add('active');movement('paneDelivery')}else{$('paneLoan').classList.add('active');loan()}}function v(id){const e=$(id);return e?e.value:''}function data(){return{CATEGORY:cat,BRANCH:v('branch'),DATE:v('date'),UNIT_TYPE:v('unitType'),SERIAL_NUMBER:v('serial'),YEAR:v('year'),HOUR_METER:v('hm'),JOB_TYPE:v('jobType'),PROBLEM_DATE:v('problemDate'),PROBLEM:v('problem'),RFU_PERCENT:v('rfu'),RFU_DATE:v('rfuDate'),ACTION:v('action'),CUSTOMER:v('customer'),LOAN_NO:v('loanNo'),TO_SO_PR:v('toSoPr')}}function save(){const d=data();if(!d.BRANCH){show('Cabang wajib diisi.',false);return}if(cat==='PERBAIKAN UNIT'&&(!d.DATE||!d.UNIT_TYPE||!d.SERIAL_NUMBER)){show('Tanggal, Unit Type dan Serial Number wajib diisi.',false);return}google.script.run.withSuccessHandler(r=>show(r&&r.success?'Data tersimpan. Ref ID: '+(r.data&&r.data.REF_ID||'-'):(r&&r.message)||'Gagal menyimpan.',!!(r&&r.success))).withFailureHandler(e=>show(e.message||String(e),false)).saveRefurbish(d)}function show(t,ok){const e=$('refurbishStatus');e.textContent=t;e.className='rfb-status '+(ok?'ok':'err')}function sendWhatsApp(){const n=prompt('Nomor WhatsApp tujuan/grup (format 628...):');if(!n)return;window.open('https://wa.me/'+n.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent('RPN Management System\nKategori: '+cat+'\nCabang: '+v('branch')+'\nUnit: '+v('unitType')+'\nSN: '+v('serial')),'_blank')}function reset(){category('PERBAIKAN UNIT');$('refurbishForm').reset();show('',true)}repair();return{category,add,save,sendWhatsApp,reset,data}})();</script></section>
