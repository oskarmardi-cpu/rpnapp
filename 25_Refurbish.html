<section id="pageRefurbish" class="rpn-refurbish">
<style>
.rpn-refurbish{padding:24px 30px 42px;background:linear-gradient(180deg,#f6f9ff,#eef4fb);min-height:calc(100vh - 72px);color:#14233e}.rfb-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.rfb-title h1{margin:0;font-size:26px}.rfb-title p{margin:5px 0;color:#7c8ba4;font-size:10px}.rfb-actions,.rfb-footer{display:flex;gap:8px}.rfb-btn,.rfb-add{height:40px;border:1px solid #dbe5f2;background:#fff;border-radius:11px;padding:0 14px;font-weight:800;font-size:10px;color:#30425f;cursor:pointer}.rfb-btn.primary{border:0;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}.rfb-card{background:#fff;border:1px solid #e1e9f4;border-radius:17px;box-shadow:0 12px 28px rgba(15,23,42,.055);padding:19px;margin-bottom:14px}.rfb-section{display:flex;align-items:center;gap:10px;margin-bottom:15px}.rfb-section b{width:28px;height:28px;border-radius:9px;background:#eaf1ff;color:#2563eb;display:grid;place-items:center;font-size:10px}.rfb-section h2{margin:0;font-size:13px}.rfb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.rfb-field{display:flex;flex-direction:column;gap:6px}.rfb-full{grid-column:1/-1}.rfb-field label{font-size:9px;font-weight:800;color:#596b87}.rfb-field input,.rfb-field select,.rfb-field textarea{width:100%;box-sizing:border-box;border:1px solid #dce5f1;border-radius:10px;background:#fbfdff;padding:10px 11px;font-size:10px;color:#1c2c48}.rfb-field textarea{min-height:82px;resize:vertical}.rfb-category{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.rfb-cat{padding:14px;text-align:left;border:1px solid #dce5f1;border-radius:13px;background:#fff;cursor:pointer}.rfb-cat.active{border-color:#2563eb;background:#eef5ff;box-shadow:0 8px 18px rgba(37,99,235,.08)}.rfb-cat strong,.rfb-cat span{display:block}.rfb-cat strong{font-size:10px}.rfb-cat span{font-size:8px;color:#8492a7;margin-top:4px}.rfb-pane{display:none}.rfb-pane.active{display:block}.rfb-repeat{border:1px solid #e4eaf3;border-radius:11px;background:#fbfdff;padding:12px;margin-bottom:9px}.rfb-repeat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:9px;font-weight:800}.rfb-repeat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.rfb-remove{border:0;background:#fff0f0;color:#ef4444;border-radius:7px;width:28px;height:28px;cursor:pointer}.rfb-add{height:34px;color:#2563eb;border-style:dashed}.rfb-radio{display:flex;flex-wrap:wrap;gap:7px}.rfb-radio label{border:1px solid #dce5f1;padding:8px;border-radius:8px;font-size:8px;background:#fff}.rfb-status{display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;font-size:10px;font-weight:700}.rfb-status.ok,.rfb-status.err{display:block}.rfb-status.ok{background:#eafaf0;color:#15803d}.rfb-status.err{background:#fff0f0;color:#b91c1c}.rfb-note{font-size:9px;color:#7d8da5;margin-top:8px}.rfb-wa{background:#eafaf0!important;color:#15803d!important;border-color:#bce8ca!important}@media(max-width:1050px){.rfb-grid,.rfb-repeat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rfb-category{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.rpn-refurbish{padding:15px}.rfb-head{align-items:stretch;flex-direction:column}.rfb-grid,.rfb-repeat-grid,.rfb-category{grid-template-columns:1fr}.rfb-full{grid-column:auto}.rfb-footer,.rfb-actions{flex-direction:column}.rfb-btn{width:100%}}
</style>
<div class="rfb-head"><div class="rfb-title"><h1>Update Job Refurbish</h1><p>Input data operasional RPN Management System</p></div><div class="rfb-actions"><button class="rfb-btn" type="button" onclick="Refurbish.reset()">Reset</button><button class="rfb-btn primary" type="button" onclick="Refurbish.save()">Simpan Data</button></div></div>
<div id="refurbishStatus" class="rfb-status"></div>
<div class="rfb-card"><div class="rfb-section"><b>01</b><h2>KATEGORI</h2></div><div class="rfb-category"><button type="button" class="rfb-cat active" data-cat="PERBAIKAN UNIT" onclick="Refurbish.category('PERBAIKAN UNIT')"><strong>PERBAIKAN UNIT</strong><span>Repair / refurbish</span></button><button type="button" class="rfb-cat" data-cat="PENARIKAN UNIT" onclick="Refurbish.category('PENARIKAN UNIT')"><strong>PENARIKAN UNIT</strong><span>Unit withdrawal</span></button><button type="button" class="rfb-cat" data-cat="PENGIRIMAN UNIT" onclick="Refurbish.category('PENGIRIMAN UNIT')"><strong>PENGIRIMAN UNIT</strong><span>Unit delivery</span></button><button type="button" class="rfb-cat" data-cat="LOAN SPAREPART" onclick="Refurbish.category('LOAN SPAREPART')"><strong>LOAN SPAREPART</strong><span>Loan & part</span></button></div></div>
<div id="paneRepair" class="rfb-pane active"></div><div id="panePull" class="rfb-pane"></div><div id="paneDelivery" class="rfb-pane"></div><div id="paneLoan" class="rfb-pane"></div>
<div class="rfb-footer"><button class="rfb-btn" type="button" onclick="Refurbish.reset()">Batal</button><button class="rfb-btn rfb-wa" type="button" onclick="Refurbish.sendWhatsApp()">Kirim Laporan WhatsApp</button><button class="rfb-btn primary" type="button" onclick="Refurbish.save()">Simpan & Selesai</button></div>
<script>
(function(){
  if(window.Refurbish&&window.Refurbish.__RFB_V2__)return;
  var cat='PERBAIKAN UNIT';
  var branches='<option value="">Pilih cabang</option><option>Lemah Abang</option><option>Surabaya</option><option>Medan</option><option>Semarang</option>';
  function $(id){return document.getElementById(id)}
  function activePane(){return document.querySelector('#pageRefurbish .rfb-pane.active')||document.getElementById('pageRefurbish')}
  function find(id){var p=activePane();return p?(p.querySelector('#'+id)||$(id)):$(id)}
  function input(label,id,type){return '<div class="rfb-field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'"></div>'}
  function card(no,title,body){return '<div class="rfb-card"><div class="rfb-section"><b>'+no+'</b><h2>'+title+'</h2></div>'+body+'</div>'}
  function repeat(type){
    var title='',body='';
    if(type==='rec'){title='RECOMMENDATIONS';body=input('Part Number','recPartNumber')+input('Part Name','recPartName')+input('Qty','recQty','number')+input('Remarks','recRemarks')}
    if(type==='install'){title='INSTALL PART';body=input('Part Number','insPartNumber')+input('Part Name','insPartName')+input('Qty','insQty','number')+input('No Job','insNoJob')+input('No PR','insNoPR')+input('Remarks','insRemarks')}
    if(type==='job'){title=cat==='PENARIKAN UNIT'?'TYPE JOB (PENARIKAN)':'TYPE JOB (PENGIRIMAN)';body=input('Type Unit','jobUnitType')+input('SN Unit','jobSN')+input('Year','jobYear','number')+input('HM','jobHM','number')}
    if(type==='spec'){title='SPESIFIKASI TAMBAHAN';body=input('Battery Dalam unit','batteryIn')+input('Battery Spare 1','battery1')+input('Battery Spare 2','battery2')+input('Charger SN','chargerSN')+input('Trolly','trolly')+'<div class="rfb-field rfb-full"><label>Remark</label><textarea id="movementRemark"></textarea></div>'}
    if(type==='part'){title='PART';body=input('Part Name','partName')+input('Part Number','partNumber')+input('Qty Part','partQty','number')+'<div class="rfb-field rfb-full"><label>Kondisi Part</label><div class="rfb-radio"><label><input type="radio" name="partCondition" value="New good"> New good</label><label><input type="radio" name="partCondition" value="Good used"> Good used</label><label><input type="radio" name="partCondition" value="Normal unit"> Normal unit</label><label><input type="radio" name="partCondition" value="Permintaan"> Permintaan</label></div></div>'}
    return '<div class="rfb-repeat"><div class="rfb-repeat-head"><span>'+title+'</span><button type="button" class="rfb-remove" onclick="this.closest(\'.rfb-repeat\').remove()">×</button></div><div class="rfb-repeat-grid">'+body+'</div></div>';
  }
  function repair(){
    var b=card('02','CABANG & TANGGAL','<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">'+branches+'</select></div>'+input('Tanggal (DATE)','date','date')+'</div>');
    b+=card('03','DETAIL UNIT','<div class="rfb-grid">'+input('Unit Type','unitType')+input('Serial Number','serial')+input('Year','year','number')+input('Hour Meter','hm','number')+'</div>');
    b+=card('04','JOB DESCRIPTIONS','<div class="rfb-grid">'+input('Job Type','jobType')+input('Problem Date','problemDate','date')+input('Status RFU : %','rfu','number')+input('RFU Date','rfuDate','date')+'<div class="rfb-field rfb-full"><label>Problem</label><textarea id="problem"></textarea></div><div class="rfb-field rfb-full"><label>Action</label><textarea id="action"></textarea></div></div>');
    b+=card('05','RECOMMENDATIONS','<div id="recRows">'+repeat('rec')+'</div><button type="button" class="rfb-add" onclick="Refurbish.add(\'rec\')">+ REKOMENDASI</button>');
    b+=card('06','INSTALL PART','<div id="installRows">'+repeat('install')+'</div><button type="button" class="rfb-add" onclick="Refurbish.add(\'install\')">+ INSTALL PART</button>');
    $("paneRepair").innerHTML=b;
    $("date").value=new Date().toISOString().slice(0,10);
  }
  function movement(target){
    var b=card('02','CABANG','<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">'+branches+'</select></div>'+input('Customer','customer')+'</div>');
    b+=card('03',cat==='PENARIKAN UNIT'?'TYPE JOB (PENARIKAN)':'TYPE JOB (PENGIRIMAN)','<div id="jobRows">'+repeat('job')+'</div><button type="button" class="rfb-add" onclick="Refurbish.add(\'job\')">+ TYPE JOB</button>');
    b+=card('04','SPESIFIKASI TAMBAHAN','<div id="specRows">'+repeat('spec')+'</div><button type="button" class="rfb-add" onclick="Refurbish.add(\'spec\')">+ SPESIFIKASI TAMBAHAN</button>');
    $(target).innerHTML=b;
  }
  function loan(){
    var b=card('02','IDENTITAS LOAN','<div class="rfb-grid"><div class="rfb-field"><label>Cabang</label><select id="branch">'+branches+'</select></div>'+input('Nomer Loan','loanNo')+input('Nomer To/So/Pr','toSoPr')+'</div>');
    b+=card('03','UNIT YANG DIKANIBAL','<div class="rfb-grid">'+input('Type Unit','cannibalType')+input('Serial Number','cannibalSN')+'</div>');
    b+=card('04','UNIT DI INSTAL','<div class="rfb-grid">'+input('Type Unit','installedType')+input('Serial Number','installedSN')+'</div>');
    b+=card('05','PART','<div id="partRows">'+repeat('part')+'</div><button type="button" class="rfb-add" onclick="Refurbish.add(\'part\')">+ PART</button>');
    b+=card('06','PEMINJAM','<div class="rfb-grid">'+input('Customer','customer')+'<div class="rfb-field"><label>Divisi Peminjam</label><select id="division"><option>Service</option><option>Rental</option><option>Part</option><option>Inventory</option></select></div>'+input('Pic Peminjam','pic')+input('Pengambil Part','collector')+'</div>');
    $("paneLoan").innerHTML=b;
  }
  function showPane(name){['paneRepair','panePull','paneDelivery','paneLoan'].forEach(function(id){$(id).classList.remove('active')});$(name).classList.add('active')}
  function category(c){cat=c;document.querySelectorAll('.rfb-cat').forEach(function(x){x.classList.toggle('active',x.dataset.cat===c)});if(c==='PERBAIKAN UNIT'){showPane('paneRepair');repair()}else if(c==='PENARIKAN UNIT'){showPane('panePull');movement('panePull')}else if(c==='PENGIRIMAN UNIT'){showPane('paneDelivery');movement('paneDelivery')}else{showPane('paneLoan');loan()}}
  function add(type){var id=type==='rec'?'recRows':type==='install'?'installRows':type==='job'?'jobRows':type==='spec'?'specRows':'partRows';var pane=activePane();var el=pane&&pane.querySelector('#'+id);if(el)el.insertAdjacentHTML('beforeend',repeat(type))}
  function val(id){var e=find(id);return e?e.value:''}
  function data(){return{CATEGORY:cat,BRANCH:val('branch'),DATE:val('date'),CUSTOMER:val('customer'),UNIT_TYPE:val('unitType'),SERIAL_NUMBER:val('serial'),YEAR:val('year'),HOUR_METER:val('hm'),JOB_TYPE:val('jobType'),PROBLEM_DATE:val('problemDate'),PROBLEM:val('problem'),RFU_PERCENT:val('rfu'),RFU_DATE:val('rfuDate'),ACTION:val('action'),LOAN_NO:val('loanNo'),TO_SO_PR:val('toSoPr'),TYPE_JOB:val('jobUnitType'),SN_UNIT:val('jobSN'),JOB_YEAR:val('jobYear'),JOB_HM:val('jobHM'),BATTERY_IN:val('batteryIn'),BATTERY_SPARE_1:val('battery1'),BATTERY_SPARE_2:val('battery2'),CHARGER_SN:val('chargerSN'),TROLLY:val('trolly'),REMARK:val('movementRemark'),CANNIBAL_TYPE:val('cannibalType'),CANNIBAL_SN:val('cannibalSN'),INSTALLED_TYPE:val('installedType'),INSTALLED_SN:val('installedSN'),PART_NAME:val('partName'),PART_NUMBER:val('partNumber'),QTY_PART:val('partQty'),PART_CONDITION:(activePane().querySelector('input[name="partCondition"]:checked')||{}).value||'',DIVISION_PEMINJAM:val('division'),PIC_PEMINJAM:val('pic'),PENGAMBIL_PART:val('collector')}}
  function show(msg,ok){var e=$("refurbishStatus");if(e){e.textContent=msg;e.className='rfb-status '+(ok?'ok':'err')}}
  function save(){var d=data();if(!d.BRANCH){show('Cabang wajib diisi.',false);return}if(cat==='PERBAIKAN UNIT'&&(!d.DATE||!d.UNIT_TYPE||!d.SERIAL_NUMBER||!d.JOB_TYPE)){show('Tanggal, Unit Type, Serial Number dan Job Type wajib diisi.',false);return}google.script.run.withSuccessHandler(function(r){show(r&&r.success?'Data tersimpan. Ref ID: '+((r.data&&r.data.REF_ID)||'-'):((r&&r.message)||'Gagal menyimpan.'),!!(r&&r.success))}).withFailureHandler(function(e){show(e.message||String(e),false)}).saveRefurbish(d)}
  function sendWhatsApp(){var n=prompt('Nomor WhatsApp tujuan/grup (format 628...):');if(!n)return;window.open('https://wa.me/'+n.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent('RPN Management System\nKategori: '+cat+'\nCabang: '+val('branch')+'\nCustomer: '+val('customer')+'\nUnit: '+val('unitType')+'\nSN: '+val('serial')),'_blank')}
  function reset(){category('PERBAIKAN UNIT');show('',true)}
  window.Refurbish={__RFB_V2__:true,category:category,add:add,save:save,sendWhatsApp:sendWhatsApp,reset:reset,data:data};
  repair();
})();
</script>
</section>
