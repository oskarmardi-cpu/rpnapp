<div
  id="modalOverlay"
  class="modal-overlay"
  style="display:none;">

  <div
    id="modalContainer"
    class="modal-container">

    <!-- HEADER -->

    <div class="modal-header">

      <div
        id="modalIcon"
        class="modal-icon">

        <i class="fa-solid fa-circle-info"></i>

      </div>

      <h3 id="modalTitle">
        Information
      </h3>

    </div>


    <!-- BODY -->

    <div class="modal-body">

      <p id="modalMessage">
        Message
      </p>

    </div>


    <!-- FOOTER -->

    <div class="modal-footer">

      <button
        id="modalCancel"
        class="btn-secondary"
        type="button">

        Cancel

      </button>

      <button
        id="modalOk"
        class="btn-primary"
        type="button">

        OK

      </button>

    </div>

  </div>

</div>


<script>

/*=========================================================
 SHOW MODAL
=========================================================*/

function showModal(
  title = "Informasi",
  message = ""
){

  const modal =
    document.getElementById(
      "modalOverlay"
    );

  if(!modal){

    alert(
      title +
      "\n\n" +
      message
    );

    return;

  }

  const modalTitle =
    document.getElementById(
      "modalTitle"
    );

  const modalMessage =
    document.getElementById(
      "modalMessage"
    );

  if(modalTitle){

    modalTitle.textContent =
      title;

  }

  if(modalMessage){

    modalMessage.textContent =
      message;

  }

  modal.style.display =
    "flex";

}


/*=========================================================
 HIDE MODAL
=========================================================*/

function hideModal(){

  const modal =
    document.getElementById(
      "modalOverlay"
    );

  if(!modal){

    return;

  }

  modal.style.display =
    "none";

}


/*=========================================================
 EVENT
=========================================================*/

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const modalOk =
      document.getElementById(
        "modalOk"
      );

    if(modalOk){

      modalOk.addEventListener(
        "click",
        hideModal
      );

    }


    const modalCancel =
      document.getElementById(
        "modalCancel"
      );

    if(modalCancel){

      modalCancel.addEventListener(
        "click",
        hideModal
      );

    }

  }
);

</script>
