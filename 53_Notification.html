<script>

const Notification = (()=>{

"use strict";

/*=========================================================
STATE
=========================================================*/

const state={

    notifications:new Map(),

    queue:new Map(),

    settings:new Map(),

    history:new Map(),

    container:new Map()

};

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    element

){

    state.notifications.set(

        name,

        element

    );

}

/*=========================================================
GET
=========================================================*/

function get(name){

    return state.notifications.get(

        name

    );

}

/*=========================================================
QUEUE
=========================================================*/

function queue(

    name,

    value

){

    if(arguments.length===1){

        return state.queue.get(

            name

        ) || [];

    }

    state.queue.set(

        name,

        value || []

    );

}

/*=========================================================
SETTINGS
=========================================================*/

function settings(

    name,

    value

){

    if(arguments.length===1){

        return state.settings.get(

            name

        ) || {};

    }

    state.settings.set(

        name,

        value || {}

    );

}

/*=========================================================
HISTORY
=========================================================*/

function history(

    name,

    value

){

    if(arguments.length===1){

        return state.history.get(

            name

        ) || [];

    }

    state.history.set(

        name,

        value || []

    );

}

/*=========================================================
CONTAINER
=========================================================*/

function container(

    name,

    value

){

    if(arguments.length===1){

        return state.container.get(

            name

        ) || null;

    }

    state.container.set(

        name,

        value

    );

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    state.notifications.delete(name);

    state.queue.delete(name);

    state.settings.delete(name);

    state.history.delete(name);

    state.container.delete(name);

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    state,

    register,

    get,

    queue,

    settings,

    history,

    container,

    remove

};

})();

</script><!--=========================================================

<script>

const NotificationRender = (()=>{

"use strict";

/*=========================================================
RENDER
=========================================================*/

function render(config){

    const container =

        document.createElement(

            "div"

        );

    container.id =

        config.id ||

        config.name;

    container.className =

        config.className ||

        "rpn-notification";

    container.innerHTML = `

<div class="notification-header"></div>

<div class="notification-body"></div>

<div class="notification-footer"></div>

`;

    if(

        config.container

    ){

        document

        .getElementById(

            config.container

        )

        .appendChild(

            container

        );

    }else{

        document.body.appendChild(

            container

        );

    }

    Notification.register(

        config.name,

        container

    );

    Notification.container(

        config.name,

        container

    );

    return container;

}

/*=========================================================
HEADER
=========================================================*/

function header(name){

    const box =

        Notification.get(name);

    return box

        ? box.querySelector(

            ".notification-header"

        )

        : null;

}

/*=========================================================
BODY
=========================================================*/

function body(name){

    const box =

        Notification.get(name);

    return box

        ? box.querySelector(

            ".notification-body"

        )

        : null;

}

/*=========================================================
FOOTER
=========================================================*/

function footer(name){

    const box =

        Notification.get(name);

    return box

        ? box.querySelector(

            ".notification-footer"

        )

        : null;

}

/*=========================================================
REMOVE
=========================================================*/

function remove(name){

    const box =

        Notification.get(name);

    if(

        box &&

        box.parentNode

    ){

        box.parentNode.removeChild(

            box

        );

    }

    Notification.remove(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    render,

    header,

    body,

    footer,

    remove

};

})();

<script>

const NotificationQueue = (()=>{

"use strict";

/*=========================================================
PUSH
=========================================================*/

function push(

    name,

    notification

){

    const queue =

        Notification.queue(

            name

        );

    queue.push({

        id :

        notification.id ||

        Date.now(),

        title :

        notification.title ||

        "",

        message :

        notification.message ||

        "",

        type :

        notification.type ||

        "info",

        duration :

        notification.duration ||

        5000,

        created :

        new Date()

    });

    Notification.queue(

        name,

        queue

    );

}

/*=========================================================
POP
=========================================================*/

function pop(name){

    const queue =

        Notification.queue(

            name

        );

    const item =

        queue.shift();

    Notification.queue(

        name,

        queue

    );

    return item;

}

/*=========================================================
PEEK
=========================================================*/

function peek(name){

    return Notification

        .queue(name)[0] ||

        null;

}

/*=========================================================
COUNT
=========================================================*/

function count(name){

    return Notification

        .queue(name)

        .length;

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    Notification.queue(

        name,

        []

    );

}

/*=========================================================
HISTORY
=========================================================*/

function history(

    name,

    notification

){

    const list =

        Notification.history(

            name

        );

    list.push(

        notification

    );

    Notification.history(

        name,

        list

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    push,

    pop,

    peek,

    count,

    clear,

    history

};

})();

<script>

const NotificationDisplay = (()=>{

"use strict";

/*=========================================================
SHOW
=========================================================*/

function show(

    name,

    notification

){

    NotificationQueue.push(

        name,

        notification

    );

    render(

        name

    );

}

/*=========================================================
RENDER
=========================================================*/

function render(name){

    const item =

        NotificationQueue.peek(

            name

        );

    if(

        !item

    ){

        return;

    }

    const box =

        Notification.get(

            name

        );

    if(

        !box

    ){

        return;

    }

    box.className =

        "rpn-notification " +

        item.type;

    NotificationRender

        .header(name)

        .innerHTML =

        item.title;

    NotificationRender

        .body(name)

        .innerHTML =

        item.message;

    NotificationRender

        .footer(name)

        .innerHTML =

        new Date(

            item.created

        ).toLocaleTimeString(

            "id-ID"

        );

    box.style.display =

        "block";

}

/*=========================================================
HIDE
=========================================================*/

function hide(name){

    const box =

        Notification.get(

            name

        );

    if(

        box

    ){

        box.style.display =

            "none";

    }

}

/*=========================================================
NEXT
=========================================================*/

function next(name){

    const item =

        NotificationQueue.pop(

            name

        );

    if(

        item

    ){

        NotificationQueue.history(

            name,

            item

        );

    }

    if(

        NotificationQueue.count(

            name

        )>0

    ){

        render(

            name

        );

    }else{

        hide(

            name

        );

    }

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    NotificationQueue.clear(

        name

    );

    hide(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    show,

    render,

    hide,

    next,

    clear

};

})();

<script>

const NotificationAutoClose = (()=>{

"use strict";

const timers = new Map();

/*=========================================================
START
=========================================================*/

function start(name){

    stop(name);

    const item =

        NotificationQueue.peek(

            name

        );

    if(

        !item

    ){

        return;

    }

    const timer =

        setTimeout(

            function(){

                NotificationDisplay.next(

                    name

                );

                start(

                    name

                );

            },

            item.duration ||

            5000

        );

    timers.set(

        name,

        timer

    );

}

/*=========================================================
STOP
=========================================================*/

function stop(name){

    const timer =

        timers.get(

            name

        );

    if(

        timer

    ){

        clearTimeout(

            timer

        );

        timers.delete(

            name

        );

    }

}

/*=========================================================
RESTART
=========================================================*/

function restart(name){

    stop(

        name

    );

    start(

        name

    );

}

/*=========================================================
RUN
=========================================================*/

function run(

    name,

    notification

){

    NotificationDisplay.show(

        name,

        notification

    );

    start(

        name

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    stop(

        name

    );

    NotificationDisplay.clear(

        name

    );

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    start,

    stop,

    restart,

    run,

    clear

};

})();

<script>

const NotificationEvent = (()=>{

"use strict";

const listeners = new Map();

/*=========================================================
ON
=========================================================*/

function on(

    notification,

    event,

    callback

){

    const element =

        Notification.get(

            notification

        );

    if(

        !element ||

        typeof callback !==

        "function"

    ){

        return;

    }

    element.addEventListener(

        event,

        callback

    );

    listeners.set(

        notification +

        ":" +

        event,

        callback

    );

}

/*=========================================================
OFF
=========================================================*/

function off(

    notification,

    event

){

    const element =

        Notification.get(

            notification

        );

    const key =

        notification +

        ":" +

        event;

    const callback =

        listeners.get(

            key

        );

    if(

        element &&

        callback

    ){

        element.removeEventListener(

            event,

            callback

        );

    }

    listeners.delete(

        key

    );

}

/*=========================================================
TRIGGER
=========================================================*/

function trigger(

    notification,

    event,

    detail

){

    const element =

        Notification.get(

            notification

        );

    if(

        !element

    ){

        return;

    }

    element.dispatchEvent(

        new CustomEvent(

            event,

            {

                detail

            }

        )

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(

    notification

){

    Array.from(

        listeners.keys()

    )

    .forEach(function(key){

        if(

            key.startsWith(

                notification +

                ":"

            )

        ){

            const event =

                key.split(

                    ":"

                )[1];

            off(

                notification,

                event

            );

        }

    });

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    on,

    off,

    trigger,

    clear

};

})();

<script>

const NotificationTheme = (()=>{

"use strict";

let current = "default";

const themes = {

    default   : "rpn-notification-default",

    light     : "rpn-notification-light",

    dark      : "rpn-notification-dark",

    primary   : "rpn-notification-primary",

    success   : "rpn-notification-success",

    warning   : "rpn-notification-warning",

    danger    : "rpn-notification-danger",

    corporate : "rpn-notification-corporate"

};

/*=========================================================
SET
=========================================================*/

function set(

    notification,

    theme

){

    if(

        !themes[theme]

    ){

        return;

    }

    const element =

        Notification.get(

            notification

        );

    if(

        !element

    ){

        return;

    }

    Object.values(

        themes

    )

    .forEach(function(css){

        element.classList.remove(

            css

        );

    });

    element.classList.add(

        themes[theme]

    );

}

/*=========================================================
SET DEFAULT
=========================================================*/

function setDefault(theme){

    if(

        themes[theme]

    ){

        current =

            theme;

    }

}

/*=========================================================
GET
=========================================================*/

function get(){

    return current;

}

/*=========================================================
APPLY ALL
=========================================================*/

function applyAll(){

    Notification.state.notifications

    .forEach(function(

        element,

        name

    ){

        set(

            name,

            current

        );

    });

}

/*=========================================================
REGISTER
=========================================================*/

function register(

    name,

    css

){

    themes[name] =

        css;

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    set,

    setDefault,

    get,

    applyAll,

    register

};

})();

<script>

const NotificationProduction = (()=>{

"use strict";

const VERSION = "1.0.0";

/*=========================================================
BOOT
=========================================================*/

function boot(config){

    const notification =

        NotificationRender.render(

            config

        );

    NotificationTheme.set(

        config.name,

        config.theme ||

        "default"

    );

    Notification.settings(

        config.name,

        config.settings ||

        {}

    );

    Notification.queue(

        config.name,

        config.queue ||

        []

    );

    if(

        NotificationQueue.count(

            config.name

        ) > 0

    ){

        NotificationAutoClose.run(

            config.name,

            NotificationQueue.peek(

                config.name

            )

        );

    }

    NotificationEvent.trigger(

        config.name,

        "ready",

        {

            total :

            NotificationQueue.count(

                config.name

            )

        }

    );

    return notification;

}

/*=========================================================
NOTIFY
=========================================================*/

function notify(

    name,

    options

){

    NotificationAutoClose.run(

        name,

        options

    );

    NotificationEvent.trigger(

        name,

        "notify",

        options

    );

}

/*=========================================================
CLEAR
=========================================================*/

function clear(name){

    NotificationAutoClose.clear(

        name

    );

    NotificationEvent.trigger(

        name,

        "clear",

        {}

    );

}

/*=========================================================
DESTROY
=========================================================*/

function destroy(name){

    NotificationAutoClose.stop(

        name

    );

    NotificationEvent.clear(

        name

    );

    NotificationRender.remove(

        name

    );

}

/*=========================================================
INFO
=========================================================*/

function info(){

    return{

        component :

        "Notification",

        version :

        VERSION,

        edition :

        "Enterprise",

        status :

        "Production"

    };

}

/*=========================================================
PUBLIC
=========================================================*/

return{

    boot,

    notify,

    clear,

    destroy,

    info

};

})();

</script>
