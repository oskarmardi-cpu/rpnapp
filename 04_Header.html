<!-- RPN ENTERPRISE HEADER v7 -->
<header class="rpn-header">
  <div class="header-left">
    <button id="btnSidebar" class="header-icon-btn" type="button" onclick="Sidebar.toggle()" aria-label="Toggle navigation"><i class="ri-menu-line"></i></button>
    <div class="brand-lockup">
      <div class="brand-mark">RPN</div>
      <div class="brand-copy"><strong><?= CONFIG.APP.NAME ?></strong><span>Enterprise <?= CONFIG.VERSION.SYSTEM ?></span></div>
    </div>
  </div>
  <div class="header-center">
    <div class="global-search"><i class="ri-search-2-line"></i><input id="globalSearch" type="search" placeholder="Search unit, SN, FN, WO or customer..." autocomplete="off"><kbd>⌘ K</kbd></div>
  </div>
  <div class="header-right">
    <select id="branchSelector" class="header-select" onchange="App.changeBranch()"></select>
    <button class="header-icon-btn" onclick="App.fullscreen()" title="Fullscreen"><i class="ri-fullscreen-line"></i></button>
    <button class="header-icon-btn" onclick="Theme.toggle()" title="Theme"><i class="ri-contrast-2-line"></i></button>
    <button class="header-icon-btn notification-button" onclick="Notification.open()" title="Notifications"><i class="ri-notification-3-line"></i><span id="notificationBadge" class="header-badge">0</span></button>
    <button class="header-profile" onclick="Profile.open()" type="button">
      <span class="avatar-wrap"><img id="userPhoto" class="avatar" src="" alt="User"><span class="online-dot"></span></span>
      <span class="profile-copy"><strong id="userName"></strong><small id="userRole"></small></span><i class="ri-arrow-down-s-line"></i>
    </button>
  </div>
</header>
<script>
const Header=(()=>{
"use strict";
function load(){if(typeof Auth==="undefined"||typeof Auth.getUser!=="function")return;const u=Auth.getUser();if(!u)return;const n=document.getElementById("userName"),r=document.getElementById("userRole"),p=document.getElementById("userPhoto");if(n)n.textContent=u.FULLNAME||"User";if(r)r.textContent=u.ROLE||"";if(p){p.src=u.PHOTO||"";p.onerror=()=>{p.removeAttribute("src");p.classList.add("avatar-fallback");};}}
function notification(count){const b=document.getElementById("notificationBadge");if(!b)return;const n=Number(count)||0;b.textContent=n>99?"99+":n;b.style.display=n?"flex":"none";}
return{load,notification};})();
</script>
