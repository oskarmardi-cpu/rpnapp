<div id="login-page">

  <div class="login-left">

    <div class="login-brand">

      <img
        src="<?= CONFIG.APP.LOGO ?>"
        class="login-logo"
      >

      <h1>RPN</h1>

      <h2>
        Rental • Workshop • Used • Export
      </h2>

      <p>
        Enterprise Management System
      </p>

    </div>

  </div>

  <div class="login-right">

    <div class="login-card">

      <div class="login-title">
        Sign In
      </div>

      <div class="login-subtitle">
        Welcome to RPN Management System
      </div>

      <form id="loginForm">

        <div class="form-group">

          <label>
            Username
          </label>

          <input
            id="txtUsername"
            type="text"
            autocomplete="username"
            required
          >

        </div>

        <div class="form-group">

          <label>
            Password
          </label>

          <input
            id="txtPassword"
            type="password"
            autocomplete="current-password"
            required
          >

        </div>

        <div class="form-row">

          <label>

            <input
              id="rememberMe"
              type="checkbox"
            >

            Remember Me

          </label>

        </div>

        <button
          id="btnLogin"
          type="submit"
          class="btn-primary"
        >

          LOGIN

        </button>

      </form>

      <div class="login-version">

        Version
        <?= CONFIG.VERSION.SYSTEM ?>

      </div>

    </div>

  </div>

</div>

<script>

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();

      App.authenticate();

    }
  );

</script>
