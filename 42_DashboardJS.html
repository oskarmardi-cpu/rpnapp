<script>
const Dashboard=(()=>{
"use strict";
let chartUnitStatus=null,chartMonthly=null;
function init(){bindEvent()}
function bindEvent(){const b=document.getElementById("btnRefreshDashboard");if(b&&!b.dataset.dashboardBound){b.dataset.dashboardBound="1";b.addEventListener("click",loadDashboard)}}
function loadDashboard(){showLoader("Dashboard","Memuat data dashboard...");try{const user=Auth.getUser();if(!user){hideLoader();App.login();return}google.script.run.withSuccessHandler(onDashboardLoaded).withFailureHandler(onDashboardError).dashboardGet()}catch(err){hideLoader();console.error("Dashboard error:",err);if(typeof showModal==="function")showModal("Dashboard",err.message||String(err))}}
function onDashboardLoaded(response){hideLoader();if(!response||!response.success){if(typeof showModal==="function")showModal("Dashboard",response?.message||"Data dashboard tidak tersedia.");return}if(!response.data){if(typeof showModal==="function")showModal("Dashboard","Response dashboard tidak valid.");return}renderUser(response.data.user);renderKPI(response.data.kpi);renderCharts(response.data.chart);renderRecentActivity(response.data.activity);renderLatestReport(response.data.report)}
function onDashboardError(error){hideLoader();console.error(error);if(typeof showModal==="function")showModal("System Error",error?.message||String(error))}
function renderUser(user){const e=document.getElementById("welcomeName");if(e)e.textContent="Welcome, "+(user?.name||"-")}
function renderKPI(kpi){kpi=kpi||{};const total=document.getElementById("kpiTotalUnit"),rfu=document.getElementById("kpiRFU"),non=document.getElementById("kpiNonRFU"),loan=document.getElementById("kpiLoan");if(total)total.firstChild.nodeValue=(kpi.totalUnit??0)+" ";if(rfu)rfu.firstChild.nodeValue=(kpi.rfu??0)+" ";if(non)non.firstChild.nodeValue=(kpi.nonRfu??0)+" ";if(loan)loan.firstChild.nodeValue=(kpi.loanPart??0)+" "}
function renderCharts(chart){if(!chart)return;if(typeof Chart!=="function"){console.warn("Chart library unavailable; dashboard charts skipped.");return}if(chart.status)createStatusChart(chart.status);if(chart.monthly)createMonthlyChart(chart.monthly)}
function createStatusChart(data){const canvas=document.getElementById("chartUnitStatus");if(!data||!canvas||typeof Chart!=="function")return;if(chartUnitStatus)chartUnitStatus.destroy();chartUnitStatus=new Chart(canvas,{type:"doughnut",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom"}}}})}
function createMonthlyChart(data){const canvas=document.getElementById("chartMonthly");if(!data||!canvas||typeof Chart!=="function")return;if(chartMonthly)chartMonthly.destroy();chartMonthly=new Chart(canvas,{type:"bar",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom"}}}})}
function renderRecentActivity(activity){const c=document.getElementById("recentActivity");if(!c)return;c.innerHTML="";if(!activity||!activity.length){c.innerHTML="<p>Tidak ada aktivitas.</p>";return}activity.forEach(i=>{const d=document.createElement("div");d.className="activity-item";d.innerHTML=`<strong>${i.title}</strong><div>${i.description}</div><small>${i.time}</small>`;c.appendChild(d)})}
function renderLatestReport(report){const t=document.getElementById("dashboardReport");if(!t)return;t.innerHTML="";(report||[]).forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${r.date}</td><td>${r.unit}</td><td>${r.status}</td><td>${r.mechanic}</td>`;t.appendChild(tr)})}
return{init,loadDashboard};
})();
document.addEventListener("DOMContentLoaded",function(){Dashboard.init()});
</script>
