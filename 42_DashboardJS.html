<script>
const Dashboard=(()=>{
"use strict";
let chartMonthly=null,chartUnitStatus=null,movementResizeBound=false;
const fmt=v=>Number(v||0).toLocaleString("id-ID");
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=String(v==null?"—":v)}
function init(){bindEvent();loadDashboard()}
function bindEvent(){const b=document.getElementById("btnRefreshDashboard");if(b&&!b.dataset.dashboardBound){b.dataset.dashboardBound="1";b.addEventListener("click",loadDashboard)}}
function loadDashboard(){console.log("DASHBOARD: load start");try{if(typeof Loader!=="undefined"&&Loader.show)Loader.show("Memuat data dashboard...");const user=typeof Auth!=="undefined"&&Auth.getUser?Auth.getUser():null;if(!user){if(typeof Loader!=="undefined"&&Loader.hide)Loader.hide();console.warn("DASHBOARD: user session tidak tersedia");return}if(typeof google==="undefined"||!google.script||!google.script.run)throw new Error("Google Apps Script runtime tidak tersedia.");google.script.run.withSuccessHandler(onDashboardLoaded).withFailureHandler(onDashboardError).dashboardGet()}catch(e){console.error("DASHBOARD LOAD ERROR:",e);if(typeof Loader!=="undefined"&&Loader.hide)Loader.hide();if(typeof showModal==="function")showModal("Dashboard",e.message||String(e))}}
function onDashboardLoaded(r){console.log("DASHBOARD RESPONSE:",r);if(typeof Loader!=="undefined"&&Loader.hide)Loader.hide();if(!r||r.success!==true){console.error("DASHBOARD RESPONSE INVALID:",r);return}const d=r.data||{},m=d.movement||{};renderUser(d.user);renderKPI(d.kpi||{});renderSummary(d.kpi||{});renderMovement(m);renderMovementChart(m,d.chart||{});renderStatusFallback((d.chart||{}).status)}
function onDashboardError(e){if(typeof Loader!=="undefined"&&Loader.hide)Loader.hide();console.error("DASHBOARD SERVER ERROR:",e)}
function renderUser(u){const e=document.getElementById("welcomeName");if(e)e.textContent="Welcome, "+(u&&u.name?u.name:"Administrator RPN")}
function renderKPI(k){setText("kpiTotalUnit",fmt(k.totalUnit)+" Unit");setText("kpiRFU",fmt(k.rfu)+" Unit");setText("kpiNonRFU",fmt(k.nonRfu)+" Unit");setText("kpiLoan",fmt(k.loanPart)+" Unit")}
function renderSummary(k){setText("summaryTotal",fmt(k.totalUnit));setText("summaryRFU",fmt(k.rfu));setText("summaryNon",fmt(k.nonRfu));setText("summaryContract",fmt(k.loanPart))}
function normalizeMovement(m){if(m&&Array.isArray(m.rows)&&m.rows.length)return m.rows.map(r=>({period:r&&r.period!=null?String(r.period):"",in:Number(r&&r.in)||0,out:Number(r&&r.out)||0,balance:Number(r&&r.balance)||0})).filter(r=>r.period);if(m&&Array.isArray(m.labels)&&m.labels.length)return m.labels.map((l,i)=>({period:String(l),in:Number((m.in||[])[i])||0,out:Number((m.out||[])[i])||0,balance:Number((m.balance||[])[i])||0}));const t=document.querySelector(".movement-panel table.movement-table"),rows=[];if(t){t.querySelectorAll("tbody tr").forEach(tr=>{const c=tr.querySelectorAll("td");if(c.length>=4){const p=String(c[0].textContent||"").trim();if(p)rows.push({period:p,in:Number(String(c[1].textContent||"").replace(/[^\d.-]/g,""))||0,out:Number(String(c[2].textContent||"").replace(/[^\d.-]/g,""))||0,balance:Number(String(c[3].textContent||"").replace(/[^\d.-]/g,""))||0})}})}if(rows.length)console.log("DASHBOARD MOVEMENT DOM FALLBACK:",rows);return rows}
function renderMovement(m){const rows=normalizeMovement(m);console.log("DASHBOARD MOVEMENT ROWS:",rows);if(!rows.length)return;const panels=document.querySelectorAll(".movement-panel"),sp=panels.length>2?panels[2]:null;if(sp&&m&&m.ytd){const y=m.ytd,v=sp.querySelectorAll(".movement-kpi strong");if(v[0]&&y.totalIn!=null)v[0].textContent=fmt(y.totalIn);if(v[1]&&y.totalOut!=null)v[1].textContent=fmt(y.totalOut);if(v[2]&&y.currentBalance!=null)v[2].textContent=fmt(y.currentBalance)}}
function renderMovementChart(m,chart){let rows=normalizeMovement(m),canvas=document.getElementById("chartMonthly");console.log("DASHBOARD CHART SOURCE:",rows);if(!rows.length&&chart&&chart.monthly){const q=chart.monthly;rows=normalizeMovement({labels:q.labels||[],in:q.datasets&&q.datasets[0]?q.datasets[0].data:[],out:q.datasets&&q.datasets[1]?q.datasets[1].data:[],balance:q.datasets&&q.datasets[2]?q.datasets[2].data:[]})}if(!canvas||!rows.length){console.warn("DASHBOARD CHART: canvas atau data movement tidak tersedia",{canvasFound:!!canvas,movementRows:rows.length});return}if(chartMonthly&&chartMonthly.canvas===canvas)chartMonthly.clear();function draw(){const r=canvas.getBoundingClientRect(),w=Math.max(320,Math.floor(r.width||700)),h=Math.max(220,Math.floor(r.height||245)),dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";const x=canvas.getContext("2d");if(!x)return;x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);const L=40,R=40,T=22,B=30,pw=w-L-R,ph=h-T-B,maxM=Math.max(50,Math.ceil(Math.max(...rows.map(a=>Math.max(a.in,a.out)))/10)*10),maxB=Math.max(200,Math.ceil(Math.max(...rows.map(a=>a.balance))/50)*50),ym=v=>T+ph-(v/maxM)*ph,yb=v=>T+ph-(v/maxB)*ph,step=pw/rows.length,bw=Math.min(22,Math.max(8,step*.30),);x.font="9px Arial";x.textBaseline="middle";x.strokeStyle="#dfe5ed";x.fillStyle="#52637c";x.textAlign="right";for(let i=0;i<=5;i++){const v=maxM*i/5,y=ym(v);x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillText(Math.round(v),L-6,y)}x.textAlign="left";for(let i=0;i<=4;i++)x.fillText(Math.round(maxB*i/4),w-R+6,yb(maxB*i/4));rows.forEach((a,i)=>{const cx=L+step*i+step/2,by=ym(0),barY=ym(a.in);x.fillStyle="#4f81bd";x.fillRect(cx-bw/2,barY,bw,by-barY);x.fillStyle="#34495e";x.textAlign="center";x.fillText(a.in,cx,Math.max(T+8,barY-9));x.fillText(a.period,cx,h-13)});function line(key,color){x.strokeStyle=color;x.fillStyle=color;x.lineWidth=2.2;x.lineJoin="round";x.lineCap="round";x.beginPath();rows.forEach((a,i)=>{const px=L+step*i+step/2,py=key==="out"?ym(a.out):yb(a.balance);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();rows.forEach((a,i)=>{const px=L+step*i+step/2,py=key==="out"?ym(a.out):yb(a.balance);x.beginPath();x.arc(px,py,3,0,Math.PI*2);x.fill();x.font="9px Arial";x.textAlign="center";x.fillText(key==="out"?a.out:a.balance,px,Math.max(T+8,py-9))})}line("out","#ef4444");line("balance","#203b6f");x.font="9px Arial";x.textAlign="left";x.fillStyle="#4f81bd";x.fillRect(L,6,13,7);x.fillStyle="#52637c";x.fillText("IN",L+18,9);x.strokeStyle="#ef4444";x.beginPath();x.moveTo(L+55,9);x.lineTo(L+70,9);x.stroke();x.fillStyle="#52637c";x.fillText("OUT",L+76,9);x.strokeStyle="#203b6f";x.beginPath();x.moveTo(L+128,9);x.lineTo(L+143,9);x.stroke();x.fillStyle="#52637c";x.fillText("BALANCE",L+149,9)}chartMonthly={canvas:canvas,clear:function(){const x=canvas.getContext("2d");if(x)x.clearRect(0,0,canvas.width,canvas.height)}};draw();if(!movementResizeBound){movementResizeBound=true;window.addEventListener("resize",function(){if(chartMonthly&&chartMonthly.canvas===canvas)draw()})}}
function renderStatusFallback(data){const c=document.getElementById("chartUnitStatus");if(!c||!data||!Array.isArray(data.datasets)||!data.datasets[0])return;const v=data.datasets[0].data.map(Number);if(!v.reduce((a,b)=>a+b,0))return;if(chartUnitStatus)try{chartUnitStatus.destroy()}catch(e){}if(typeof window.ChartJs==="function")chartUnitStatus=new window.ChartJs(c.getContext("2d"),{type:"doughnut",data:data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}})}
return{init:init,loadDashboard:loadDashboard}})();
document.addEventListener("DOMContentLoaded",function(){Dashboard.init()});
</script>
