<script>
const Dashboard=(()=>{
"use strict";
let chartUnitStatus=null,chartMonthly=null;
function init(){bindEvent();loadDashboard()}
function bindEvent(){const b=document.getElementById("btnRefreshDashboard");if(b&&!b.dataset.dashboardBound){b.dataset.dashboardBound="1";b.addEventListener("click",loadDashboard)}}
function resetDynamicSummary(){setText("summaryTotal","—");setText("summaryRFU","—");setText("summaryNon","—");setText("summaryContract","—")}
function loadDashboard(){resetDynamicSummary();showLoader("Dashboard","Memuat data dashboard...");try{const user=Auth.getUser();if(!user){hideLoader();App.login();return}google.script.run.withSuccessHandler(onDashboardLoaded).withFailureHandler(onDashboardError).dashboardGet()}catch(err){hideLoader();console.error("Dashboard error:",err);if(typeof showModal==="function")showModal("Dashboard",err.message||String(err))}}
function onDashboardLoaded(response){hideLoader();if(!response||!response.success){resetDynamicSummary();if(typeof showModal==="function")showModal("Dashboard",response?.message||"Data dashboard tidak tersedia.");return}if(!response.data){resetDynamicSummary();if(typeof showModal==="function")showModal("Dashboard","Response dashboard tidak valid.");return}renderUser(response.data.user);renderKPI(response.data.kpi);renderSummary(response.data.kpi);renderMovement(response.data.movement);renderMovementChart(response.data.movement);renderStatusFallback(response.data.chart?.status);}
function onDashboardError(error){resetDynamicSummary();hideLoader();console.error(error);if(typeof showModal==="function")showModal("System Error",error?.message||String(error))}
function renderUser(user){const e=document.getElementById("welcomeName");if(e)e.textContent="Welcome, "+(user?.name||"-")}
function setText(id,value){const e=document.getElementById(id);if(e)e.textContent=String(value??"—")}
function renderKPI(kpi){kpi=kpi||{};setText("kpiTotalUnit",fmt(kpi.totalUnit)+" Unit");setText("kpiRFU",fmt(kpi.rfu)+" Unit");setText("kpiNonRFU",fmt(kpi.nonRfu)+" Unit");setText("kpiLoan",fmt(kpi.loanPart)+" Unit")}
function renderSummary(kpi){kpi=kpi||{};setText("summaryTotal",fmt(kpi.totalUnit));setText("summaryRFU",fmt(kpi.rfu));setText("summaryNon",fmt(kpi.nonRfu));setText("summaryContract",fmt(kpi.loanPart))}
function fmt(v){return Number(v||0).toLocaleString("id-ID")}
function normalizeMovement(movement){if(!movement||!Array.isArray(movement.rows))return[];return movement.rows.map(function(row){return{period:row?.period??"",in:Number(row?.in)||0,out:Number(row?.out)||0,balance:Number(row?.balance)||0}}).filter(function(row){return row.period!==""})}
function renderMovement(movement){const rows=normalizeMovement(movement);const panels=document.querySelectorAll(".movement-panel");const tablePanel=panels[0],summaryPanel=panels[2];if(rows.length){const table=tablePanel?tablePanel.querySelector("table.movement-table"):null;if(table){let tbody=table.querySelector("tbody");if(!tbody){tbody=document.createElement("tbody");table.appendChild(tbody)}tbody.innerHTML="";rows.forEach(function(row){const tr=document.createElement("tr");tr.innerHTML="<td>"+escapeHtml(row.period)+"</td><td>"+fmt(row.in)+"</td><td>"+fmt(row.out)+"</td><td>"+fmt(row.balance)+"</td>";tbody.appendChild(tr)})}if(summaryPanel){const values=summaryPanel.querySelectorAll(".movement-kpi strong");if(values[0])values[0].textContent=fmt(movement?.ytd?.totalIn);if(values[1])values[1].textContent=fmt(movement?.ytd?.totalOut);if(values[2])values[2].textContent=fmt(movement?.ytd?.currentBalance);const ps=summaryPanel.querySelectorAll("p");if(ps.length&&movement?.ytd?.periodLabel)ps[ps.length-1].textContent="Periode: "+movement.ytd.periodLabel}}}else console.warn("Movement SUMMARY kosong/gagal. Tampilan tabel tidak dikosongkan.")}
function renderMovementChart(movement){
  const canvas=document.getElementById("chartMonthly");
  const rows=normalizeMovement(movement);
  if(!canvas||!rows.length)return;
  if(chartMonthly){try{chartMonthly.destroy()}catch(e){}chartMonthly=null}
  const labels=rows.map(r=>r.period);
  const inData=rows.map(r=>r.in);
  const outData=rows.map(r=>r.out);
  const balanceData=rows.map(r=>r.balance);
  const valueLabels={
    id:"movementValueLabels",
    afterDatasetsDraw(chart){
      const ctx=chart.ctx;
      ctx.save();
      chart.data.datasets.forEach((dataset,di)=>{
        const meta=chart.getDatasetMeta(di);
        meta.data.forEach((element,i)=>{
          const value=dataset.data[i];
          if(value===null||value===undefined||Number(value)===0)return;
          const pos=element.tooltipPosition();
          ctx.font="700 8px Arial";
          ctx.textAlign="center";
          ctx.textBaseline="bottom";
          ctx.fillStyle=di===0?"#d89b00":di===1?"#17376b":"#d93636";
          ctx.fillText(String(value),pos.x,di===2?pos.y-7:pos.y-5);
        });
      });
      ctx.restore();
    }
  };
  chartMonthly=new Chart(canvas.getContext("2d"),{
    type:"bar",
    data:{labels:labels,datasets:[
      {type:"bar",label:"IN (Unit Masuk)",data:inData,backgroundColor:"#3b9fe8",borderRadius:3,borderSkipped:false,barPercentage:.82,categoryPercentage:.78},
      {type:"bar",label:"OUT (Unit Keluar)",data:outData,backgroundColor:"#203b6f",borderRadius:3,borderSkipped:false,barPercentage:.82,categoryPercentage:.78},
      {type:"line",label:"BALANCE (Saldo Akhir)",data:balanceData,borderColor:"#e33d3d",backgroundColor:"#e33d3d",pointBackgroundColor:"#e33d3d",pointBorderColor:"#fff",pointBorderWidth:2,pointRadius:4,pointHoverRadius:5,borderWidth:2.5,tension:.2,yAxisID:"y"}
    ]},
    plugins:[valueLabels],
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"top",align:"start",labels:{boxWidth:10,boxHeight:10,font:{size:9,weight:"700"},padding:12}},tooltip:{enabled:true}},scales:{x:{grid:{display:false},ticks:{font:{size:8},color:"#667085",maxRotation:0}},y:{beginAtZero:true,suggestedMax:200,grid:{color:"#e9edf2"},ticks:{font:{size:8},color:"#667085"}}}}
  });
}
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function clearCanvas(canvas){if(!canvas)return null;const rect=canvas.getBoundingClientRect(),width=Math.max(320,Math.floor(rect.width||canvas.clientWidth||640)),height=Math.max(260,Math.floor(rect.height||canvas.clientHeight||300)),dpr=window.devicePixelRatio||1;canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+"px";canvas.style.height=height+"px";const ctx=canvas.getContext("2d");if(!ctx)return null;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);canvas.__logicalWidth=width;canvas.__logicalHeight=height;return ctx}
function renderStatusFallback(data){const canvas=document.getElementById("chartUnitStatus");if(!canvas||!data||!Array.isArray(data.datasets)||!data.datasets[0])return;if(chartUnitStatus){try{chartUnitStatus.destroy()}catch(e){}chartUnitStatus=null}const ctx=clearCanvas(canvas);if(!ctx)return;const values=data.datasets[0].data.map(Number),total=values.reduce((a,b)=>a+b,0),w=canvas.__logicalWidth||640,h=canvas.__logicalHeight||260;if(!total){ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillStyle="#7b8798";ctx.fillText("Tidak ada data",w/2,h/2);return}const cx=w/2,cy=h/2,r=Math.min(cx,cy)*.68,inner=r*.52;let start=-Math.PI/2;["#3b9fe8","#f45b78","#ff9f43"].forEach(function(color,i){const v=values[i]||0,end=start+Math.PI*2*v/total;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fillStyle=color;ctx.fill();start=end});ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over"}
return{init,loadDashboard};
})();
document.addEventListener("DOMContentLoaded",function(){Dashboard.init()});
</script>
