<script>
/* ==========================================================
   RPN SYSTEM
   DASHBOARD CONTROLLER
========================================================== */

const Dashboard = (() => {

    "use strict";

    let chartUnitStatus = null;
    let chartMonthly = null;

    /**
     * Initialize Dashboard
     */
    function init(){

    bindEvent();

}

    /**
     * Bind Event
     */
    function bindEvent() {

        const refreshButton = document.getElementById("btnRefreshDashboard");

        if (refreshButton) {

            refreshButton.addEventListener("click", loadDashboard);

        }

    }

    /**
 * Load Dashboard
 */
function loadDashboard() {

    showLoader(
        "Dashboard",
        "Memuat data dashboard..."
    );

    try {

        const user = Auth.getUser();

        if (!user) {

            hideLoader();

            App.login();

            return;

        }

        console.log(
            "DASHBOARD REQUEST DIRECT"
        );

        google.script.run

            .withSuccessHandler(

                function(response) {

                    console.log(
                        "DASHBOARD DIRECT RESPONSE:",
                        response
                    );

                    onDashboardLoaded(
                        response
                    );

                }

            )

            .withFailureHandler(

                function(error) {

                    console.error(
                        "DASHBOARD DIRECT ERROR:",
                        error
                    );

                    onDashboardError(
                        error
                    );

                }

            )

            .dashboardGet();

    }

    catch (err) {

        hideLoader();

        console.error(
            "Dashboard error:",
            err
        );

        showModal(
            "Dashboard",
            err.message || String(err)
        );

    }

}

    /**
     * Dashboard Loaded
     */
    function onDashboardLoaded(response) {

       hideLoader();

if (

    !response ||

    !response.success

){

    showModal(

        "Dashboard",

        response?.message ||

        "Data dashboard tidak tersedia."

    );

    return;

}

if(!response.data){

    showModal(

        "Dashboard",

        "Response dashboard tidak valid."

    );

    return;

}

        renderUser(response.data.user);

        renderKPI(response.data.kpi);

        renderCharts(response.data.chart);

        renderRecentActivity(response.data.activity);

        renderLatestReport(response.data.report);

    }

    /**
     * Dashboard Error
     */
    function onDashboardError(error){

    hideLoader();

    console.error(error);

    showModal(

        "System Error",

        error?.message ||

        String(error)

    );

}

    /**
     * Render User
     */
    function renderUser(user) {

    const el = document.getElementById("welcomeName");

    if (!el) return;

    el.textContent =

        "Welcome, " + (user?.name || "-");

}

    /**
     * Render KPI
     */
    function renderKPI(kpi) {

        kpi = kpi || {};

        const totalUnit = document.getElementById("kpiTotalUnit");
const rfu = document.getElementById("kpiRFU");
const nonRfu = document.getElementById("kpiNonRFU");
const loan = document.getElementById("kpiLoan");

if (totalUnit) totalUnit.textContent = kpi.totalUnit ?? 0;
if (rfu) rfu.textContent = kpi.rfu ?? 0;
if (nonRfu) nonRfu.textContent = kpi.nonRfu ?? 0;
if (loan) loan.textContent = kpi.loanPart ?? 0;

    }

    /**
     * Render Charts
     */
    function renderCharts(chart) {

    if (!chart) return;

    if (chart.status) {

        createStatusChart(chart.status);

    }

    if (chart.monthly) {

        createMonthlyChart(chart.monthly);

    }

}

    /**
 * Status Chart
 */
function createStatusChart(data) {

    if (!data) return;

    const canvas = document.getElementById("chartUnitStatus");

    if (!canvas) return;

    if (chartUnitStatus) {

        chartUnitStatus.destroy();

    }

    chartUnitStatus = new Chart(canvas, {

        type: "doughnut",

        data: data,

        options: {

    responsive: true,

    maintainAspectRatio: false,

    animation: false,

    plugins: {

        legend: {

            position: "bottom"

        }

    }

}

    });

}

    /**
     * Monthly Chart
     */
    function createMonthlyChart(data) {

    if (!data) return;

    const canvas = document.getElementById("chartMonthly");

    if (!canvas) return;

    if (chartMonthly) {

        chartMonthly.destroy();

    }

    chartMonthly = new Chart(canvas, {

        type: "bar",

        data: data,

        options: {

    responsive: true,

    maintainAspectRatio: false,

    animation: false,

    plugins: {

        legend: {

            position: "bottom"

        }

    }

}

    });

}

    /**
     * Recent Activity
     */
    function renderRecentActivity(activity) {

        const container = document.getElementById("recentActivity");

        if (!container) return;

        container.innerHTML = "";

        if (!activity || activity.length === 0) {

            container.innerHTML = "<p>Tidak ada aktivitas.</p>";

            return;

        }

        activity.forEach(function(item) {

            const div = document.createElement("div");

            div.className = "activity-item";

            div.innerHTML = `
                <strong>${item.title}</strong>
                <div>${item.description}</div>
                <small>${item.time}</small>
            `;

            container.appendChild(div);

        });

    }

    /**
     * Latest Report
     */
    function renderLatestReport(report) {

        const tbody = document.getElementById("dashboardReport");

        if (!tbody) return;

        tbody.innerHTML = "";

        if (!report || report.length === 0) {

            return;

        }

        report.forEach(function(row) {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.date}</td>
                <td>${row.unit}</td>
                <td>${row.status}</td>
                <td>${row.mechanic}</td>
            `;

            tbody.appendChild(tr);

        });

    }

    /**
     * Public
     */
    return {

        init,

        loadDashboard

    };

})();

/* ==========================================================
   INITIALIZE
========================================================== */

document.addEventListener("DOMContentLoaded", function () {

    Dashboard.init();

});
</script>
