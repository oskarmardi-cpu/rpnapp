<script>
const Dashboard=(()=>{
"use strict";
let chartUnitStatus=null,chartMonthly=null;
function init(){bindEvent()}
function bindEvent(){const b=document.getElementById("btnRefreshDashboard");if(b&&!b.dataset.dashboardBound){b.dataset.dashboardBound="1";b.addEventListener("click",loadDashboard)}}
function loadDashboard(){showLoader("Dashboard","Memuat data dashboard...");try{const user=Auth.getUser();if(!user){hideLoader();App.login();return}google.script.run.withSuccessHandler(onDashboardLoaded).withFailureHandler(onDashboardError).dashboardGet()}catch(err){hideLoader();console.error("Dashboard error:",err);if(typeof showModal==="function")showModal("Dashboard",err.message||String(err))}}
function onDashboardLoaded(response){hideLoader();if(!response||!response.success){if(typeof showModal==="function")showModal("Dashboard",response?.message||"Data dashboard tidak tersedia.");return}if(!response.data){if(typeof showModal==="function")showModal("Dashboard","Response dashboard tidak valid.");return}renderUser(response.data.user);renderKPI(response.data.kpi);renderMovement(response.data.movement);renderCharts(response.data.chart);renderRecentActivity(response.data.activity);renderLatestReport(response.data.report)}
function onDashboardError(error){hideLoader();console.error(error);if(typeof showModal==="function")showModal("System Error",error?.message||String(error))}
function renderUser(user){const e=document.getElementById("welcomeName");if(e)e.textContent="Welcome, "+(user?.name||"-")}
function renderKPI(kpi){kpi=kpi||{};const total=document.getElementById("kpiTotalUnit"),rfu=document.getElementById("kpiRFU"),non=document.getElementById("kpiNonRFU"),loan=document.getElementById("kpiLoan");if(total)total.firstChild.nodeValue=(kpi.totalUnit??0)+" ";if(rfu)rfu.firstChild.nodeValue=(kpi.rfu??0)+" ";if(non)non.firstChild.nodeValue=(kpi.nonRfu??0)+" ";if(loan&&loan.firstChild)loan.firstChild.nodeValue=(kpi.loanPart??0)+" "}
function fmt(v){return Number(v||0).toLocaleString("id-ID")}
function renderMovement(movement){
  if(!movement||!Array.isArray(movement.rows)||!movement.rows.length)return;
  const panel=document.querySelector(".movement-panel:not(.trend)");
  const table=panel?panel.querySelector("table.movement-table"):null;
  if(table){
    const tbody=table.querySelector("tbody");
    if(tbody){tbody.innerHTML="";movement.rows.forEach(function(row){const tr=document.createElement("tr");tr.innerHTML="<td>"+escapeHtml(row.period)+"</td><td>"+fmt(row.in)+"</td><td>"+fmt(row.out)+"</td><td>"+fmt(row.balance)+"</td>";tbody.appendChild(tr)})}
  }
  const summaryPanel=document.querySelectorAll(".movement-panel")[2];
  if(summaryPanel){
    const values=summaryPanel.querySelectorAll(".movement-kpi strong");
    if(values[0])values[0].textContent=fmt(movement.ytd?.totalIn);
    if(values[1])values[1].textContent=fmt(movement.ytd?.totalOut);
    if(values[2])values[2].textContent=fmt(movement.ytd?.currentBalance);
    const ps=summaryPanel.querySelectorAll("p");
    if(ps.length)ps[ps.length-1].textContent="Periode: "+(movement.ytd?.periodLabel||"");
  }
}
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function renderCharts(chart){if(!chart)return;if(typeof Chart!=="function"){console.warn("Chart library unavailable; dashboard charts skipped.");return}if(chart.status)createStatusChart(chart.status);if(chart.monthly)createMonthlyChart(chart.monthly)}
function createStatusChart(data){const canvas=document.getElementById("chartUnitStatus");if(!data||!canvas||typeof Chart!=="function")return;if(chartUnitStatus)chartUnitStatus.destroy();chartUnitStatus=new Chart(canvas,{type:"doughnut",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom"}}}})}
function createMonthlyChart(data){const canvas=document.getElementById("chartMonthly");if(!data||!canvas||typeof Chart!=="function")return;if(chartMonthly)chartMonthly.destroy();chartMonthly=new Chart(canvas,{type:"bar",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"top"}},scales:{y:{beginAtZero:true},x:{ticks:{maxRotation:45,minRotation:0}}}}})}
function renderRecentActivity(activity){const c=document.getElementById("recentActivity");if(!c)return;c.innerHTML="";if(!activity||!activity.length){c.innerHTML="<p>Tidak ada aktivitas.</p>";return}activity.forEach(i=>{const d=document.createElement("div");d.className="dashboard-activity-item";d.innerHTML=`<div class="dashboard-activity-icon kpi-purple"><i class="fa-solid fa-clock"></i></div><div class="dashboard-activity-content"><strong>${escapeHtml(i.title)}</strong><small>${escapeHtml(i.description)} ${escapeHtml(i.time)}</small></div>`;c.appendChild(d)})}
function renderLatestReport(report){const t=document.getElementById("dashboardReport");if(!t)return;t.innerHTML="";(report||[]).forEach(r=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${escapeHtml(r.date)}</td><td>${escapeHtml(r.unit)}</td><td>${escapeHtml(r.status)}</td><td>${escapeHtml(r.mechanic)}</td>`;t.appendChild(tr)})}
return{init,loadDashboard};
})();
document.addEventListener("DOMContentLoaded",function(){Dashboard.init()});
</script>
