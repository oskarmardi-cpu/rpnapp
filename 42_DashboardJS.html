<script>
const Dashboard = (function () {
  "use strict";

  var chartMonthly = null;
  var chartUnitStatus = null;

  function init() {
    bindEvent();
    loadDashboard();
  }

  function bindEvent() {
    var button = document.getElementById("btnRefreshDashboard");
    if (button && !button.dataset.dashboardBound) {
      button.dataset.dashboardBound = "1";
      button.addEventListener("click", loadDashboard);
    }
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(value == null ? "—" : value);
  }

  function fmt(value) {
    return Number(value || 0).toLocaleString("id-ID");
  }

  function loadDashboard() {
    console.log("DASHBOARD: load start");

    try {
      if (typeof Loader !== "undefined" && Loader.show) {
        Loader.show("Memuat data dashboard...");
      }

      var user = typeof Auth !== "undefined" && Auth.getUser ? Auth.getUser() : null;
      if (!user) {
        if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
        console.warn("DASHBOARD: user session tidak tersedia");
        return;
      }

      if (!google || !google.script || !google.script.run) {
        throw new Error("Google Apps Script runtime tidak tersedia.");
      }

      google.script.run
        .withSuccessHandler(onDashboardLoaded)
        .withFailureHandler(onDashboardError)
        .dashboardGet();

    } catch (error) {
      console.error("DASHBOARD LOAD ERROR:", error);
      if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
      if (typeof showModal === "function") showModal("Dashboard", error.message || String(error));
    }
  }

  function onDashboardLoaded(response) {
    console.log("DASHBOARD RESPONSE:", response);
    if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();

    if (!response || response.success !== true) {
      console.error("DASHBOARD RESPONSE INVALID:", response);
      return;
    }

    var data = response.data || {};
    renderUser(data.user);
    renderKPI(data.kpi || {});
    renderSummary(data.kpi || {});
    renderMovement(data.movement || {});
    renderMovementChart(data.movement || {});

    var chart = data.chart || {};
    renderStatusFallback(chart.status);
  }

  function onDashboardError(error) {
    if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
    console.error("DASHBOARD SERVER ERROR:", error);
  }

  function renderUser(user) {
    var el = document.getElementById("welcomeName");
    if (el) el.textContent = "Welcome, " + (user && user.name ? user.name : "Administrator RPN");
  }

  function renderKPI(kpi) {
    setText("kpiTotalUnit", fmt(kpi.totalUnit) + " Unit");
    setText("kpiRFU", fmt(kpi.rfu) + " Unit");
    setText("kpiNonRFU", fmt(kpi.nonRfu) + " Unit");
    setText("kpiLoan", fmt(kpi.loanPart) + " Unit");
  }

  function renderSummary(kpi) {
    setText("summaryTotal", fmt(kpi.totalUnit));
    setText("summaryRFU", fmt(kpi.rfu));
    setText("summaryNon", fmt(kpi.nonRfu));
    setText("summaryContract", fmt(kpi.loanPart));
  }

  function normalizeMovement(movement) {
    if (!movement) return [];
    if (Array.isArray(movement.rows)) {
      return movement.rows.map(function (row) {
        return {
          period: row && row.period != null ? row.period : "",
          in: Number(row && row.in) || 0,
          out: Number(row && row.out) || 0,
          balance: Number(row && row.balance) || 0
        };
      }).filter(function (row) { return row.period !== ""; });
    }
    if (Array.isArray(movement.labels)) {
      return movement.labels.map(function (label, i) {
        return {
          period: label,
          in: Number((movement.in || [])[i]) || 0,
          out: Number((movement.out || [])[i]) || 0,
          balance: Number((movement.balance || [])[i]) || 0
        };
      });
    }
    return [];
  }

  function renderMovement(movement) {
    var rows = normalizeMovement(movement);
    console.log("DASHBOARD MOVEMENT ROWS:", rows);
    if (!rows.length) return;

    var panels = document.querySelectorAll(".movement-panel");
    var tablePanel = panels.length ? panels[0] : null;
    var summaryPanel = panels.length > 2 ? panels[2] : null;
    var table = tablePanel ? tablePanel.querySelector("table.movement-table") : null;

    if (table) {
      var tbody = table.querySelector("tbody");
      if (!tbody) {
        tbody = document.createElement("tbody");
        table.appendChild(tbody);
      }
      tbody.innerHTML = "";
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        tr.innerHTML = "<td>" + escapeHtml(row.period) + "</td>" +
          "<td>" + fmt(row.in) + "</td>" +
          "<td>" + fmt(row.out) + "</td>" +
          "<td>" + fmt(row.balance) + "</td>";
        tbody.appendChild(tr);
      });
    }

    if (summaryPanel) {
      var ytd = movement.ytd || {};
      var values = summaryPanel.querySelectorAll(".movement-kpi strong");
      if (values[0]) values[0].textContent = fmt(ytd.totalIn);
      if (values[1]) values[1].textContent = fmt(ytd.totalOut);
      if (values[2]) values[2].textContent = fmt(ytd.currentBalance);
      var p = summaryPanel.querySelectorAll("p");
      if (p.length && ytd.periodLabel) p[p.length - 1].textContent = "Periode: " + ytd.periodLabel;
    }
  }

  function renderMovementChart(movement) {
    var canvas = document.getElementById("chartMonthly");
    var rows = normalizeMovement(movement);
    if (!canvas || !rows.length || typeof Chart !== "function") return;

    if (chartMonthly) {
      try { chartMonthly.destroy(); } catch (e) {}
    }

    chartMonthly = new Chart(canvas.getContext("2d"), {
      type: "bar",
      data: {
        labels: rows.map(function (r) { return r.period; }),
        datasets: [
          { type: "bar", label: "IN (Unit Masuk)", data: rows.map(function (r) { return r.in; }), backgroundColor: "#3b9fe8", borderRadius: 3 },
          { type: "bar", label: "OUT (Unit Keluar)", data: rows.map(function (r) { return r.out; }), backgroundColor: "#203b6f", borderRadius: 3 },
          { type: "line", label: "BALANCE (Saldo Akhir)", data: rows.map(function (r) { return r.balance; }), borderColor: "#e33d3d", backgroundColor: "#e33d3d", pointBackgroundColor: "#e33d3d", pointRadius: 4, borderWidth: 2.5, tension: 0.2 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { position: "top" } },
        scales: { x: { grid: { display: false } }, y: { beginAtZero: true } }
      }
    });
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>\"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderStatusFallback(data) {
    var canvas = document.getElementById("chartUnitStatus");
    if (!canvas || !data || !Array.isArray(data.datasets) || !data.datasets[0]) return;

    var values = data.datasets[0].data.map(Number);
    var total = values.reduce(function (sum, value) { return sum + value; }, 0);
    if (!total) return;

    if (chartUnitStatus) {
      try { chartUnitStatus.destroy(); } catch (e) {}
    }

    if (typeof Chart === "function") {
      chartUnitStatus = new Chart(canvas.getContext("2d"), {
        type: "doughnut",
        data: data,
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
      });
    }
  }

  return {
    init: init,
    loadDashboard: loadDashboard
  };
}());

document.addEventListener("DOMContentLoaded", function () {
  Dashboard.init();
});
</script>
