<script>
const Dashboard=(()=>{
"use strict";
let chartUnitStatus=null,chartMonthly=null;
function init(){bindEvent()}
function bindEvent(){const b=document.getElementById("btnRefreshDashboard");if(b&&!b.dataset.dashboardBound){b.dataset.dashboardBound="1";b.addEventListener("click",loadDashboard)}}
function loadDashboard(){showLoader("Dashboard","Memuat data dashboard...");try{const user=Auth.getUser();if(!user){hideLoader();App.login();return}google.script.run.withSuccessHandler(onDashboardLoaded).withFailureHandler(onDashboardError).dashboardGet()}catch(err){hideLoader();console.error("Dashboard error:",err);if(typeof showModal==="function")showModal("Dashboard",err.message||String(err))}}
function onDashboardLoaded(response){hideLoader();if(!response||!response.success){if(typeof showModal==="function")showModal("Dashboard",response?.message||"Data dashboard tidak tersedia.");return}if(!response.data){if(typeof showModal==="function")showModal("Dashboard","Response dashboard tidak valid.");return}renderUser(response.data.user);renderKPI(response.data.kpi);renderSummary(response.data.kpi);renderMovement(response.data.movement);renderCharts(response.data.chart)}
function onDashboardError(error){hideLoader();console.error(error);if(typeof showModal==="function")showModal("System Error",error?.message||String(error))}
function renderUser(user){const e=document.getElementById("welcomeName");if(e)e.textContent="Welcome, "+(user?.name||"-")}
function setText(id,value){const e=document.getElementById(id);if(e)e.textContent=String(value??0)}
function renderKPI(kpi){kpi=kpi||{};setText("kpiTotalUnit",fmt(kpi.totalUnit)+" Unit");setText("kpiRFU",fmt(kpi.rfu)+" Unit");setText("kpiNonRFU",fmt(kpi.nonRfu)+" Unit");setText("kpiLoan",fmt(kpi.loanPart)+" Unit")}
function renderSummary(kpi){kpi=kpi||{};setText("summaryTotal",fmt(kpi.totalUnit));setText("summaryRFU",fmt(kpi.rfu));setText("summaryNon",fmt(kpi.nonRfu));setText("summaryContract",fmt(kpi.loanPart))}
function fmt(v){return Number(v||0).toLocaleString("id-ID")}
function renderMovement(movement){
  if(!movement||!Array.isArray(movement.rows)||!movement.rows.length)return;
  const panel=document.querySelector(".movement-panel:not(.trend)");
  const table=panel?panel.querySelector("table.movement-table"):null;
  if(table){const tbody=table.querySelector("tbody");if(tbody){tbody.innerHTML="";movement.rows.forEach(function(row){const tr=document.createElement("tr");tr.innerHTML="<td>"+escapeHtml(row.period)+"</td><td>"+fmt(row.in)+"</td><td>"+fmt(row.out)+"</td><td>"+fmt(row.balance)+"</td>";tbody.appendChild(tr)})}}
  const summaryPanel=document.querySelectorAll(".movement-panel")[2];
  if(summaryPanel){const values=summaryPanel.querySelectorAll(".movement-kpi strong");if(values[0])values[0].textContent=fmt(movement.ytd?.totalIn);if(values[1])values[1].textContent=fmt(movement.ytd?.totalOut);if(values[2])values[2].textContent=fmt(movement.ytd?.currentBalance);const ps=summaryPanel.querySelectorAll("p");if(ps.length)ps[ps.length-1].textContent="Periode: "+(movement.ytd?.periodLabel||"")}
}
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function renderCharts(chart){if(!chart)return;renderStatusFallback(chart.status);renderMonthlyFallback(chart.monthly);if(typeof Chart!=="function"){console.warn("Chart library unavailable; native dashboard chart fallback rendered.");return}if(chart.status)createStatusChart(chart.status);if(chart.monthly)createMonthlyChart(chart.monthly)}
function clearCanvas(canvas){if(!canvas)return null;const ctx=canvas.getContext("2d");if(!ctx)return null;ctx.clearRect(0,0,canvas.width,canvas.height);return ctx}
function renderStatusFallback(data){const canvas=document.getElementById("chartUnitStatus");if(!canvas||!data||!Array.isArray(data.datasets)||!data.datasets[0])return;const ctx=clearCanvas(canvas);if(!ctx)return;const values=data.datasets[0].data.map(Number),total=values.reduce((a,b)=>a+b,0);if(!total){ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("Tidak ada data",canvas.width/2,canvas.height/2);return}const cx=canvas.width/2,cy=canvas.height/2,r=Math.min(cx,cy)*.68,inner=r*.52;let start=-Math.PI/2;const colors=["#3b9fe8","#f45b78","#ff9f43"];values.forEach(function(v,i){const end=start+(Math.PI*2*v/total);ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill() ;start=end});ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(cx,cy,inner,0,Math.PI*2);ctx.fill();ctx.globalCompositeOperation="source-over";ctx.fillStyle="#17233c";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.fillText(total,cx,cy+7)}
function renderMonthlyFallback(data){const canvas=document.getElementById("chartMonthly");if(!canvas||!data||!Array.isArray(data.labels)||!data.labels.length)return;const ctx=clearCanvas(canvas);if(!ctx)return;const labels=data.labels,datasets=data.datasets||[];const w=canvas.width,h=canvas.height;const pad={l:42,r:18,t:20,b:34};const plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b;const all=[];datasets.forEach(function(ds){(ds.data||[]).forEach(function(v){all.push(Number(v)||0)})});const max=Math.max(1,...all);ctx.strokeStyle="#e5eaf1";ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=pad.t+plotH-(plotH*i/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle="#7b8798";ctx.font="9px sans-serif";ctx.textAlign="right";ctx.fillText(Math.round(max*i/4),pad.l-6,y+3)}const barSets=datasets.filter(ds=>ds.type!=="line");const lineSet=datasets.find(ds=>ds.type==="line");const groupW=plotW/labels.length;const barW=Math.max(5,Math.min(18,groupW/(barSets.length+2)));barSets.forEach(function(ds,di){ctx.fillStyle=di===0?"#2f82ee":"#203b6f";(ds.data||[]).forEach(function(v,i){const value=Number(v)||0,x=pad.l+i*groupW+groupW/2+(di-(barSets.length-1)/2)*barW-barW/2,y=pad.t+plotH-(value/max)*plotH;ctx.fillRect(x,y,barW,(value/max)*plotH)})});if(lineSet){ctx.strokeStyle="#ef4444";ctx.lineWidth=2;ctx.beginPath();(lineSet.data||[]).forEach(function(v,i){const value=Number(v)||0,x=pad.l+i*groupW+groupW/2,y=pad.t+plotH-(value/max)*plotH;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle="#ef4444";(lineSet.data||[]).forEach(function(v,i){const value=Number(v)||0,x=pad.l+i*groupW+groupW/2,y=pad.t+plotH-(value/max)*plotH;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()})}ctx.fillStyle="#7b8798";ctx.font="8px sans-serif";ctx.textAlign="center";labels.forEach(function(label,i){const x=pad.l+i*groupW+groupW/2;ctx.fillText(String(label),x,h-10)})}
function createStatusChart(data){const canvas=document.getElementById("chartUnitStatus");if(!data||!canvas||typeof Chart!=="function")return;if(chartUnitStatus)chartUnitStatus.destroy();chartUnitStatus=new Chart(canvas,{type:"doughnut",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom"}}}})}
function createMonthlyChart(data){const canvas=document.getElementById("chartMonthly");if(!data||!canvas||typeof Chart!=="function")return;if(chartMonthly)chartMonthly.destroy();chartMonthly=new Chart(canvas,{type:"bar",data:data,options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"top"}},scales:{y:{beginAtZero:true},x:{ticks:{maxRotation:45,minRotation:0}}}}})}
return{init,loadDashboard};
})();
document.addEventListener("DOMContentLoaded",function(){Dashboard.init()});
</script>
