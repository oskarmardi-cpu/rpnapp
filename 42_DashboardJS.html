<script>
const Dashboard = (function () {
  "use strict";

  var chartMonthly = null;
  var chartUnitStatus = null;
  var movementResizeBound = false;

  function init() {
    bindEvent();
    loadDashboard();
  }

  function bindEvent() {
    var button = document.getElementById("btnRefreshDashboard");
    if (button && !button.dataset.dashboardBound) {
      button.dataset.dashboardBound = "1";
      button.addEventListener("click", loadDashboard);
    }
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = String(value == null ? "—" : value);
  }

  function fmt(value) {
    return Number(value || 0).toLocaleString("id-ID");
  }

  function loadDashboard() {
    console.log("DASHBOARD: load start");

    try {
      if (typeof Loader !== "undefined" && Loader.show) {
        Loader.show("Memuat data dashboard...");
      }

      var user = typeof Auth !== "undefined" && Auth.getUser ? Auth.getUser() : null;
      if (!user) {
        if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
        console.warn("DASHBOARD: user session tidak tersedia");
        return;
      }

      if (!google || !google.script || !google.script.run) {
        throw new Error("Google Apps Script runtime tidak tersedia.");
      }

      google.script.run
        .withSuccessHandler(onDashboardLoaded)
        .withFailureHandler(onDashboardError)
        .dashboardGet();

    } catch (error) {
      console.error("DASHBOARD LOAD ERROR:", error);
      if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
      if (typeof showModal === "function") showModal("Dashboard", error.message || String(error));
    }
  }

  function onDashboardLoaded(response) {
    console.log("DASHBOARD RESPONSE:", response);
    if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();

    if (!response || response.success !== true) {
      console.error("DASHBOARD RESPONSE INVALID:", response);
      return;
    }

    var data = response.data || {};
    renderUser(data.user);
    renderKPI(data.kpi || {});
    renderSummary(data.kpi || {});
    renderMovement(data.movement || {});
    renderMovementChart(data.movement || {});

    var chart = data.chart || {};
    renderStatusFallback(chart.status);
  }

  function onDashboardError(error) {
    if (typeof Loader !== "undefined" && Loader.hide) Loader.hide();
    console.error("DASHBOARD SERVER ERROR:", error);
  }

  function renderUser(user) {
    var el = document.getElementById("welcomeName");
    if (el) el.textContent = "Welcome, " + (user && user.name ? user.name : "Administrator RPN");
  }

  function renderKPI(kpi) {
    setText("kpiTotalUnit", fmt(kpi.totalUnit) + " Unit");
    setText("kpiRFU", fmt(kpi.rfu) + " Unit");
    setText("kpiNonRFU", fmt(kpi.nonRfu) + " Unit");
    setText("kpiLoan", fmt(kpi.loanPart) + " Unit");
  }

  function renderSummary(kpi) {
    setText("summaryTotal", fmt(kpi.totalUnit));
    setText("summaryRFU", fmt(kpi.rfu));
    setText("summaryNon", fmt(kpi.nonRfu));
    setText("summaryContract", fmt(kpi.loanPart));
  }

  function normalizeMovement(movement) {
    if (!movement) return [];
    if (Array.isArray(movement.rows)) {
      return movement.rows.map(function (row) {
        return {
          period: row && row.period != null ? row.period : "",
          in: Number(row && row.in) || 0,
          out: Number(row && row.out) || 0,
          balance: Number(row && row.balance) || 0
        };
      }).filter(function (row) { return row.period !== ""; });
    }
    if (Array.isArray(movement.labels)) {
      return movement.labels.map(function (label, i) {
        return {
          period: label,
          in: Number((movement.in || [])[i]) || 0,
          out: Number((movement.out || [])[i]) || 0,
          balance: Number((movement.balance || [])[i]) || 0
        };
      });
    }
    return [];
  }

  function renderMovement(movement) {
    var rows = normalizeMovement(movement);
    console.log("DASHBOARD MOVEMENT ROWS:", rows);
    if (!rows.length) return;

    var panels = document.querySelectorAll(".movement-panel");
    var tablePanel = panels.length ? panels[0] : null;
    var summaryPanel = panels.length > 2 ? panels[2] : null;
    var table = tablePanel ? tablePanel.querySelector("table.movement-table") : null;

    if (table) {
      var tbody = table.querySelector("tbody");
      if (!tbody) {
        tbody = document.createElement("tbody");
        table.appendChild(tbody);
      }
      tbody.innerHTML = "";
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        tr.innerHTML = "<td>" + escapeHtml(row.period) + "</td>" +
          "<td>" + fmt(row.in) + "</td>" +
          "<td>" + fmt(row.out) + "</td>" +
          "<td>" + fmt(row.balance) + "</td>";
        tbody.appendChild(tr);
      });
    }

    if (summaryPanel) {
      var ytd = movement.ytd || {};
      var values = summaryPanel.querySelectorAll(".movement-kpi strong");
      if (values[0]) values[0].textContent = fmt(ytd.totalIn);
      if (values[1]) values[1].textContent = fmt(ytd.totalOut);
      if (values[2]) values[2].textContent = fmt(ytd.currentBalance);
      var p = summaryPanel.querySelectorAll("p");
      if (p.length && ytd.periodLabel) p[p.length - 1].textContent = "Periode: " + ytd.periodLabel;
    }
  }

  function renderMovementChart(movement) {
    var canvas = document.getElementById("chartMonthly");
    var rows = normalizeMovement(movement);

    if (!canvas || !rows.length) {
      console.warn("DASHBOARD CHART: canvas atau data movement tidak tersedia");
      return;
    }

    if (chartMonthly && chartMonthly.canvas === canvas) {
      chartMonthly.clear();
    }

    function draw() {
      var rect = canvas.getBoundingClientRect();
      var cssWidth = Math.max(320, Math.floor(rect.width || canvas.parentElement.clientWidth || 700));
      var cssHeight = Math.max(220, Math.floor(rect.height || 245));
      var dpr = window.devicePixelRatio || 1;

      canvas.width = Math.floor(cssWidth * dpr);
      canvas.height = Math.floor(cssHeight * dpr);
      canvas.style.width = cssWidth + "px";
      canvas.style.height = cssHeight + "px";

      var ctx = canvas.getContext("2d");
      if (!ctx) return;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssWidth, cssHeight);
      ctx.font = "10px Arial, sans-serif";
      ctx.textBaseline = "middle";

      var left = 42;
      var right = 42;
      var top = 18;
      var bottom = 34;
      var plotW = cssWidth - left - right;
      var plotH = cssHeight - top - bottom;
      var maxMovement = Math.max(10, rows.reduce(function (m, r) { return Math.max(m, r.in, r.out); }, 0));
      var maxBalance = Math.max(10, rows.reduce(function (m, r) { return Math.max(m, r.balance); }, 0));
      var movementMax = Math.ceil(maxMovement / 10) * 10;
      var balanceMax = Math.ceil(maxBalance / 50) * 50;
      if (movementMax < 50) movementMax = 50;
      if (balanceMax < 200) balanceMax = 200;

      function x(i) {
        return left + (rows.length === 1 ? plotW / 2 : (plotW * i / (rows.length - 1)));
      }
      function yMovement(v) {
        return top + plotH - (v / movementMax) * plotH;
      }
      function yBalance(v) {
        return top + plotH - (v / balanceMax) * plotH;
      }

      ctx.strokeStyle = "#dfe5ed";
      ctx.lineWidth = 1;
      ctx.fillStyle = "#52637c";
      ctx.textAlign = "right";

      for (var tick = 0; tick <= 5; tick++) {
        var mv = movementMax * tick / 5;
        var yy = yMovement(mv);
        ctx.beginPath();
        ctx.moveTo(left, yy);
        ctx.lineTo(cssWidth - right, yy);
        ctx.stroke();
        ctx.fillText(String(Math.round(mv)), left - 7, yy);
      }

      ctx.textAlign = "left";
      for (var btick = 0; btick <= 4; btick++) {
        var bv = balanceMax * btick / 4;
        var by = yBalance(bv);
        ctx.fillText(String(Math.round(bv)), cssWidth - right + 7, by);
      }

      var step = plotW / rows.length;
      var barWidth = Math.min(18, Math.max(8, step * 0.24));
      var gap = Math.max(3, barWidth * 0.25);
      ctx.textAlign = "center";

      rows.forEach(function (row, i) {
        var center = left + step * i + step / 2;
        var inX = center - barWidth - gap / 2;
        var outX = center + gap / 2;
        var inY = yMovement(row.in);
        var outY = yMovement(row.out);
        var baseY = yMovement(0);

        ctx.fillStyle = "#3b82d0";
        ctx.fillRect(inX, inY, barWidth, Math.max(0, baseY - inY));
        ctx.fillStyle = "#203b6f";
        ctx.fillRect(outX, outY, barWidth, Math.max(0, baseY - outY));

        ctx.fillStyle = "#42526b";
        ctx.font = "9px Arial, sans-serif";
        ctx.fillText(String(row.in), inX + barWidth / 2, Math.max(top + 8, inY - 9));
        ctx.fillText(String(row.out), outX + barWidth / 2, Math.max(top + 8, outY - 9));
        ctx.fillStyle = "#667085";
        ctx.fillText(String(row.period), center, cssHeight - 14);
      });

      ctx.strokeStyle = "#e33d3d";
      ctx.fillStyle = "#e33d3d";
      ctx.lineWidth = 2.5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      rows.forEach(function (row, i) {
        var px = left + step * i + step / 2;
        var py = yBalance(row.balance);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();

      rows.forEach(function (row, i) {
        var px = left + step * i + step / 2;
        var py = yBalance(row.balance);
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "9px Arial, sans-serif";
        ctx.fillText(String(row.balance), px, Math.max(top + 8, py - 10));
      });

      ctx.textAlign = "left";
      ctx.font = "9px Arial, sans-serif";
      var legendY = 8;
      ctx.fillStyle = "#3b82d0";
      ctx.fillRect(left, legendY - 4, 14, 7);
      ctx.fillStyle = "#203b6f";
      ctx.fillRect(left + 74, legendY - 4, 14, 7);
      ctx.fillStyle = "#e33d3d";
      ctx.beginPath();
      ctx.arc(left + 151, legendY, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#52637c";
      ctx.fillText("IN", left + 19, legendY);
      ctx.fillText("OUT", left + 93, legendY);
      ctx.fillText("BALANCE", left + 160, legendY);
    }

    chartMonthly = {
      canvas: canvas,
      clear: function () {
        var ctx = canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    };

    draw();

    if (!movementResizeBound) {
      movementResizeBound = true;
      window.addEventListener("resize", function () {
        if (chartMonthly && chartMonthly.canvas === canvas) draw();
      });
    }
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>\"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderStatusFallback(data) {
    var canvas = document.getElementById("chartUnitStatus");
    if (!canvas || !data || !Array.isArray(data.datasets) || !data.datasets[0]) return;

    var values = data.datasets[0].data.map(Number);
    var total = values.reduce(function (sum, value) { return sum + value; }, 0);
    if (!total) return;

    if (chartUnitStatus) {
      try { chartUnitStatus.destroy(); } catch (e) {}
    }

    if (typeof window.ChartJs === "function") {
      chartUnitStatus = new window.ChartJs(canvas.getContext("2d"), {
        type: "doughnut",
        data: data,
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
      });
    }
  }

  return {
    init: init,
    loadDashboard: loadDashboard
  };
}());

document.addEventListener("DOMContentLoaded", function () {
  Dashboard.init();
});
</script>
